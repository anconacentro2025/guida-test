        :root {

        * {

            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            color: var(--text);
            line-height: 1.5;
            padding-bottom: 90px;
        }

        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 24px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 400;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--gold);
            border-color: var(--gold);
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-panel {
            display: none;
        }

        .section-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-header-icon {
            font-size: 1.25rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--navy);
        }

        .card-body {
            font-size: 0.875rem;
            color: var(--text);
            line-height: 1.6;
        }

        .card-body a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
        }

        .card-body a:hover {
            text-decoration: underline;
        }

        /* Itinerary Timeline Styles */
        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid var(--border);
            margin-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .timeline-item {
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--card-bg);
        }

        .timeline-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .timeline-desc {
            font-size: 0.825rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .gps-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 12px;

            font-size: 0.775rem;
            color: var(--navy);
            font-weight: 500;
            text-decoration: none;

        // Cambia lingua a livello globale
        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
            updateStaticLabels();
            // Rerendering completo dei pannelli attivi

            document.getElementById('itineraries-content').innerHTML = renderItineraries();
            document.getElementById('food-content').innerHTML = renderFood();
            document.getElementById('transport-content').innerHTML = renderTransport();
        }

        // Cambia la sezione visibile dai pulsanti di navigazione inferiori
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            window.scrollTo(0,0);
        }

        // RENDERING SEZIONE APPARTAMENTO CON COMPONENTE TAB INTERATTIVO "COME RAGGIUNGERCI" (V5.0)
        function renderApartment() {
            const a = appData.apartment;
            
            const reachData = {
                title: tr('📍 Come raggiungerci', '📍 How to reach us', '📍 Anreise', '📍 Jak do nas dotrzeć'),
                autoLabel: tr('🚗 In auto', '🚗 By car', '🚗 Mit dem Auto', '🚗 Samochodem'),
                trenoLabel: tr('🚆 In treno', '🚆 By train', '🚆 Mit dem Zug', '🚆 Pociągiem'),
                aereoLabel: tr('✈️ In aereo', '✈️ By air', '✈️ Mit dem Flugzeug', '✈️ Samolotem'),
                autoBody: tr(
                    `L’alloggio è in zona pedonale, è possibile parcheggiare su strada nei dintorni sulle strisce blu (a pagamento dalle 8 alle 20 a 1,20€/h dei giorni feriali) o nei diversi parcheggi coperti. Se si intende girare in centro non si ha bisogno dell’auto e io consiglio di lasciarla nel più economico <a href="https://anconaservizi.it/parcheggi-coperti/parcheggio-scambiatore-degli-archi/" target="_blank" rel="noopener">parcheggio multipiano degli archi</a>, ad 1,5 km di distanza, con l’alloggio facilmente raggiungibile o a piedi con una passeggiata tutta pianeggiante.<br><br>Se preferisci l’autobus prendi il bus 1/4 direzione centro e scendi in piazza Roma, ci mette 5 minuti. Attraversa la piazza, il n. 3 è a sinistra della fontana dei cavalli.<br>Al portone suona al campanello Frisoli, poi prendi l’ascensore fino al quarto piano.`,
                    `The accommodation is located in a pedestrian zone. You can park on the street nearby within the blue lines (paid from 8:00 to 20:00 at €1.20/h on weekdays) or in various covered parking garages. If you plan to visit the city center, you won't need a car, so I recommend leaving it in the cheaper multi-story <a href="https://anconaservizi.it/parcheggi-coperti/parcheggio-scambiatore-degli-archi/" target="_blank" rel="noopener">parking lot "Degli Archi"</a>, 1.5 km away, from where the accommodation is easily reachable on foot with a completely flat walk.<br><br>If you prefer the bus, take line 1/4 towards the center and get off at Piazza Roma (it takes 5 minutes). Cross the square; number 3 is to the left of the horse fountain.<br>At the main door, ring the bell for Frisoli, then take the elevator to the fourth floor.`,
                    `Die Unterkunft befindet sich in einer Fußgängerzone. Sie können in der Umgebung am Straßenrand auf den blauen Linien parken (werktags von 8:00 bis 20:00 Uhr kostenpflichtig für 1,20 €/Std.) oder in den verschiedenen Parkhäusern. Wenn Sie das Stadtzentrum besichtigen möchten, benötigen Sie kein Auto. Ich empire daher, es auf dem günstigeren <a href="https://anconaservizi.it/parcheggi-coperti/parcheggio-scambiatore-degli-archi/" target="_blank" rel="noopener">Parkdeck „Degli Archi“</a> in 1,5 km Entfernung abzustellen, von wo aus die Unterkunft bequem zu Fuß über einen völlig ebenen Weg zu erreichen ist.<br><br>Wenn Sie den Bus bevorzugen, nehmen Sie die Linie 1/4 Richtung Zentrum und steigen Sie an der Piazza Roma aus (Fahrzeit ca. 5 Minuten). Überqueren Sie den Platz; Hausnummer 3 befindet sich links vom Pferdebrunnen. Läuten Sie an der Haustür bei „Frisoli“ und fahren Sie mit dem Aufzug in den vierten Stock.`,
                    `Obiekt znajduje się w strefie pieszej. Można zaparkować na ulicy w okolicy na niebieskich liniach (płatne w dni powszednie od 8:00 do 20:00 w cenie 1,20 €/godz.) lub na jednym z kilku parkingów zadaszonych. Jeśli planujesz poruszać się po centrum, samochód nie będzie Ci potrzebny – polecam zostawić go na tańszym <a href="https://anconaservizi.it/parcheggi-coperti/parcheggio-scambiatore-degli-archi/" target="_blank" rel="noopener">parkingu wielopoziomowym „Degli Archi”</a>, oddalonym o 1,5 km, skąd do obiektu można łatwo dojść całkowicie płaską trasą.<br><br>Jeśli wolisz autobus, wsiądź w linię 1/4 w kierunku centrum i wysiądź na Piazza Roma (podróż trwa 5 minut). Przejdź przez plac; numer 3 znajduje się po lewej stronie fontanny z końmi. Przy drzwiach wejściowych zadzwoń na dzwonek „Frisoli”, a następnie wjedź windą na czwarte piętro.`
                ),
                trenoBody: tr(
                    `Dalla stazione sono 1,5 km tutti pianeggianti, è una passeggiata di mezz’ora.<br><br>Se preferisci l’autobus prendi il bus 1/4 direzione centro e scendi in piazza Roma, ci mette 5 minuti. Attraversa la piazza, il n. 3 è a sinistra della fontana dei cavalli.<br>Al portone suona al campanello Frisoli, poi prendi l’ascensore fino al quarto piano.`,
                    `From the station, it is 1.5 km, completely flat, about a half-hour walk.<br><br>If you prefer the bus, take line 1/4 towards the center and get off at Piazza Roma (it takes 5 minutes). Cross the square; number 3 is to the left of the horse fountain.<br>At the main door, ring the bell for Frisoli, then take the elevator to the fourth floor.`,
                    `Vom Bahnhof aus sind es 1,5 km, komplett eben, ein etwa halbstündiger Spaziergang.<br><br>Wenn Sie den Bus bevorzugen, nehmen Sie die Linie 1/4 Richtung Zentrum und steigen Sie an der Piazza Roma aus (Fahrzeit ca. 5 Minuten). Überqueren Sie den Platz; Hausnummer 3 befindet sich links vom Pferdebrunnen. Läuten Sie an der Haustür bei „Frisoli“ und fahren Sie mit dem Aufzug in den vierten Stock.`,
                    `Ze stacji jest 1,5 km całkowicie płaskiej drogi, co zajmuje około pół godziny spaceru.<br><br>Jeśli wolisz autobus, wsiądź w linię 1/4 w kierunku centrum i wysiądź na Piazza Roma (podróż trwa 5 minut). Przejdź przez plac; numer 3 znajduje się po lewej stronie fontanny z końmi. Przy drzwiach wejściowych zadzwoń na dzwonek „Frisoli”, a następnie wjedź windą na czwarte piętro.`
                ),
                aereoBody: tr(
                    `Dall’aeroporto si può prendere un taxi, scelta più comoda ma molto più costosa, prendere il bus raffaello, comodo ma presente solo per alcuni voli, oppure il treno che è la soluzione che consiglio per raggiungere la stazione di ancona e poi proseguire con l’itinerario indicato per chi arriva in treno. Ne passano di frequente e la stazione è proprio di fronte al terminal. Allego il link agli orari, comunque ne passano di frequente.<br><br>🔗 <a href="https://www.trenitalia.com/it.html" target="_blank" rel="noopener">Orari in tempo reale su Trenitalia</a>`,
                    `From the airport, you can take a taxi—the most convenient but much more expensive option—or take the "Raffaello" bus, which is convenient but only available for certain flights. Alternatively, you can take the train, which is the solution I recommend to reach Ancona station, and then follow the itinerary for those arriving by train. Trains run frequently, and the station is right in front of the terminal. I am attaching the link to the schedules, but they run often.<br><br>🔗 <a href="https://www.trenitalia.com/it.html" target="_blank" rel="noopener">Real-time schedules on Trenitalia</a>`,
                    `Vom Flughafen aus können Sie ein Taxi nehmen (die bequemste, aber weitaus teurere Option), den „Raffaello“-Bus nutzen (praktisch, aber nur auf bestimmte Flüge abgestimmt) oder den Zug nehmen. Letzteres ist meine Empfehlung, um den Bahnhof von Ancona zu erreichen; von dort aus folgen Sie dann der Beschreibung für die Anreise mit dem Zug. Züge fahren regelmäßig und der Bahnhof befindet sich direkt gegenüber dem Terminal. Ich füge den Link zu den Fahrplänen bei, die Verbindungen sind jedoch sehr häufig.<br><br>🔗 <a href="https://www.trenitalia.com/it.html" target="_blank" rel="noopener">Echtzeit-Fahrpläne auf Trenitalia</a>`,
                    `Z lotniska można wziąć taksówkę – najwygodniejsza, ale znacznie droższa opcja – pojechać autobusem „Raffaello” (wygodny, ale kursuje tylko przy niektórych lotach) lub wybrać pociąg, co jest przeze mnie najbardziej polecanym rozwiązaniem, aby dotrzeć do stacji Ancona, a następnie kontynuować podróż trasą opisaną dla przyjeżdżających pociągiem. Pociągi kursują często, a stacja znajduje się naprzeciwko terminala. Załączam link do rozkładu jazdy, pociągi jeżdżą bardzo regularnie.<br><br>🔗 <a href="https://www.trenitalia.com/it.html" target="_blank" rel="noopener">Rozkład jazdy na żywo w Trenitalia</a>`
                )
            };

            // Agganciamo la logica allo scope globale in modo sicuro
            window._reachTexts = { auto: reachData.autoBody, treno: reachData.trenoBody, aereo: reachData.aereoBody };
            window._toggleReach = function(type, btn) {
                document.getElementById('reach-content').innerHTML = window._reachTexts[type];
                document.querySelectorAll('.reach-sub-btn').forEach(b => {
                    b.style.background = 'var(--bg)';
                    b.style.color = 'var(--text)';
                    b.style.fontWeight = '500';
                });
                btn.style.background = 'var(--navy)';
                btn.style.color = 'var(--white)';
                btn.style.fontWeight = '600';
            };

            const reachCardHtml = `
            <div class="card" style="border-left: 3px solid var(--gold); margin-bottom: 12px;">
                <div class="card-header">
                    <span class="card-header-icon">📍</span>
                    <span class="card-title">${reachData.title}</span>
                </div>
                <div class="card-body">
                    <div style="display: flex; gap: 4px; margin-bottom: 12px;">
                        <button class="reach-sub-btn" onclick="window._toggleReach('auto', this)" style="flex: 1; background: var(--navy); color: var(--white); border: 1px solid var(--border); padding: 8px 2px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.2s; outline: none;">${reachData.autoLabel}</button>
                        <button class="reach-sub-btn" onclick="window._toggleReach('treno', this)" style="flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 2px; border-radius: 8px; font-size: 0.72rem; font-weight: 500; cursor: pointer; transition: all 0.2s; outline: none;">${reachData.trenoLabel}</button>
                        <button class="reach-sub-btn" onclick="window._toggleReach('aereo', this)" style="flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 2px; border-radius: 8px; font-size: 0.72rem; font-weight: 500; cursor: pointer; transition: all 0.2s; outline: none;">${reachData.aereoLabel}</button>
                    </div>
                    <div id="reach-content" style="font-size: 0.825rem; line-height: 1.6; color: var(--text);">
                        ${reachData.autoBody}
                    </div>
                </div>
            </div>
            `;

            const items = [
                { icon: '📶', title: tr('Wi‑Fi', 'Wi‑Fi', 'WLAN', 'Wi‑Fi'), body: tr(a.wifi.it, a.wifi.en, a.wifi.de, a.wifi.pl) },
                { icon: '🚪', title: tr('Citofono', 'Intercom', 'Gegensprechanlage', 'Domofon'), body: tr(a.access.it, a.access.en, a.access.de, a.access.pl) },
                { icon: '🔑', title: tr('Chiavi', 'Keys', 'Schlüssel', 'Klucze'), body: tr(a.keys.it, a.keys.en, a.keys.de, a.keys.pl) },
                { icon: '🏨', title: tr('Check‑in flessibile', 'Flexible check‑in', 'Flexibler Check‑in', 'Elastyczne zameldowanie'), body: tr(a.checkin.it, a.checkin.en, a.checkin.de, a.checkin.pl) },
                { icon: '♻️', title: tr('Raccolta differenziata', 'Recycling', 'Mülltrennung', 'Segregacja odpadów'), body: tr(a.recycling.it, a.recycling.en, a.recycling.de, a.recycling.pl) },
                { icon: '🔕', title: tr('Silenzio notturno', 'Quiet hours', 'Nachtruhe', 'Godziny ciszy'), body: tr(a.quietHours.it, a.quietHours.en, a.quietHours.de, a.quietHours.pl) }
            ];

            return `<div class="cards">` + reachCardHtml + items.map(i => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-header-icon">${i.icon}</span>
                        <span class="card-title">${i.title}</span>
                    </div>
                    <div class="card-body">${i.body}</div>
                </div>
            `).join('') + `</div>`;
        }

        // RENDERING SEZIONE ITINERARI CON BOTTONI GPS INTERATTIVI
        function renderItineraries() {
            const mainTitle = tr("Tour Principale della Città (20 tappe)", "Main City Tour (20 steps)", "Hauptstadttour (20 Stationen)", "Główna wycieczka po mieście (20 etapów)");
            const cardetoTitle = tr("Parco del Cardeto (Natura & Antico Faro)", "Cardeto Park (Nature & Old Lighthouse)", "Cardeto-Park (Natur & Alter Leuchtturm)", "Park Cardeto (Natura i Stara Latarnia)");
            const cittadellaTitle = tr("Parco della Cittadella (Fortezza Storica)", "Cittadella Park (Historic Fortress)", "Cittadella-Park (Historische Festung)", "Park Cittadella (Zabytkowa Twierdza)");
            
            function buildTimeline(list) {
                return `<div class="timeline">` + list.map(item => {
                    const label = tr(item.name.it, item.name.en, item.name.de, item.name.pl);
                    const query = item.q || label;
                    return `
                    <div class="timeline-item">
                        <div class="timeline-title">${label}</div>
                        <div class="timeline-desc">${tr("Clicca sotto per attivare la navigazione GPS", "Click below to activate GPS navigation", "Klicken Sie unten, um die GPS-Navigation zu aktivieren", "Kliknij poniżej, aby aktywować nawigację GPS")}</div>
                        <a class="gps-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}" target="_blank" rel="noopener">
                            📍 GPS Map
                        </a>
                    </div>`;
                }).join('') + `</div>`;
            }

            return `
            <div class="card">
                <div class="sub-itinerary-header">${mainTitle}</div>
                ${buildTimeline(appData.itineraries.main)}
                
                <div class="sub-itinerary-header">${cardetoTitle}</div>
                ${buildTimeline(appData.itineraries.cardeto)}
                
                <div class="sub-itinerary-header">${cittadellaTitle}</div>
                ${buildTimeline(appData.itineraries.cittadella)}
            </div>`;
        }

        // RENDERING SEZIONE FOOD & LIFESTYLE
        function renderFood() {
            return `<div class="cards">` + appData.food.map(f => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-header-icon">🍴</span>
                        <span class="card-title">${f.name}</span>
                    </div>
                    <div class="card-body">
                        <p style="color: var(--gold); font-weight: 600; margin-bottom: 6px; font-size: 0.8rem;">${tr(f.type.it, f.type.en, f.type.de, f.type.pl)}</p>
                        <a class="gps-btn" style="margin-top: 4px;" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.q || f.name)}" target="_blank" rel="noopener">
                            📍 Naviga GPS
                        </a>
                    </div>
                </div>
            `).join('') + `</div>`;
        }

        // RENDERING SEZIONE TRASPORTI & PARCHEGGI
        function renderTransport() {
            const t = appData.transport;
            const items = [
                { icon: '🚗', title: tr('Parcheggi & Tariffe', 'Parking & Rates', 'Parken & Tarife', 'Parking i Ceny'), body: tr(t.parking.it, t.parking.en, t.parking.de, t.parking.pl) },
                { icon: '🚌', title: tr('Autobus Urbani (Conerobus)', 'Local Buses', 'Stadtbusse', 'Autobusy Miejskie'), body: tr(t.conerobus.it, t.conerobus.en, t.conerobus.de, t.conerobus.pl) },
                { icon: '⛰️', title: tr('Idee per Escursioni', 'Excursion Ideas', 'Ausflugsideen', 'Pomysły na Wycieczki'), body: tr(t.excursions.it, t.excursions.en, t.excursions.de, t.excursions.pl) }
            ];

            return `<div class="cards">` + items.map(i => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-header-icon">${i.icon}</span>
                        <span class="card-title">${i.title}</span>
                    </div>
                    <div class="card-body">${i.body}</div>
                </div>
            `).join('') + `</div>`;
        }

        // Inizializzazione automatica al caricamento del DOM
        document.addEventListener("DOMContentLoaded", () => {
            switchLang('it');
        });
    </script>
