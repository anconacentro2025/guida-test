        porto: [
            { name:'Porto Antico', emoji:'⚓', photo:'',
              it:'Il Porto Antico è il luogo dove Ancona continua a vivere il suo rapporto millenario con il mare. A differenza di molti porti storici trasformati esclusivamente in aree turistiche, quello di Ancona conserva ancora oggi una straordinaria vitalità: navi commerciali, traghetti diretti verso Grecia, Croazia e Albania, pescherecci e imbarcazioni da diporto convivono ogni giorno nello stesso scenario.',
              en:'The Old Port is where Ancona keeps living its millennia-old relationship with the sea. Unlike many historic ports turned exclusively into tourist areas, Ancona\'s still preserves extraordinary vitality today: cargo ships, ferries to Greece, Croatia and Albania, fishing boats and pleasure craft coexist daily within the same scene.',
              de:'Der Alte Hafen ist der Ort, an dem Ancona seine jahrtausendealte Beziehung zum Meer weiterlebt. Handelsschiffe, Fähren nach Griechenland, Kroatien und Albanien, Fischerboote und Freizeitboote existieren hier täglich nebeneinander.',
              pl:'Stary Port to miejsce, w którym Ankona wciąż pielęgnuje swój tysiącletni związek z morzem. Statki handlowe, promy do Grecji, Chorwacji i Albanii, kutry rybackie i łodzie rekreacyjne współistnieją tu na co dzień.',
              itLong:'<p>Passeggiando lungo le banchine si percepisce come il porto non sia soltanto un monumento del passato, ma un\'infrastruttura viva che continua a rappresentare il cuore economico della città e la più grande azienda della regione.</p><p>È proprio questa continuità tra storia e presente a rendere Ancona diversa da molte altre città marinare italiane: qui il mare non è soltanto un panorama, ma continua a essere parte integrante della vita quotidiana. Dal porto si possono inoltre ammirare alcuni dei monumenti più importanti della città, con il Duomo che domina il Colle Guasco e gli archi monumentali che raccontano quasi duemila anni di storia.</p>',
              enLong:'<p>Walking along the quays you sense that the port is not just a monument of the past, but a living infrastructure that remains the economic heart of the city and the region\'s largest employer.</p><p>It is exactly this continuity between past and present that sets Ancona apart from many other Italian maritime cities: here the sea is not just scenery, but remains an integral part of daily life. From the port you can also admire some of the city\'s most important monuments, with the Cathedral crowning the Guasco Hill and the monumental arches recounting almost two thousand years of history.</p>',
              itNote:'Osservate le navi traghetto: alcune superano i 200 metri di lunghezza.',
              enNote:'Notice the ferries: some exceed 200 metres in length.',
              deNote:'Fähren beobachten: Einige überschreiten 200 Meter.',
              plNote:'Promy: niektóre przekraczają 200 metrów.',
              itPhoto:'Dal lungomare Vanvitelli con le navi in primo piano e il Duomo sul Colle Guasco.',
              enPhoto:'From Lungomare Vanvitelli with ships in front and the Cathedral on Guasco hill.',
              dePhoto:'Lungomare Vanvitelli mit Schiffen und Dom.',
              plPhoto:'Lungomare Vanvitelli ze statkami i Katedrą.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚶 700 m – 10 min', mapQuery:'Porto di Ancona', lat:43.623538, lng:13.509578 },
            { name:'Mole Vanvitelliana (Lazzaretto)', emoji:'🏛️', photo:'mole-vanvitelliana.jpg',
              it:'Uno degli edifici più affascinanti e originali di Ancona. Progettata nel Settecento da Luigi Vanvitelli, sorge su un\'isola artificiale pentagonale collegata alla terraferma da un ponte. La sua particolare forma rispondeva a esigenze sia sanitarie sia difensive: qui venivano poste in quarantena persone e merci provenienti dai porti del Mediterraneo, contribuendo a proteggere la città dalla diffusione delle epidemie.',
              en:'One of Ancona\'s most fascinating and original buildings. Designed in the 18th century by Luigi Vanvitelli, it stands on a pentagonal artificial island connected to the mainland by a bridge. Its distinctive shape met both sanitary and defensive needs: here people and goods arriving from Mediterranean ports were placed in quarantine, helping protect the city from the spread of epidemics.',
              de:'Eines der faszinierendsten und originellsten Gebäude Anconas. Im 18. Jahrhundert von Luigi Vanvitelli auf einer fünfeckigen künstlichen Insel entworfen. Die besondere Form diente sowohl sanitären als auch verteidigungstechnischen Zwecken: hier wurden Personen und Waren aus dem Mittelmeerraum unter Quarantäne gestellt.',
              pl:'Jeden z najbardziej fascynujących i oryginalnych budynków Ankony. Zaprojektowana w XVIII wieku przez Luigiego Vanvitelliego na sztucznej pięciokątnej wyspie. Jej szczególny kształt odpowiadał potrzebom sanitarnym i obronnym: poddawano tu kwarantannie osoby i towary przybywające z portów śródziemnomorskich.',
              itLong:'<p>Nel corso dei secoli la Mole ha avuto numerose funzioni, da deposito militare a ospedale, fino a trasformarsi nell\'attuale polo culturale che ospita mostre, concerti, festival ed eventi.</p><p>Passeggiando nel grande cortile interno si percepisce tutta l\'armonia del progetto vanvitelliano, considerato uno dei più significativi esempi di architettura illuminista in Italia. La sera, quando l\'edificio si riflette nelle acque del porto, la Mole offre uno degli scorci più suggestivi di Ancona. Nelle sere d\'estate si svolge una apprezzata rassegna di cinema all\'aperto.</p><p><b>Da non perdere:</b> Il Museo Tattile Statale Omero, unico in Italia, permette di toccare le opere d\'arte.</p>',
              enLong:'<p>Over the centuries the Mole served many functions, from military depot to hospital, before becoming today\'s cultural hub hosting exhibitions, concerts, festivals and events.</p><p>Walking through the large inner courtyard you can feel the full harmony of Vanvitelli\'s design, considered one of the most significant examples of Enlightenment architecture in Italy. In the evening, reflected in the port waters, the Mole offers one of Ancona\'s most evocative views. On summer evenings it hosts a well-loved open-air cinema season.</p><p><b>Not to miss:</b> The Museo Tattile Statale Omero, unique in Italy, allows you to touch artworks.</p>',
              deLong:'<p>Im Laufe der Jahrhunderte diente die Mole vielen Zwecken, vom Militärdepot bis zum Krankenhaus, bevor sie zum heutigen Kulturzentrum wurde. Abends spiegelt sie sich im Hafenwasser und bietet einen der eindrucksvollsten Ausblicke Anconas; im Sommer Freiluftkino.</p><p><b>Nicht verpassen:</b> Museo Tattile Statale Omero.</p>',
              plLong:'<p>Na przestrzeni wieków Mole pełniła wiele funkcji, od magazynu wojskowego po szpital, zanim stała się dzisiejszym centrum kulturalnym. Wieczorem odbija się w wodach portu, oferując jeden z najbardziej sugestywnych widoków Ankony; latem odbywa się tu kino plenerowe.</p><p><b>Nie przegap:</b> Museo Tattile Statale Omero.</p>',
              itNote:'La planimetria pentagonale è visibile dall\'alto: cercate una foto aerea.',
              enNote:'The pentagonal plan is visible from above: look for an aerial photo.',
              deNote:'Der fünfeckige Grundriss von oben sichtbar.',
              plNote:'Pięciokątny rzut widoczny z góry.',

            { name:'Marina Dorica', emoji:'⛵', photo:'',
              it:'Uno dei più grandi porti turistici dell\'Adriatico e il lato più moderno della vocazione marinara di Ancona. Qui si alternano barche a vela, yacht, ristoranti e una piacevole passeggiata sul mare, ideale per rilassarsi lontano dal traffico del centro.',
              en:'One of the largest tourist marinas on the Adriatic and the most modern side of Ancona\'s maritime vocation. Sailing boats, yachts, restaurants and a pleasant seafront walk, ideal for relaxing away from the centre\'s traffic.',
              de:'Einer der größten Yachthäfen der Adria und die moderne Seite von Anconas maritimer Tradition. Segelboote, Yachten, Restaurants und eine angenehme Uferpromenade abseits des Verkehrs im Zentrum.',
              pl:'Jedna z największych przystani turystycznych na Adriatyku i najbardziej nowoczesna strona morskiej tradycji Ankony. Żaglówki, jachty, restauracje i przyjemna promenada nadmorska, z dala od ruchu w centrum.',
              itLong:'<p>Inaugurata negli anni Novanta, Marina Dorica è diventata rapidamente uno dei principali approdi turistici del Medio Adriatico. Ospita centinaia di imbarcazioni da diporto provenienti da tutta Europa ed è spesso punto di partenza per regate e manifestazioni veliche internazionali.</p><p>L\'area è stata progettata non solo come porto, ma anche come spazio aperto alla città. Passeggiando lungo le banchine si possono osservare eleganti barche a vela, yacht e numerose attività legate al mare.</p>',
              enLong:'<p>Inaugurated in the 1990s, Marina Dorica quickly became one of the main tourist harbours of the central Adriatic. It hosts hundreds of pleasure boats from across Europe and is often the starting point for international regattas and sailing events.</p><p>The area was designed not only as a harbour but as a space open to the city. Walking along the quays you can admire elegant sailing boats, yachts and numerous sea-related activities.</p>',
              deLong:'<p>In den 1990er Jahren eröffnet, wurde Marina Dorica schnell zu einem der wichtigsten Touristenhäfen der mittleren Adria. Hunderte Freizeitboote aus ganz Europa, oft Ausgangspunkt für internationale Regatten.</p>',
              plLong:'<p>Otwarta w latach 90. XX wieku, Marina Dorica szybko stała się jedną z głównych przystani turystycznych środkowego Adriatyku. Setki jachtów z całej Europy, często punkt startowy regat międzynarodowych.</p>',
              itNote:'Nelle giornate di sole fermatevi in uno dei locali affacciati sull\'acqua, oppure passeggiate ammirando il via vai delle imbarcazioni.',
              enNote:'On sunny days stop at one of the waterfront bars, or simply stroll and watch the boats come and go.',
              deNote:'An sonnigen Tagen in einem der Lokale am Wasser verweilen oder einfach die Boote beobachten.',
              plNote:'W słoneczne dni warto zatrzymać się w jednym z lokali nad wodą lub po prostu obserwować łodzie.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚗 2,3 km – 6 min', mapQuery:'Marina Dorica Ancona', lat:43.6085625, lng:13.4823125 }
        ],

            { name:'Mezzavalle', emoji:'🏝️', photo:'',
              it:'Mezzavalle è una delle spiagge più spettacolari delle Marche. Selvaggia e priva di stabilimenti balneari, conserva un ambiente naturale quasi incontaminato, con acque limpide, falesie bianche e macchia mediterranea che arriva a lambire una lunga spiaggia di ciottoli. Raggiungibile esclusivamente a piedi attraverso un ripido sentiero panoramico oppure via mare.',
              en:'Mezzavalle is one of the most spectacular beaches in the Marche. Wild and free of beach establishments, it preserves an almost untouched natural environment, with clear waters, white cliffs and Mediterranean scrub reaching down to a long pebble beach. Reachable only on foot via a steep scenic path, or by sea.',
              de:'Mezzavalle ist einer der spektakulärsten Strände der Marken. Wild und ohne Strandeinrichtungen, mit klarem Wasser, weißen Klippen und mediterraner Macchia bis zum langen Kiesstrand. Nur zu Fuß über einen steilen Panoramapfad oder vom Meer aus erreichbar.',
              pl:'Mezzavalle to jedna z najbardziej spektakularnych plaż w Marchii. Dzika i pozbawiona infrastruktury plażowej, z krystaliczną wodą, białymi klifami i śródziemnomorskimi zaroślami sięgającymi długiej plaży kamyków. Dostępna tylko pieszo stromą, malowniczą ścieżką lub od strony morza.',
              itLong:'<p>La spiaggia si estende per oltre un chilometro ai piedi della falesia e regala panorami di rara bellezza. Le acque, generalmente limpide e trasparenti, invitano a fare snorkeling e lunghe nuotate. Proprio l\'assenza di strutture turistiche ha permesso a questo luogo di mantenere il suo fascino originario.</p><p>Raggiungibile a piedi dal belvedere di Portonovo (30 min) o con bus 94 da piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Orari Conerobus ↗</a></p>',
              enLong:'<p>The beach stretches for over a kilometre at the foot of the cliff, offering views of rare beauty. Its generally clear, transparent waters invite snorkelling and long swims. It is precisely the absence of tourist facilities that has allowed this place to keep its original charm.</p><p>Reachable on foot from the Portonovo belvedere (30 min) or by bus 94 from Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus timetables ↗</a></p>',
              itNote:'Portate tutto il necessario: acqua, cibo, protezione solare. Non ci sono servizi.',
              enNote:'Bring everything: water, food, sun protection. No services on the beach.',
              deNote:'Alles mitnehmen: Wasser, Essen, Sonnenschutz.',
              plNote:'Zabierzcie wszystko: wodę, jedzenie, krem.',
              itPhoto:'Dal sentiero in discesa con spiaggia e falesie in vista.',
              enPhoto:'From the path descending with beach and cliffs in view.',
              dePhoto:'Vom Abstiegspfad mit Strand und Klippen.',
              plPhoto:'Ze szlaku z widokiem plaży i klifów.',

            { name:'Spiaggia delle Due Sorelle', emoji:'🏝️', photo:'',
              it:'La Spiaggia delle Due Sorelle è considerata una delle più belle d\'Italia. Selvaggia, incontaminata e raggiungibile esclusivamente via mare, prende il nome dai due caratteristici faraglioni bianchi che emergono dall\'acqua. Ai piedi delle imponenti falesie del Monte Conero si apre questa spettacolare spiaggia di ciottoli bianchi, lambita da un mare trasparente dai colori che variano dal turchese al blu intenso.',
              en:'The Due Sorelle beach is considered one of the most beautiful in Italy. Wild, unspoilt and reachable only by sea, it takes its name from the two distinctive white sea stacks emerging from the water. At the foot of Monte Conero\'s towering cliffs lies this spectacular white pebble beach, lapped by transparent waters ranging from turquoise to deep blue.',
              de:'Der Strand der Due Sorelle gilt als einer der schönsten Italiens. Wild, unberührt und nur vom Meer aus erreichbar, benannt nach den zwei markanten weißen Felsnadeln, die aus dem Wasser ragen. Am Fuße der imposanten Klippen des Monte Conero, mit türkis- bis tiefblauem Wasser.',
              pl:'Plaża Due Sorelle uważana jest za jedną z najpiękniejszych we Włoszech. Dzika, dziewicza i dostępna wyłącznie od strony morza, zawdzięcza nazwę dwóm charakterystycznym białym skałom wyłaniającym się z wody. U podnóża potężnych klifów Monte Conero, z przejrzystą wodą w odcieniach turkusu i głębokiego błękitu.',
              itLong:'<p>L\'assenza di edifici e strade ha permesso di conservare un ambiente naturale praticamente intatto. Durante l\'estate è raggiungibile con i battelli in partenza da Numana o Portonovo, oppure con escursioni organizzate.</p><p>Le Due Sorelle rappresentano il simbolo naturalistico della Riviera del Conero e sono uno dei luoghi più fotografati delle Marche.</p>',
              enLong:'<p>The absence of buildings and roads has kept this environment practically untouched. In summer it can be reached by boats departing from Numana or Portonovo, or with organised excursions.</p><p>The Due Sorelle are the natural symbol of the Riviera del Conero and one of the most photographed spots in the Marche.</p>',
              itNote:'I due faraglioni: l\'immagine simbolo del Parco del Conero.',
              enNote:'The two sea stacks: the iconic image of the Parco del Conero.',
              deNote:'Die zwei Felsnadeln: das Wahrzeichen des Parco del Conero.',
              plNote:'Dwa faragliony: symbol Parco del Conero.',
              itPhoto:'Dalla barca durante l\'avvicinamento con i faraglioni in primo piano.',
              enPhoto:'From the boat approaching with the sea stacks in front.',
              dePhoto:'Vom Boot mit Felsnadeln.',
              plPhoto:'Z łodzi z faraglionami.',
              itTime:'Mezza giornata.',enTime:'Half a day.',deTime:'Halber Tag.',plTime:'Pół dnia.',
              dist:'🚗 22 km + 🚢 barca da Numana', mapQuery:'Spiaggia delle Due Sorelle Conero', lat:43.5470667, lng:13.6270051 }

        portonovo: [
            { order:1, name:'Portonovo – Baia del Conero', emoji:'🏝️', photo:'portonovo.jpg',
              it:'Incastonata tra il Monte Conero e il mare Adriatico, Portonovo è una delle baie più affascinanti d\'Italia. Natura, mare cristallino, storia e ottima cucina si incontrano in uno scenario unico. Protetta dalle pendici del Monte Conero, la baia conserva un paesaggio rimasto sorprendentemente intatto: spiagge di ciottoli bianchi, acqua limpida e il verde della macchia mediterranea interrotto da due laghetti di acqua salmastra.',
              en:'Nestled between Monte Conero and the Adriatic Sea, Portonovo is one of Italy\'s most enchanting bays. Nature, crystal-clear sea, history and excellent cuisine meet in a unique setting. Protected by the slopes of Monte Conero, the bay preserves a landscape that remains remarkably intact: white pebble beaches, clear water and Mediterranean scrub broken up by two brackish lakes.',
              de:'Eingebettet zwischen dem Monte Conero und der Adria ist Portonovo eine der bezauberndsten Buchten Italiens. Natur, kristallklares Meer, Geschichte und ausgezeichnete Küche treffen hier in einzigartiger Kulisse aufeinander, mit weißen Kieselstränden und zwei Brackwasserseen.',
              pl:'Wtulona między Monte Conero a Adriatykiem, Portonovo to jedna z najbardziej zachwycających zatok Włoch. Natura, krystaliczne morze, historia i doskonała kuchnia spotykają się w wyjątkowej scenerii, z białymi kamienistymi plażami i dwoma słonawymi jeziorkami.',
              itLong:'<p>Qui sorgono alcuni dei ristoranti di pesce più rinomati della zona, insieme allo storico Fortino Napoleonico, alla Torre De Bosis e alla suggestiva Chiesa di Santa Maria di Portonovo. Portonovo è perfetta sia per una giornata di mare sia come punto di partenza per escursioni sul Conero.</p><p>Vi si trovano stabilimenti balneari attrezzati alternati a tratti di spiaggia libera particolarmente apprezzati dagli anconetani. D\'estate i parcheggi si esauriscono presto, ma a monte è disponibile un ampio parcheggio servito da una comoda navetta gratuita. È anche possibile arrivare con il bus 94, che collega la stazione di Ancona e la piazzetta di Portonovo passando per piazza Cavour.</p>',
              enLong:'<p>Some of the area\'s most renowned fish restaurants are found here, alongside the historic Napoleonic Fort, the Torre De Bosis and the evocative Church of Santa Maria di Portonovo. Portonovo is perfect both for a day at the sea and as a starting point for excursions on the Conero.</p><p>Equipped beach clubs alternate with free stretches of beach especially loved by locals. In summer the car parks fill up quickly, but a large car park uphill is served by a free shuttle. Bus 94 also connects Ancona\'s station and Portonovo\'s little square, passing through Piazza Cavour.</p>',
              itNote:'Con bus 94 da piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Orari Conerobus ↗</a>',
              enNote:'By bus 94 from Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus timetables ↗</a>',
              deNote:'Mit Bus 94 ab Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus Fahrpläne ↗</a>',
              plNote:'Autobusem 94 z Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Rozkład Conerobus ↗</a>',
              itPhoto:'Dal Belvedere sopra la baia con il contrasto verde-azzurro.',
              enPhoto:'From the Belvedere above the bay with the green-blue contrast.',
              dePhoto:'Vom Belvedere über der Bucht.',
              plPhoto:'Z Belvedere nad zatoką.',
              dist:'🚌 12 km – 25 min', mapQuery:'Baia di Portonovo Ancona', lat:43.5636463, lng:13.5976903,
              extraMap:{ label:'🎥 Webcam Spiaggia Bonetti', url:'https://vedetta.org/webcam/italia/marche/ancona/portonovo-spiaggia/' } },
            { order:2, name:'Chiesa di Santa Maria di Portonovo', emoji:'⛪', photo:'',
              it:'Affacciata direttamente sul mare, la Chiesa di Santa Maria di Portonovo è uno dei monumenti romanici più suggestivi delle Marche. Costruita nell\'XI secolo dai monaci benedettini, unisce elementi romanici, bizantini e paleocristiani, creando un edificio unico nel suo genere.',
              en:'Facing directly onto the sea, the Church of Santa Maria di Portonovo is one of the most evocative Romanesque monuments in the Marche. Built in the 11th century by Benedictine monks, it blends Romanesque, Byzantine and Early Christian elements into a truly unique building.',
              de:'Direkt am Meer gelegen, ist die Kirche Santa Maria di Portonovo eines der eindrucksvollsten romanischen Bauwerke der Marken. Im 11. Jahrhundert von Benediktinermönchen erbaut, vereint sie romanische, byzantinische und frühchristliche Elemente.',
              pl:'Stojący tuż nad morzem kościół Santa Maria di Portonovo to jeden z najbardziej sugestywnych zabytków romańskich w Marchii. Zbudowany w XI wieku przez mnichów benedyktyńskich, łączy elementy romańskie, bizantyjskie i wczesnochrześcijańskie.',
              itLong:'<p>La posizione, a pochi metri dalla spiaggia, rende questo luogo particolarmente suggestivo. Nel corso dei secoli terremoti e frane hanno modificato il paesaggio circostante, ma la chiesa continua a rappresentare uno dei simboli della baia.</p><p>L\'interno, semplice ed essenziale, invita al silenzio e alla contemplazione.</p>',
              enLong:'<p>Its position just metres from the beach makes this place particularly evocative. Over the centuries earthquakes and landslides have reshaped the surrounding landscape, yet the church remains one of the symbols of the bay.</p><p>The simple, essential interior invites silence and contemplation.</p>',
              deLong:'<p>Die Lage nur wenige Meter vom Strand entfernt macht diesen Ort besonders eindrucksvoll. Erdbeben und Erdrutsche haben im Laufe der Jahrhunderte die Landschaft verändert, doch die Kirche bleibt eines der Symbole der Bucht.</p>',
              plLong:'<p>Położenie zaledwie kilka metrów od plaży czyni to miejsce wyjątkowo sugestywnym. Trzęsienia ziemi i osunięcia terenu zmieniały krajobraz na przestrzeni wieków, lecz kościół pozostaje jednym z symboli zatoki.</p>',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Chiesa di Santa Maria di Portonovo' , lat:43.5608356, lng:13.6020616 },
            { order:3, name:'Fortino Napoleonico', emoji:'🏰', photo:'',
              it:'Costruito all\'inizio dell\'Ottocento per difendere la baia, il Fortino Napoleonico è oggi uno degli edifici storici più caratteristici di Portonovo. Fu realizzato durante il Regno d\'Italia napoleonico per controllare la costa e contrastare eventuali sbarchi nemici.',
              en:'Built in the early 19th century to defend the bay, the Napoleonic Fort is today one of the most characteristic historic buildings in Portonovo. It was built during the Napoleonic Kingdom of Italy to control the coast and repel potential enemy landings.',
              de:'Zu Beginn des 19. Jahrhunderts zur Verteidigung der Bucht erbaut, ist das Napoleonische Fort heute eines der markantesten historischen Gebäude von Portonovo. Es entstand im napoleonischen Königreich Italien zur Küstenüberwachung.',
              pl:'Zbudowany na początku XIX wieku dla obrony zatoki, Fort Napoleoński jest dziś jednym z najbardziej charakterystycznych zabytkowych budynków Portonovo. Powstał za czasów napoleońskiego Królestwa Włoch, by kontrolować wybrzeże.',
              itLong:'<p>La struttura, perfettamente integrata nel paesaggio, ha cambiato più volte destinazione nel corso dei secoli fino a essere trasformata nell\'attuale struttura ricettiva.</p><p>Passeggiando nei suoi dintorni si percepisce chiaramente il valore strategico che questa baia aveva per il controllo dell\'Adriatico.</p>',
              enLong:'<p>Perfectly integrated into the landscape, the structure has changed use several times over the centuries, eventually becoming today\'s hospitality venue.</p><p>Walking around it, you can clearly sense the strategic value this bay once held for controlling the Adriatic.</p>',
              deLong:'<p>Perfekt in die Landschaft integriert, wechselte das Gebäude im Laufe der Jahrhunderte mehrfach seine Funktion, bis es zur heutigen Unterkunft wurde.</p>',
              plLong:'<p>Doskonale wtopiona w krajobraz budowla wielokrotnie zmieniała przeznaczenie na przestrzeni wieków, aż stała się dzisiejszym obiektem noclegowym.</p>',
              itTime:'10–15 minuti (esterno).',enTime:'10–15 minutes (exterior).',deTime:'10–15 Minuten (außen).',plTime:'10–15 minut (zewnątrz).',
              dist:'🚌 12 km – 25 min', mapQuery:'Fortino Napoleonico Portonovo', lat:43.5655625, lng:13.5923125 },
            { order:4, name:'Lago Grande di Portonovo', emoji:'🦩', photo:'',
              it:'Uno dei rarissimi laghi costieri salmastri dell\'Adriatico. Separato dal mare da una sottile striscia di terra, ospita un ecosistema di grande valore naturalistico. Le sue acque, alimentate sia da sorgenti sia dal mare, sono un habitat ideale per numerose specie di uccelli acquatici.',
              en:'One of the very few brackish coastal lakes on the Adriatic. Separated from the sea by a thin strip of land, it hosts an ecosystem of great naturalistic value. Fed by both springs and the sea, its waters are an ideal habitat for numerous species of waterbirds.',
              de:'Einer der seltenen brackigen Küstenseen der Adria. Durch einen schmalen Landstreifen vom Meer getrennt, mit einem wertvollen Ökosystem. Ideales Habitat für zahlreiche Wasservogelarten.',
              pl:'Jedno z bardzo nielicznych słonawych jezior przybrzeżnych na Adriatyku. Oddzielone od morza wąskim pasem lądu, z cennym ekosystemem. Idealny habitat dla licznych gatunków ptaków wodnych.',
              itLong:'<p>Passeggiando lungo il sentiero che costeggia il lago è possibile osservare aironi, folaghe e altre specie migratorie che sostano durante l\'anno.</p><p>Questo piccolo angolo di natura rappresenta uno degli aspetti meno conosciuti ma più interessanti della baia di Portonovo.</p>',
              enLong:'<p>Walking along the path skirting the lake, you can spot herons, coots and other migratory species that stop here throughout the year.</p><p>This small corner of nature is one of the lesser-known yet most interesting aspects of the Portonovo bay.</p>',
              deLong:'<p>Entlang des Seeuferwegs lassen sich Reiher, Blässhühner und andere Zugvögel beobachten. Eine der weniger bekannten, aber interessantesten Facetten der Bucht von Portonovo.</p>',
              plLong:'<p>Spacerując ścieżką wzdłuż jeziora, można zaobserwować czaple, łyski i inne gatunki wędrowne. To mało znany, lecz bardzo interesujący zakątek zatoki Portonovo.</p>',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Lago Grande Portonovo', lat:43.5629375, lng:13.5911875 },
            { order:5, name:'Lago Profondo di Portonovo', emoji:'🌿', photo:'',
              it:'Più piccolo e meno conosciuto del vicino Lago Grande, il Lago Profondo è un prezioso ambiente naturale immerso nella vegetazione della baia di Portonovo. La sua tranquillità lo rende uno dei luoghi più suggestivi per gli amanti della natura.',
              en:'Smaller and less known than the nearby Lago Grande, the Lago Profondo is a precious natural environment set within the vegetation of the Portonovo bay. Its tranquillity makes it one of the most evocative spots for nature lovers.',
              de:'Kleiner und weniger bekannt als der nahegelegene Lago Grande, ist der Lago Profondo eine wertvolle Naturlandschaft inmitten der Vegetation der Bucht von Portonovo. Seine Ruhe macht ihn zu einem der eindrucksvollsten Orte für Naturliebhaber.',
              pl:'Mniejsze i mniej znane niż pobliskie Lago Grande, Lago Profondo to cenne środowisko naturalne pośród roślinności zatoki Portonovo. Jego spokój czyni je jednym z najbardziej sugestywnych miejsc dla miłośników przyrody.',
              itLong:'<p>Si è formato grazie all\'incontro tra acque dolci di falda e infiltrazioni marine, creando un ecosistema delicato e ricco di biodiversità. Pur essendo meno accessibile rispetto al Lago Grande, rappresenta un\'importante area naturalistica protetta.</p><p>L\'ambiente circostante ospita canneti, vegetazione mediterranea e numerose specie di uccelli, insetti e anfibi. Qui dominano il silenzio e i suoni della natura.</p>',
              enLong:'<p>It formed where fresh groundwater meets sea infiltration, creating a delicate ecosystem rich in biodiversity. Though less accessible than the Lago Grande, it is an important protected natural area.</p><p>The surrounding environment hosts reed beds, Mediterranean vegetation and numerous species of birds, insects and amphibians, where silence and the sounds of nature prevail.</p>',
              deLong:'<p>Entstanden durch das Zusammentreffen von Grundwasser und Meerwasser-Infiltration, mit einem empfindlichen, artenreichen Ökosystem. Schilf, mediterrane Vegetation und zahlreiche Tierarten prägen die Umgebung.</p>',
              plLong:'<p>Powstało dzięki spotkaniu wód gruntowych z infiltracją morską, tworząc delikatny i bogaty w bioróżnorodność ekosystem. Trzcinowiska, roślinność śródziemnomorska i liczne gatunki zwierząt tworzą tę otoczoną ciszą enklawę przyrody.</p>',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Lago Profondo Portonovo', lat:43.5605625, lng:13.5999375 },
            { order:6, name:'Spiaggia del Molo (Portonovo)', emoji:'🌊', photo:'',
              it:'La Spiaggia del Molo è il cuore di Portonovo: un\'ampia spiaggia di ciottoli bianchi bagnata da un mare limpido, dominata dal Monte Conero e caratterizzata dalla presenza dello storico molo.',
              en:'The Spiaggia del Molo is the heart of Portonovo: a wide beach of white pebbles washed by clear water, dominated by Monte Conero and marked by the presence of the historic pier.',
              de:'Die Spiaggia del Molo ist das Herz von Portonovo: ein breiter Strand aus weißen Kieseln mit klarem Wasser, überragt vom Monte Conero und geprägt vom historischen Pier.',
              pl:'Spiaggia del Molo to serce Portonovo: szeroka plaża z białych kamyków obmywana przejrzystą wodą, zdominowana przez Monte Conero i charakterystyczne historyczne molo.',
              itLong:'<p>È la spiaggia più frequentata della baia e rappresenta il punto di riferimento per chi visita Portonovo. Qui si alternano stabilimenti balneari e tratti di spiaggia libera, con numerosi ristoranti affacciati sul mare e tutti i principali servizi facilmente raggiungibili.</p><p>Il caratteristico molo, utilizzato dalle piccole imbarcazioni dei pescatori, dona alla baia uno degli scorci più fotografati della Riviera del Conero. Grazie alle acque trasparenti e ai fondali ricchi di vita marina, la zona è apprezzata anche dagli amanti dello snorkeling.</p>',
              enLong:'<p>It is the most popular beach in the bay and the main reference point for visitors to Portonovo. Beach clubs alternate with free stretches, with numerous seafront restaurants and all main services close at hand.</p><p>The distinctive pier, used by small fishing boats, gives the bay one of the most photographed views on the Riviera del Conero. Thanks to clear waters and seabeds rich in marine life, the area is also popular with snorkellers.</p>',
              itNote:'Il panorama sul Monte Conero, il caratteristico molo, le acque limpide ideali per bagno e snorkeling, l\'atmosfera nelle prime ore del mattino e al tramonto.',
              enNote:'The view of Monte Conero, the distinctive pier, clear waters ideal for swimming and snorkelling, the atmosphere in the early morning and at sunset.',
              deNote:'Der Blick auf den Monte Conero, der charakteristische Pier, klares Wasser zum Baden und Schnorcheln.',
              plNote:'Widok na Monte Conero, charakterystyczne molo, czysta woda idealna do pływania i snorkelingu.',
              dist:'🚌 12 km – 25 min', mapQuery:'Spiaggia del Molo Portonovo', lat:43.5647320, lng:13.5910247 },
            { order:7, name:'Spiaggia della Torre (Portonovo)', emoji:'🗼', photo:'',
              it:'Dominata dalla Torre De Bosis e affacciata sullo Scoglio della Vela, è una delle spiagge più suggestive della Riviera del Conero, dove il paesaggio unisce mare cristallino, falesie e macchia mediterranea.',
              en:'Dominated by the Torre De Bosis and facing the Scoglio della Vela, this is one of the most evocative beaches on the Riviera del Conero, where the landscape blends crystal-clear sea, cliffs and Mediterranean scrub.',
              de:'Überragt vom Torre De Bosis und mit Blick auf den Scoglio della Vela, ist dies einer der eindrucksvollsten Strände der Riviera del Conero.',
              pl:'Zdominowana przez wieżę Torre De Bosis i z widokiem na Scoglio della Vela, to jedna z najbardziej sugestywnych plaż Riviera del Conero.',
              itLong:'<p>Situata all\'estremità meridionale della baia di Portonovo, la Spiaggia della Torre prende il nome dalla storica Torre De Bosis, costruita a fine Ottocento sul promontorio che domina la costa. Da qui lo sguardo spazia fino allo scenografico Scoglio della Vela, uno dei punti più caratteristici del litorale del Conero.</p><p>La spiaggia, composta da ciottoli bianchi levigati dal mare, offre acque limpide e fondali ideali per il nuoto e lo snorkeling. È un luogo particolarmente apprezzato da chi cerca un ambiente più tranquillo, immerso nella natura del Parco del Conero.</p>',
              enLong:'<p>Located at the southern end of the Portonovo bay, the Spiaggia della Torre takes its name from the historic Torre De Bosis, built in the late 19th century on the headland overlooking the coast. From here the view stretches to the scenic Scoglio della Vela, one of the most distinctive features of the Conero coastline.</p><p>The beach, made of white sea-smoothed pebbles, offers clear waters and seabeds ideal for swimming and snorkelling, especially loved by those seeking a quieter setting within the Parco del Conero.</p>',
              itNote:'La Torre De Bosis, lo Scoglio della Vela, il panorama sulla baia di Portonovo, le acque cristalline.',
              enNote:'The Torre De Bosis, the Scoglio della Vela, the view over the Portonovo bay, the crystal-clear waters.',
              deNote:'Der Torre De Bosis, der Scoglio della Vela, der Blick auf die Bucht von Portonovo.',
              plNote:'Torre De Bosis, Scoglio della Vela, widok na zatokę Portonovo, krystaliczna woda.',
              dist:'🚌 12 km – 25 min', mapQuery:'Spiaggia della Torre Portonovo', lat:43.5635807, lng:13.5977443 },
            { order:8, name:'Spiaggia della Vela', emoji:'⛵', photo:'',
              it:'La Spiaggia della Vela è una delle spiagge più selvagge e affascinanti della Riviera del Conero. Prende il nome dall\'inconfondibile Scoglio della Vela, un faraglione che emerge dal mare con una caratteristica forma triangolare, diventato uno dei simboli della costa anconetana.',
              en:'The Spiaggia della Vela is one of the wildest and most fascinating beaches on the Riviera del Conero. It takes its name from the unmistakable Scoglio della Vela, a sea stack rising from the water with a distinctive triangular shape, which has become one of the symbols of the Ancona coast.',
              de:'Die Spiaggia della Vela ist einer der wildesten und faszinierendsten Strände der Riviera del Conero, benannt nach dem unverwechselbaren Scoglio della Vela, einer dreieckigen Felsnadel, die zu einem Symbol der Küste Anconas geworden ist.',
              pl:'Spiaggia della Vela to jedna z najbardziej dzikich i fascynujących plaż Riviera del Conero, nazwana od charakterystycznego Scoglio della Vela — skały o trójkątnym kształcie, która stała się symbolem wybrzeża Ankony.',
              itLong:'<p>Raggiungibile esclusivamente via mare, offre acque cristalline, fondali ricchi di vita marina e un ambiente incontaminato, ideale per chi ama lo snorkeling e la natura più autentica. La vista dello Scoglio della Vela, incorniciato dalle alte falesie del Monte Conero, regala uno degli scorci più spettacolari di tutta la Riviera.</p>',
              enLong:'<p>Reachable only by sea, it offers crystal-clear waters, seabeds rich in marine life and an unspoilt environment, ideal for snorkelling and authentic nature. The view of the Scoglio della Vela, framed by the high cliffs of Monte Conero, is one of the most spectacular sights on the whole Riviera.</p>',
              itTime:'Mezza giornata (escursione in barca).',enTime:'Half a day (boat excursion).',deTime:'Halber Tag (Bootsausflug).',plTime:'Pół dnia (wycieczka łodzią).',
              dist:'⛵ Solo via mare', mapQuery:'Spiaggia della Vela Conero', lat:43.5594192, lng:13.6059019 }
        ],

              it:'Cittadina balneare a 30 km a nord di Ancona, famosa per la Spiaggia di Velluto, sabbia finissima unica sull\'Adriatico. Centro storico con la Rocca Roveresca (XV sec.) e il porto canale. In estate ospita il Summer Jamboree, festival internazionale di musica e cultura anni \'40–\'50 tra i più grandi d\'Europa.',

            { name:'Sirolo', emoji:'🏘️', photo:'sirolo.jpg',
              it:'Arroccato su un balcone naturale affacciato sul mare, Sirolo è uno dei borghi più belli delle Marche. Vicoli fioriti, piazze panoramiche e scorci sul Conero lo rendono una meta imperdibile. Di origine medievale, conserva ancora oggi il fascino di un piccolo borgo fortificato.',
              en:'Perched on a natural balcony overlooking the sea, Sirolo is one of the most beautiful villages in the Marche. Flower-lined alleys, panoramic squares and Conero views make it an unmissable destination. Of medieval origin, it still retains the charm of a small fortified village.',
              de:'Auf einem natürlichen Balkon über dem Meer thronend, ist Sirolo eines der schönsten Dörfer der Marken. Mittelalterlichen Ursprungs, mit dem Charme eines kleinen befestigten Dorfes, blühenden Gassen und Panoramaplätzen.',
              pl:'Wznoszący się na naturalnym balkonie nad morzem, Sirolo to jedna z najpiękniejszych miejscowości Marchii. Średniowiecznego pochodzenia, wciąż zachowuje urok małej ufortyfikowanej wioski, z kwiecistymi uliczkami i panoramicznymi placami.',
              itLong:'<p>Passeggiando tra le strette vie del centro si incontrano botteghe artigiane, ristoranti, caffè e terrazze panoramiche che si aprono sul mare. La celebre Piazza Vittorio Veneto è il cuore del paese e offre una vista straordinaria sulla costa del Conero.</p><p>Durante l\'estate il borgo si anima con concerti, mercatini e manifestazioni culturali che ne rendono ancora più piacevole la visita.</p>',
              enLong:'<p>Strolling through the narrow streets of the centre you\'ll find craft workshops, restaurants, cafés and panoramic terraces opening onto the sea. The famous Piazza Vittorio Veneto is the heart of the village, offering an extraordinary view over the Conero coast.</p><p>In summer the village comes alive with concerts, markets and cultural events that make a visit even more enjoyable.</p>',
              itNote:'La terrazza di Piazza Vittorio Veneto: uno dei punti di vista più belli dell\'Adriatico.',

            { name:'Offagna', emoji:'🏰', photo:'offagna.jpg',
              it:'Inserito tra i Borghi più belli d\'Italia, Offagna è dominato da una splendida rocca medievale. Ogni estate ospita celebri rievocazioni storiche che trasformano le sue strade in un autentico villaggio medievale.',
              en:'Listed among Italy\'s most beautiful villages, Offagna is dominated by a splendid medieval fortress. Every summer famous historical re-enactments transform its streets into an authentic medieval village.',

            { name:'Loreto', emoji:'⛪', photo:'loreto.jpg',
              it:'Loreto è una delle principali mete di pellegrinaggio del mondo cattolico. La sua maestosa basilica custodisce la Santa Casa, secondo la tradizione la dimora della Madonna trasportata dalla Terra Santa; proprio per questo la Madonna di Loreto è diventata nel tempo la Patrona dell\'Aeronautica Militare Italiana e di tutto il mondo dell\'aviazione.',
              en:'Loreto is one of the main pilgrimage destinations in the Catholic world. Its majestic basilica houses the Holy House, traditionally the home of the Madonna transported from the Holy Land; for this very reason, the Madonna of Loreto has over time become the patron saint of the Italian Air Force and of the entire aviation world.',
              de:'Loreto ist eines der wichtigsten Pilgerziele der katholischen Welt. Die Basilika beherbergt das Heilige Haus, überliefert als Wohnstätte der Madonna aus dem Heiligen Land; deshalb wurde die Madonna von Loreto zur Schutzpatronin der italienischen Luftwaffe und der gesamten Luftfahrt.',
              pl:'Loreto to jedno z głównych miejsc pielgrzymkowych świata katolickiego. Bazylika kryje Świętą Chatę, według tradycji dom Madonny przeniesiony z Ziemi Świętej; właśnie dlatego Madonna z Loreto stała się patronką włoskiego lotnictwa wojskowego i całego świata lotnictwa.',
              itLong:'<p>La Basilica della Santa Casa rappresenta uno dei più importanti santuari mariani al mondo e accoglie milioni di pellegrini ogni anno. Il complesso monumentale unisce elementi rinascimentali, barocchi e neoclassici, custodendo opere d\'arte di straordinario valore.</p><p>Anche per chi non è interessato agli aspetti religiosi, Loreto offre un patrimonio storico e artistico di assoluto rilievo, oltre a splendide vedute sulla campagna marchigiana e sul mare Adriatico.</p>',
              enLong:'<p>The Basilica of the Holy House is one of the most important Marian shrines in the world and welcomes millions of pilgrims every year. The monumental complex blends Renaissance, Baroque and Neoclassical elements, housing artworks of extraordinary value.</p><p>Even for those uninterested in the religious side, Loreto offers historical and artistic heritage of the highest calibre, along with splendid views over the Marche countryside and the Adriatic Sea.</p>',
              itNote:'Il rivestimento marmoreo della Santa Casa, opera di Bramante e dei principali artisti del Rinascimento. Raggiungibile in treno da Ancona in circa 20 minuti.',
              enNote:'The marble casing of the Holy House, by Bramante and leading Renaissance artists. Reachable by train from Ancona in about 20 minutes.',
              deNote:'Marmorverkleidung von Bramante. Mit dem Zug von Ancona in ca. 20 Minuten erreichbar.',
              plNote:'Marmurowa okładzina dzieła Bramantego. Dostępne pociągiem z Ankony w około 20 minut.',
              itTime:'1–3 ore.',enTime:'1–3 hours.',deTime:'1–3 Stunden.',plTime:'1–3 godziny.',

            { name:'Recanati', emoji:'📖', photo:'recanati.jpg',
              it:'Città natale di Giacomo Leopardi, Recanati è uno dei luoghi più evocativi delle Marche. Letteratura, arte e paesaggi si fondono in un borgo che conserva intatto il fascino dell\'Ottocento. Passeggiare per Recanati significa entrare nei luoghi che hanno ispirato alcune delle pagine più celebri della letteratura italiana.',
              en:'Birthplace of Giacomo Leopardi, Recanati is one of the most evocative places in the Marche. Literature, art and landscapes blend in a village that keeps the charm of the 19th century intact. Walking through Recanati means stepping into the places that inspired some of the most celebrated pages of Italian literature.',
              de:'Geburtsort von Giacomo Leopardi, Recanati ist einer der eindrucksvollsten Orte der Marken. Literatur, Kunst und Landschaft verschmelzen in einem Dorf, das den Charme des 19. Jahrhunderts bewahrt hat.',
              pl:'Miasto rodzinne Giacoma Leopardiego, Recanati to jedno z najbardziej sugestywnych miejsc Marchii. Literatura, sztuka i krajobrazy łączą się w miasteczku, które zachowało nienaruszony urok XIX wieku.',
              itLong:'<p>Qui si trovano il Palazzo Leopardi, la Biblioteca di famiglia, il Colle dell\'Infinito e numerosi luoghi legati alla vita del poeta. Il centro storico conserva eleganti palazzi nobiliari, teatri e piazze che raccontano secoli di storia e cultura.</p><p>Anche chi non conosce approfonditamente Leopardi rimane affascinato dall\'atmosfera unica della città.</p>',
              enLong:'<p>Here you\'ll find Palazzo Leopardi, the family library, the Colle dell\'Infinito and numerous places linked to the poet\'s life. The historic centre preserves elegant noble palaces, theatres and squares that tell centuries of history and culture.</p><p>Even those unfamiliar with Leopardi\'s work are captivated by the town\'s unique atmosphere.</p>',
              de:'Geburtsort Leopardis (1798). Der Colle dell\'Infinito bei Sonnenuntergang unvergesslich.',
              pl:'Miasto rodzinne Leopardiego (1798). Colle dell\'Infinito o zachodzie słońca niezapomniane.',
              itNote:'Il Colle dell\'Infinito al tramonto: uno dei luoghi più poetici d\'Italia.',
              enNote:'The Colle dell\'Infinito at sunset: one of the most poetic places in Italy.',
              deNote:'Colle dell\'Infinito bei Sonnenuntergang: einer der poetischsten Orte.',
              plNote:'Colle dell\'Infinito o zachodzie: jedno z najbardziej poetyckich miejsc.',
              itPhoto:'Dal belvedere vicino all\'Orto sul Colle dell\'Infinito.',
              enPhoto:'From the belvedere near the garden on the Colle dell\'Infinito.',
              dePhoto:'Vom Belvedere am Colle dell\'Infinito.',
              plPhoto:'Z belwederu przy Colle dell\'Infinito.',
              itTime:'2–4 ore.',enTime:'2–4 hours.',deTime:'2–4 Stunden.',plTime:'2–4 godziny.',
              dist:'🚗 25 km – 38 min', mapQuery:'Recanati', lat:43.3980809, lng:13.5518423 },
            { name:'Urbino', emoji:'🎨', photo:'',
              it:'Patrimonio Mondiale UNESCO, Urbino è una delle città rinascimentali meglio conservate d\'Italia. Passeggiando tra le sue vie si respira ancora l\'atmosfera della corte dei Montefeltro, che nel Quattrocento la rese uno dei principali centri culturali d\'Europa.',
              en:'A UNESCO World Heritage Site, Urbino is one of Italy\'s best-preserved Renaissance cities. Walking through its streets you can still feel the atmosphere of the Montefeltro court, which in the 15th century made it one of Europe\'s leading cultural centres.',
              de:'UNESCO-Weltkulturerbe, Urbino ist eine der am besten erhaltenen Renaissancestädte Italiens. Beim Spaziergang durch die Gassen spürt man noch die Atmosphäre des Hofes der Montefeltro, der die Stadt im 15. Jahrhundert zu einem der wichtigsten Kulturzentren Europas machte.',
              pl:'Wpisane na listę UNESCO, Urbino to jedno z najlepiej zachowanych miast renesansowych we Włoszech. Spacerując jego uliczkami, wciąż można wyczuć atmosferę dworu Montefeltro, który w XV wieku uczynił je jednym z głównych ośrodków kulturalnych Europy.',
              itLong:'<p>Arroccata sulle colline marchigiane, Urbino deve il suo straordinario splendore al duca Federico da Montefeltro, che trasformò la città in un punto di riferimento per artisti, architetti e studiosi del Rinascimento.</p><p>Il monumento simbolo è il maestoso Palazzo Ducale, oggi sede della Galleria Nazionale delle Marche, che custodisce importanti opere di Piero della Francesca, Raffaello e di altri grandi maestri. Da non perdere anche la Casa Natale di Raffaello, il Duomo e il fitto intreccio di vicoli, scalinate e piazze che rendono ogni passeggiata un viaggio nella storia.</p>',
              enLong:'<p>Perched on the hills of the Marche, Urbino owes its extraordinary splendour to Duke Federico da Montefeltro, who turned the city into a reference point for Renaissance artists, architects and scholars.</p><p>Its landmark monument is the majestic Palazzo Ducale, today home to the National Gallery of the Marche, housing important works by Piero della Francesca, Raphael and other great masters. Also not to be missed: Raphael\'s birthplace, the Cathedral, and the dense network of alleys, staircases and squares that make every walk a journey through history.</p>',
              itTime:'Mezza giornata – giornata intera.',enTime:'Half day – full day.',deTime:'Halber – ganzer Tag.',plTime:'Pół – cały dzień.',
              dist:'🚗 100 km – 1h30', mapQuery:'Urbino PU', lat:43.7262, lng:12.6363 },
            { name:'Ascoli Piceno', emoji:'⛲', photo:'',
              it:'Elegante e raffinata, Ascoli Piceno è conosciuta come la città del travertino. Il suo centro storico, tra i più belli d\'Italia, è ricco di piazze monumentali, chiese e palazzi che raccontano oltre duemila anni di storia.',
              en:'Elegant and refined, Ascoli Piceno is known as the city of travertine. Its historic centre, among the most beautiful in Italy, is rich in monumental squares, churches and palaces telling over two thousand years of history.',
              de:'Elegant und raffiniert, Ascoli Piceno ist als Stadt des Travertins bekannt. Ihr historisches Zentrum, eines der schönsten Italiens, ist reich an monumentalen Plätzen, Kirchen und Palästen.',
              pl:'Elegancka i wyrafinowana, Ascoli Piceno znana jest jako miasto trawertynu. Jej historyczne centrum, jedno z najpiękniejszych we Włoszech, obfituje w monumentalne place, kościoły i pałace.',
              itLong:'<p>Il cuore della città è la splendida Piazza del Popolo, considerata uno dei più armoniosi esempi di piazza rinascimentale italiana. Qui si affacciano il Palazzo dei Capitani del Popolo, la storica Chiesa di San Francesco e gli eleganti portici che ospitano il celebre Caffè Meletti, simbolo della città.</p><p>Meritano una visita anche Piazza Arringo, il Duomo di Sant\'Emidio e il Ponte Romano di Solestà. Prima di ripartire è quasi d\'obbligo assaggiare le autentiche olive all\'ascolana, nate proprio qui.</p>',
              enLong:'<p>The heart of the city is the splendid Piazza del Popolo, considered one of the most harmonious examples of an Italian Renaissance square. Here stand the Palazzo dei Capitani del Popolo, the historic Church of San Francesco and the elegant porticoes housing the famous Caffè Meletti, a symbol of the city.</p><p>Also worth a visit are Piazza Arringo, the Cathedral of Sant\'Emidio and the Roman Bridge of Solestà. Before leaving, it\'s almost obligatory to try the authentic olive all\'ascolana, born right here.</p>',
              itTime:'Mezza giornata – giornata intera.',enTime:'Half day – full day.',deTime:'Halber – ganzer Tag.',plTime:'Pół – cały dzień.',
              dist:'🚗 120 km – 1h40', mapQuery:'Ascoli Piceno AP', lat:42.8534, lng:13.5741 },
            { name:'Grotte di Frasassi', emoji:'🕯️', photo:'frasassi.jpg',
              it:'Le Grotte di Frasassi sono uno dei complessi carsici più spettacolari d\'Europa. Un percorso sotterraneo tra sale immense, stalattiti e stalagmiti che regala uno degli spettacoli naturali più affascinanti delle Marche.',
              en:'The Frasassi Caves are one of the most spectacular karst systems in Europe. An underground route through immense chambers, stalactites and stalagmites offers one of the most fascinating natural spectacles in the Marche.',
              de:'Die Grotten von Frasassi sind eines der spektakulärsten Karstsysteme Europas. Ein unterirdischer Weg durch riesige Säle, Stalaktiten und Stalagmiten bietet eines der faszinierendsten Naturschauspiele der Marken.',
              pl:'Groty Frasassi to jeden z najbardziej spektakularnych systemów krasowych w Europie. Podziemna trasa przez ogromne sale, stalaktyty i stalagmity oferuje jedno z najbardziej fascynujących widowisk przyrodniczych Marchii.',
              itLong:'<p>Scoperte nel 1971 e aperte al pubblico pochi anni dopo, le Grotte di Frasassi si sviluppano per oltre trenta chilometri nel sottosuolo del Parco Naturale Regionale della Gola della Rossa e di Frasassi.</p><p>Il percorso turistico attraversa ambienti di straordinaria bellezza, come l\'imponente Abisso Ancona, una cavità talmente vasta da poter contenere il Duomo di Milano, e la spettacolare Sala delle Candeline, ricca di delicate concrezioni calcaree modellate dall\'acqua nel corso di milioni di anni.</p><p>La visita è adatta a tutti e si svolge lungo un itinerario guidato di circa un\'ora e un quarto, con una temperatura costante di circa 14 °C durante tutto l\'anno.</p><p>🔗 <a href="https://www.frasassi.com" target="_blank" rel="noopener noreferrer">Acquista i biglietti</a></p>',
              enLong:'<p>Discovered in 1971 and opened to the public a few years later, the Frasassi Caves extend for over thirty kilometres beneath the Gola della Rossa and Frasassi Regional Nature Park.</p><p>The tourist route crosses environments of extraordinary beauty, such as the imposing Abisso Ancona, a cavity so vast it could contain Milan\'s Cathedral, and the spectacular Sala delle Candeline, rich in delicate limestone formations shaped by water over millions of years.</p><p>The visit is suitable for everyone and follows a guided route of about an hour and a quarter, with a constant temperature of around 14°C all year round.</p><p>🔗 <a href="https://www.frasassi.com" target="_blank" rel="noopener noreferrer">Buy tickets</a></p>',
              itNote:'Biglietto online fortemente consigliato, soprattutto in alta stagione, per evitare lunghe attese in biglietteria.',
              enNote:'Online tickets strongly recommended, especially in high season, to avoid long queues at the ticket office.',
              deNote:'Online-Tickets werden dringend empfohlen, besonders in der Hochsaison.',
              plNote:'Zdecydowanie zalecane bilety online, zwłaszcza w wysokim sezonie.',
              itTime:'1h15 (visita guidata) + spostamento.',enTime:'1h15 (guided tour) + travel.',deTime:'1 Std. 15 (Führung) + Anfahrt.',plTime:'1 godz. 15 (zwiedzanie) + dojazd.',
              dist:'🚗 65 km – 50 min', mapQuery:'Grotte di Frasassi', lat:43.3963, lng:12.9691 }
        ],

            intro: {
                it:'La cucina anconetana racconta il legame profondo tra mare e colline. Piatti di pesce, ricette tramandate da generazioni e prodotti del territorio rendono la gastronomia locale una delle esperienze da non perdere durante il soggiorno.',
                en:'Ancona\'s cuisine tells of the deep bond between sea and hills. Fish dishes, recipes handed down through generations and local products make the local gastronomy one of the unmissable experiences of a stay.',
                de:'Die anconitanische Küche erzählt von der Verbindung zwischen Meer und Hügeln.',
                pl:'Kuchnia ankońska opowiada o głębokim związku między morzem a wzgórzami.'
            },

                it:'Se soggiorni nel weekend o nei mesi estivi, prenota con anticipo, soprattutto per i ristoranti di pesce e quelli di Portonovo.',
                en:'If staying at the weekend or in summer, book in advance, especially for fish restaurants and those at Portonovo.',

            dishes: [
                { name:'Brodetto all\'Anconetana', emoji:'🍲',
                  it:'Il piatto simbolo della tradizione marinara cittadina. Nato a bordo delle barche da pesca con il pesce invendibile, viene preparato con numerose varietà di pesce cucinate con pomodoro, cipolla, olio extravergine, zafferano e una piccola quantità di aceto — gli ingredienti che gli conferiscono il tipico colore dorato e un sapore inconfondibile, distinguendolo da altre versioni adriatiche.',
                  en:'The signature dish of the city\'s maritime tradition. Born on fishing boats using unsaleable fish, it is made with many varieties of fish cooked with tomato, onion, extra virgin olive oil, saffron and a little vinegar — the ingredients that give it its typical golden colour and unmistakable flavour, setting it apart from other Adriatic versions.',
                  de:'Das Wahrzeichen-Gericht der maritimen Tradition der Stadt. Viele Fischarten mit Tomaten, Zwiebeln, Öl, Safran und Essig — die goldene Farbe und der unverwechselbare Geschmack.',
                  pl:'Flagowe danie morskiej tradycji miasta. Wiele gatunków ryb z pomidorami, cebulą, oliwą, szafranem i octem — złoty kolor i niepowtarzalny smak.' },
                { name:'Sardoncini Scottadito', emoji:'🐟',
                  it:'Uno dei piatti più amati della tradizione anconetana. Le alici dell\'Adriatico vengono cotte alla griglia e servite ben calde, tanto da doverle mangiare "scottandosi le dita", da cui deriva il loro nome. Semplici e saporiti, sono perfetti accompagnati da pane e un bicchiere di vino bianco locale.',
                  en:'One of the most beloved dishes of the Ancona tradition. Adriatic anchovies are grilled and served piping hot, so hot you have to eat them "burning your fingers" — hence the name. Simple and flavourful, perfect with bread and a glass of local white wine.',
                  de:'Eines der beliebtesten Gerichte Anconas. Adria-Sardellen werden gegrillt und heiß serviert. Einfach und schmackhaft, perfekt mit Brot und einem Glas lokalem Weißwein.',
                  pl:'Jedno z ulubionych dań tradycji ankońskiej. Sardele z Adriatyku grillowane i podawane na gorąco. Proste i smaczne, doskonałe z chlebem i kieliszkiem lokalnego białego wina.' },
                { name:'Raguse in Porchetta', emoji:'🐚',
                  it:'Specialità tipica della costa anconetana dal sapore intenso e aromatico. Le lumachine di mare vengono cotte nel pomodoro con finocchietto selvatico, aglio e spezie, richiamando i profumi della tradizionale porchetta marchigiana. Immancabile la classica scarpetta.',
                  en:'A typical speciality of the Ancona coast with an intense, aromatic flavour. Sea snails are cooked in tomato with wild fennel, garlic and spices, echoing the aromas of traditional Marche-style porchetta. Mopping up the sauce with bread is a must.',
                  de:'Typische Spezialität der Küste Anconas mit intensivem, aromatischem Geschmack. Meeresschnecken in Tomatensauce mit wildem Fenchel, Knoblauch und Gewürzen.',
                  pl:'Typowy specjał wybrzeża Ankony o intensywnym, aromatycznym smaku. Ślimaki morskie duszone w pomidorach z dzikim koperkiem, czosnkiem i przyprawami.' },
                { name:'Moscioli Selvatici di Portonovo', emoji:'🦪',
                  it:'Mitili selvatici delle rocce del Monte Conero, Presidio Slow Food. Raccolti solo da pescatori autorizzati in mare aperto, disponibili in determinati periodi.',
                  en:'Wild mussels from the rocks of Monte Conero, Slow Food Presidium. Collected only by authorised fishermen in open sea, available in certain periods.',
                  de:'Wilde Muscheln vom Monte Conero, Slow Food Presidium. Begrenzte Verfügbarkeit.',
                  pl:'Dzikie małże Monte Conero, Slow Food Presidium. Ograniczona dostępność.' },
                { name:'Stoccafisso all\'Anconetana', emoji:'🐟',
                  it:'Lo stoccafisso arrivava da Norvegia sulle navi mercantili. Lunga cottura con patate, pomodoro, vino bianco, olive e aromi mediterranei.',

                  de:'Stockfisch aus Norwegen. Lange mit Kartoffeln, Tomaten und Oliven gekocht.',
                  pl:'Sztokfisz z Norwegii. Długo gotowany z ziemniakami i oliwkami.' },
                { name:'Vincisgrassi', emoji:'🍝',
                  it:'La versione marchigiana delle lasagne: strati di pasta fresca, ragù di carne e besciamella. Tradizionalmente serviti durante le festività.',
                  en:'The Marche version of lasagne: layers of fresh pasta, meat ragù and béchamel. Traditionally served at festivities.',
                  de:'Marken-Lasagne: frische Pasta, Fleischsauce, Béchamel.',
                  pl:'Lasagne z Marchii: świeże ciasto, ragù mięsne, sos beszamelowy.' },

degli Archi\', oddalonym o 1,5 km, skąd można łatwo dojść pieszo, spacerując z widokiem na port i katedrę.<br><br>Jeśli wolisz autobus, wsiądź w linię 1/4 w kierunku centrum i wysiądź na Piazza Roma (5 minut).' },

    // Item 3 V5.0: aggiunta validazione regex formato data; no timezone hardcoded (usa locale browser)
    function getCountdownHtml() {
        try {
            const co = new URLSearchParams(window.location.search).get('checkout');
            if (!co || !/^\d{4}-\d{2}-\d{2}$/.test(co)) return '';
            const target = new Date(co + 'T11:00:00');
            if (isNaN(target.getTime())) return '';
            const now = new Date();
            const diff = target - now;
            if (diff <= 0 || diff > 30*24*3600*1000) return '';
            const d = Math.floor(diff/86400000);
            const h = Math.floor((diff%86400000)/3600000);
            const m = Math.floor((diff%3600000)/60000);
            // Data leggibile localizzata
            const months_it=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
            const months_en=['January','February','March','April','May','June','July','August','September','October','November','December'];
            const months_de=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
            const months_pl=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
            const day=target.getDate();
            const mi=target.getMonth();
            const dateStr=tr(day+' '+months_it[mi], day+' '+months_en[mi], day+'. '+months_de[mi], day+' '+months_pl[mi]);
            // Stringa tempo mancante
            const timeStr = d > 0 ? d+'g '+h+'h' : h > 0 ? h+'h '+m+'m' : m+' min';
            const labelLeft = tr('Check-out entro le 11:00','Check-out by 11:00','Check-out bis 11:00 Uhr','Wymeldowanie do 11:00');
            const labelCenter = tr('Mancano','Remaining','Noch','Pozostało');
            return '<div class="checkout-countdown">'
                +'<div class="countdown-left">'
                +'<div class="countdown-left-label">'+labelLeft+'</div>'
                +'<div class="countdown-left-date">'+dateStr+'</div>'
                +'</div>'
                +'<div class="countdown-center">'
                +'<div class="countdown-center-label">'+labelCenter+'</div>'
                +'<div class="countdown-center-value">'+timeStr+'</div>'
                +'</div>'
                +'</div>';
        } catch(e) { return ''; }
    }

    function calcDistance(lat1, lon1, lat2, lon2) { const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

    }

    // === FULLSCREEN MAP FUNCTIONS ===
    function openFullscreenMap() {
        // Item 10 V5.0: guard anti-double-open
        if (isFullscreenOpening) return;
        const overlay = document.getElementById('map-fullscreen-overlay');
        if (!overlay) return;
        if (overlay.classList.contains('active')) return;
        isFullscreenOpening = true;
        
        fsIsHome = (currentSection === -1);
        fsSubItineraryId = currentSubItinerary || null;
        
        if (fsIsHome) {
            fsStoredPlaces = [];
        } else {
            const places = currentSectionPlaces || [];
            fsStoredPlaces = places
                .filter(p => p && p.lat && p.lng)
                .map(p => {
                    const copy = { ...p };
                    copy._originalIndex = places.indexOf(p);
                    return copy;
                });
        }
        
        const titleEl = document.getElementById('map-fs-title');
        if (titleEl) {
            if (fsIsHome) {
                titleEl.textContent = '🗺️ Ancona Centro';
            } else if (fsSubItineraryId) {
                const parent = appData.mustsee.find(m => m.subId === fsSubItineraryId);
                titleEl.textContent = '🗺️ ' + (parent ? parent.name : 'Percorso');
            } else if (currentSection >= 0 && sections[currentSection]) {
                const s = sections[currentSection];
                titleEl.textContent = '🗺️ ' + tr(s.it, s.en, s.de, s.pl);
            } else {
                titleEl.textContent = '🗺️ Mappa';
            }
        }
        
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        isFullscreenOpening = false; // guard rilasciato dopo apertura effettiva

        // FIX #4 V5.0 27/06/26: handler persistente — removeEventListener funziona solo se
        // si rimuove la stessa istanza di funzione. La versione precedente creava _handler
        // come nuova funzione ad ogni apertura, rendendo il removeEventListener un no-op
        // e accumulando N listener touchend/click dopo N aperture del fullscreen.
        const closeBtn = document.getElementById('map-fs-close');
        if (closeBtn) {
            if (_fsCloseHandler) {
                closeBtn.removeEventListener('touchend', _fsCloseHandler);
                closeBtn.removeEventListener('click', _fsCloseHandler);
            }
            _fsCloseHandler = function(e) {
                e.preventDefault();
                e.stopPropagation();
                closeFullscreenMap();
            };
            closeBtn.addEventListener('touchend', _fsCloseHandler, { passive: false });
            closeBtn.addEventListener('click', _fsCloseHandler);
        }

        requestAnimationFrame(() => {
            initFullscreenMap();
        });
    }

    function closeFullscreenMap() {
        const overlay = document.getElementById('map-fullscreen-overlay');
        if (!overlay) return;
        if (!overlay.classList.contains('active')) return; // Item 6/10: no-op se già chiusa
        
        overlay.classList.remove('active');
        document.body.style.overflow = '';
        
        // V5.0 12/07/26: ferma il GPS dedicato alla mappa fullscreen alla chiusura
        if (fsGpsWatchId !== null) { navigator.geolocation.clearWatch(fsGpsWatchId); fsGpsWatchId = null; }
        fsGpsMarker = null; fsGpsCircle = null;
        
        if (fullscreenMapInstance) {
            if (fullscreenMapInstance._resizeHandler) {
                window.removeEventListener('resize', fullscreenMapInstance._resizeHandler);
            }
            fullscreenMapInstance.remove();
            fullscreenMapInstance = null;
        }
        fsStoredPlaces = [];
        fsIsHome = false;
        fsSubItineraryId = null;
    }

    function initFullscreenMap() {
        // Item 6 V5.0: check overlay attivo prima di inizializzare
        const overlay = document.getElementById('map-fullscreen-overlay');
        if (!overlay || !overlay.classList.contains('active')) return;

        const el = document.getElementById('fullscreenMap');
        if (!el) return;
        
        if (typeof L === 'undefined') {
            setTimeout(initFullscreenMap, 300);
            return;
        }
        
        if (fullscreenMapInstance) {
            if (fullscreenMapInstance._resizeHandler) {
                window.removeEventListener('resize', fullscreenMapInstance._resizeHandler);
            }
            fullscreenMapInstance.remove();
            fullscreenMapInstance = null;
        }
        
        fullscreenMapInstance = L.map('fullscreenMap', {
            zoomControl: true,
            attributionControl: true
        });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(fullscreenMapInstance);
        
        const bounds = [];
        const places = fsStoredPlaces || [];
        const isSub = !!fsSubItineraryId;
        
        places.forEach((p, idx) => {
            if (!p.lat || !p.lng) return;
            
            let displayNum;
            if (isSub) {
                displayNum = String.fromCharCode(65 + idx);
            } else if (typeof p.order === 'number') {
                displayNum = p.order;
            } else if (typeof p.order === 'string' && p.order.indexOf('bis') > -1) {
                displayNum = p.order.replace('-bis', 'b');
            } else {
                displayNum = idx + 1;
            }
            
            let markerClass = 'map-marker-num';
            if (isSub && (fsSubItineraryId === 'cardeto' || fsSubItineraryId === 'cittadella')) {
                markerClass += ' ' + fsSubItineraryId;
            }
            if (p.isSubItinerary) markerClass += ' has-sub';
            
            const icon = L.divIcon({
                html: '<div class="' + markerClass + '" aria-label="' + p.name + '" role="img">' + displayNum + '</div>',
                className: '',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -14]
            });
            
            const m = L.marker([p.lat, p.lng], { icon: icon }).addTo(fullscreenMapInstance);
            m.bindPopup('<b style="font-size:.78rem">' + p.emoji + ' ' + p.name + '</b><br><span style="font-size:.68rem;color:#888">' + (p.dist || '') + '</span>');

                // del wrapper temporaneo grezzo invece di sostituire il nodo. replaceWith(newEl)

                const temp = document.createElement('div');

            } else {

                clearInterval(_countdownInterval);
            }

    // Fetch con cache in sessionStorage (30 minuti) per limitare le chiamate API
    async function fetchWeather(){
        const CACHE_KEY='guida_weather_cache_v1',CACHE_MS=30*60*1000;
        try{
            const cached=sessionStorage.getItem(CACHE_KEY);
            if(cached){
                const parsed=JSON.parse(cached);
                if(Date.now()-parsed.ts<CACHE_MS)return parsed.data;
            }
        }catch(e){}
        try{
            const url='https://api.open-meteo.com/v1/forecast?latitude='+HOME_COORDS.lat+'&longitude='+HOME_COORDS.lng+'&current=temperature_2m,weather_code&timezone=Europe%2FRome';
            const res=await fetch(url);
            if(!res.ok)return null;
            const json=await res.json();
            const data={temp:Math.round(json.current.temperature_2m),code:json.current.weather_code};
            try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data:data}));}catch(e){}
            return data;
        }catch(e){return null;}
    }

    function selectServiceItem(i){

    function initSectionMap(){
        // FIX B3 V5.0 30/06/26: il contatore va azzerato all'ingresso di ogni chiamata
        // "fresca" (non di retry), non solo dopo la verifica di L. La versione precedente
        // azzerava _mapRetryCount=0 solo nel ramo "L definito", quindi se due chiamate
        // concorrenti partivano mentre L non era ancora pronto, il contatore condiviso
        // si esauriva prima del previsto interrompendo il retry.
        if(typeof L==='undefined'){if(_mapRetryCount<30){_mapRetryCount++;setTimeout(initSectionMap,300);}return;}
        _mapRetryCount=0;const el=document.getElementById('sectionMap');if(!el||!currentSectionPlaces.length)return;
        if(leafletMap){leafletMap.remove();leafletMap=null;}
        const valid=currentSectionPlaces.filter(p=>p.lat&&p.lng);if(!valid.length)return;
        leafletMap=L.map('sectionMap',{zoomControl:true,attributionControl:true});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(leafletMap);
        const bounds=[];
        valid.forEach((p,idx)=>{const displayNum=getDisplayNumber(p,idx);let markerClass='map-marker-num';if(currentSubItinerary==='cardeto'||currentSubItinerary==='cittadella')markerClass+=' '+currentSubItinerary;if(p.isSubItinerary)markerClass+=' has-sub';const icon=L.divIcon({html:'<div class="'+markerClass+'" aria-label="'+p.name+'" role="img">'+displayNum+'</div>',className:'',iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14]});const m=L.marker([p.lat,p.lng],{icon:icon}).addTo(leafletMap);m.bindPopup('<b style="font-size:.78rem">'+p.emoji+' '+p.name+'</b><br><span style="font-size:.68rem;color:#888">'+p.dist+'</span>');
            m.on('click',function(e){
                // Bug fix V5.0: stopPropagation impedisce che il click sul marker
                // risalga alla mappa e apra il fullscreen inaspettatamente
                L.DomEvent.stopPropagation(e);
                // Bug fix V5.0: getElement() ritorna il wrapper leaflet-marker-icon,
                // il figlio diretto è il div .map-marker-num → usare firstElementChild
                document.querySelectorAll('.map-marker-num').forEach(el=>el.classList.remove('selected'));
                this.getElement()?.firstElementChild?.classList.add('selected');
                // FIX B4 V5.0 30/06/26: idx era l'indice dentro valid[] (filtrato per
                // p.lat&&p.lng), non in currentSectionPlaces. Se un punto senza coordinate
                // precedeva altri nella lista, selectPlaceDetail(idx) apriva il dettaglio
                // del punto sbagliato. Si usa l'indice originale via indexOf.
                selectPlaceDetail(currentSectionPlaces.indexOf(p));
            });
            bounds.push([p.lat,p.lng]);
        });
        if(bounds.length)leafletMap.fitBounds(bounds,{padding:[22,22]});
        
        // Apri fullscreen al click sulla mappa (solo se non su marker — gestito da stopPropagation)
        if (leafletMap) {
            leafletMap.on('click', function() {
                openFullscreenMap();
            });
            el.style.cursor = 'pointer';
        }
        
        const starIcon=L.divIcon({html:'<div class="map-marker-star" aria-label="Ancona Centro" role="img">★</div>',className:'',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-16]});
        L.marker([HOME_COORDS.lat,HOME_COORDS.lng],{icon:starIcon,zIndexOffset:1000}).addTo(leafletMap).bindPopup('<b style="font-size:.78rem">★ Ancona Centro</b><br><span style="font-size:.68rem;color:#888">📍 Piazza Roma 3</span>');
    }

    if('serviceWorker' in navigator)window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(reg=>{
            // Invia APP_CACHE_NAME al SW (attivo, in waiting o in installazione)
            // così sw.js non ha più bisogno del CACHE_NAME hardcoded
            const sendVersion=sw=>{if(sw)sw.postMessage({type:'SET_CACHE_NAME',cacheName:APP_CACHE_NAME});};
            sendVersion(reg.active);
            sendVersion(reg.waiting);
            sendVersion(reg.installing);

            // Mostra banner se c'è già un SW in waiting al momento del caricamento
            if(reg.waiting) showUpdateBanner(reg.waiting);

            reg.addEventListener('updatefound',()=>{
                const newSW=reg.installing;
                if(!newSW)return;
                sendVersion(newSW);
                newSW.addEventListener('statechange',()=>{
                    if(newSW.state==='installed'&&navigator.serviceWorker.controller){
                        showUpdateBanner(newSW);
                    }
                });
            });
        }).catch(()=>{});

        let _reloading=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
            if(_reloading)return;
            _reloading=true;
            window.location.reload();
        });
    });

    function showUpdateBanner(swWaiting){
        const banner=document.getElementById('sw-update-banner');
        const btn=document.getElementById('sw-update-btn');
        if(!banner||!btn)return;
        banner.classList.add('visible');
        // Al click: invia skipWaiting al SW in attesa → controllerchange → reload
        const _tap=function(e){
            e.preventDefault();
            btn.removeEventListener('touchend',_tap);
            btn.removeEventListener('click',_tap);
            if(swWaiting)swWaiting.postMessage('skipWaiting');
        };
        btn.addEventListener('touchend',_tap,{passive:false});
        btn.addEventListener('click',_tap);
    }
    window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;const installBtn=document.getElementById('install-btn');if(installBtn)installBtn.style.display='inline-flex';});
    window.addEventListener('appinstalled',()=>{deferredPrompt=null;const installBtn=document.getElementById('install-btn');if(installBtn)installBtn.style.display='none';});
    if(window.matchMedia('(display-mode:standalone)').matches){const installBtn=document.getElementById('install-btn');if(installBtn)installBtn.style.display='none';}
    window.addEventListener('load',()=>{const hash=window.location.hash.replace('#','');if(hash&&sectionHashMap[hash]!==undefined)goTo(sectionHashMap[hash]);});
    window.addEventListener('popstate',()=>{const hash=window.location.hash.replace('#','');if(!hash){if(currentSection!==-1)goTo(-1);}else if(sectionHashMap[hash]!==undefined&&sectionHashMap[hash]!==currentSection)goTo(sectionHashMap[hash]);});
    
    // Inizializza fullscreen listeners
    initFullscreenListeners();
    renderAll();
    setTimeout(updateGpsUI,300);
    </script>
