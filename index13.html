        portonovo: [
            { order:1, name:'Portonovo – Baia del Conero', emoji:'🏝️', photo:'portonovo.jpg',
              it:'Incastonata tra il Monte Conero e il mare Adriatico, Portonovo è una delle baie più affascinanti d\'Italia.',
              en:'Nestled between Monte Conero and the Adriatic Sea, Portonovo is one of Italy\'s most enchanting bays.',
              de:'Eingebettet zwischen dem Monte Conero und der Adria ist Portonovo eine der bezauberndsten Buchten Italiens.',
              pl:'Wtulona między Monte Conero a Adriatykiem, Portonovo to jedna z najbardziej zachwycających zatok Włoch.',
              itLong:'<p>Natura, mare cristallino, storia e ottima cucina si incontrano in uno scenario unico. Protetta dalle pendici del Monte Conero, la baia conserva un paesaggio rimasto sorprendentemente intatto: spiagge di ciottoli bianchi, acqua limpida e il verde della macchia mediterranea interrotto da due laghetti di acqua salmastra.</p><p>Qui sorgono alcuni dei ristoranti di pesce più rinomati della zona, insieme allo storico Fortino Napoleonico, alla Torre De Bosis e alla suggestiva Chiesa di Santa Maria di Portonovo. Portonovo è perfetta sia per una giornata di mare sia come punto di partenza per escursioni sul Conero.</p><p>Vi si trovano stabilimenti balneari attrezzati alternati a tratti di spiaggia libera particolarmente apprezzati dagli anconetani. D\'estate i parcheggi si esauriscono presto, ma a monte è disponibile un ampio parcheggio servito da una comoda navetta gratuita. È anche possibile arrivare con il bus 94, che collega la stazione di Ancona e la piazzetta di Portonovo passando per piazza Cavour.</p>',
              enLong:'<p>Nature, crystal-clear sea, history and excellent cuisine meet in a unique setting. Protected by the slopes of Monte Conero, the bay preserves a landscape that remains remarkably intact: white pebble beaches, clear water and Mediterranean scrub broken up by two brackish lakes.</p><p>Some of the area\'s most renowned fish restaurants are found here, alongside the historic Napoleonic Fort, the Torre De Bosis and the evocative Church of Santa Maria di Portonovo. Portonovo is perfect both for a day at the sea and as a starting point for excursions on the Conero.</p><p>Equipped beach clubs alternate with free stretches of beach especially loved by locals. In summer the car parks fill up quickly, but a large car park uphill is served by a free shuttle. Bus 94 also connects Ancona\'s station and Portonovo\'s little square, passing through Piazza Cavour.</p>',
              deLong:'<p>Natur, kristallklares Meer, Geschichte und ausgezeichnete Küche treffen hier in einzigartiger Kulisse aufeinander, mit weißen Kieselstränden und zwei Brackwasserseen.</p><p>Hier befinden sich einige der renommiertesten Fischrestaurants der Gegend sowie das historische Napoleonische Fort, der Torre De Bosis und die eindrucksvolle Kirche Santa Maria di Portonovo.</p><p>Im Sommer sind die Parkplätze schnell voll, aber oben gibt es einen großen Parkplatz mit kostenlosem Shuttle. Auch mit Bus 94 erreichbar.</p>',
              plLong:'<p>Natura, krystaliczne morze, historia i doskonała kuchnia spotykają się w wyjątkowej scenerii, z białymi kamienistymi plażami i dwoma słonawymi jeziorkami.</p><p>Znajdują się tu jedne z najbardziej renomowanych restauracji rybnych w okolicy, obok historycznego Fortu Napoleońskiego, Torre De Bosis i sugestywnego kościoła Santa Maria di Portonovo.</p><p>Latem parkingi szybko się zapełniają, ale wyżej dostępny jest duży parking z bezpłatnym shuttle. Dojazd możliwy też autobusem 94.</p>',
              itNote:'Con bus 94 da piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Orari Conerobus ↗</a>',
              enNote:'By bus 94 from Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus timetables ↗</a>',
              deNote:'Mit Bus 94 ab Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus Fahrpläne ↗</a>',
              plNote:'Autobusem 94 z Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Rozkład Conerobus ↗</a>',
              itPhoto:'Dal Belvedere sopra la baia con il contrasto verde-azzurro.',
              enPhoto:'From the Belvedere above the bay with the green-blue contrast.',
              dePhoto:'Vom Belvedere über der Bucht.',
              plPhoto:'Z Belvedere nad zatoką.',
              dist:'🚌 12 km – 25 min', mapQuery:'Baia di Portonovo Ancona', lat:43.5636463, lng:13.5976903 },
            { order:2, name:'Chiesa di Santa Maria di Portonovo', emoji:'⛪', photo:'',
              it:'Affacciata direttamente sul mare, la Chiesa di Santa Maria di Portonovo è uno dei monumenti romanici più suggestivi delle Marche.',
              en:'Facing directly onto the sea, the Church of Santa Maria di Portonovo is one of the most evocative Romanesque monuments in the Marche.',
              de:'Direkt am Meer gelegen, ist die Kirche Santa Maria di Portonovo eines der eindrucksvollsten romanischen Bauwerke der Marken.',
              pl:'Stojący tuż nad morzem kościół Santa Maria di Portonovo to jeden z najbardziej sugestywnych zabytków romańskich w Marchii.',
              itLong:'<p>Costruita nell\'XI secolo dai monaci benedettini, unisce elementi romanici, bizantini e paleocristiani, creando un edificio unico nel suo genere.</p><p>La posizione, a pochi metri dalla spiaggia, rende questo luogo particolarmente suggestivo. Nel corso dei secoli terremoti e frane hanno modificato il paesaggio circostante, ma la chiesa continua a rappresentare uno dei simboli della baia.</p><p>L\'interno, semplice ed essenziale, invita al silenzio e alla contemplazione.</p>',
              enLong:'<p>Built in the 11th century by Benedictine monks, it blends Romanesque, Byzantine and Early Christian elements into a truly unique building.</p><p>Its position just metres from the beach makes this place particularly evocative. Over the centuries earthquakes and landslides have reshaped the surrounding landscape, yet the church remains one of the symbols of the bay.</p><p>The simple, essential interior invites silence and contemplation.</p>',
              deLong:'<p>Im 11. Jahrhundert von Benediktinermönchen erbaut, vereint sie romanische, byzantinische und frühchristliche Elemente.</p><p>Die Lage nur wenige Meter vom Strand entfernt macht diesen Ort besonders eindrucksvoll.</p>',
              plLong:'<p>Zbudowany w XI wieku przez mnichów benedyktyńskich, łączy elementy romańskie, bizantyjskie i wczesnochrześcijańskie.</p><p>Położenie zaledwie kilka metrów od plaży czyni to miejsce wyjątkowo sugestywnym.</p>',
              deLong:'<p>Die Lage nur wenige Meter vom Strand entfernt macht diesen Ort besonders eindrucksvoll. Erdbeben und Erdrutsche haben im Laufe der Jahrhunderte die Landschaft verändert, doch die Kirche bleibt eines der Symbole der Bucht.</p>',
              plLong:'<p>Położenie zaledwie kilka metrów od plaży czyni to miejsce wyjątkowo sugestywnym. Trzęsienia ziemi i osunięcia terenu zmieniały krajobraz na przestrzeni wieków, lecz kościół pozostaje jednym z symboli zatoki.</p>',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Chiesa di Santa Maria di Portonovo' , lat:43.5608356, lng:13.6020616 },
            { order:3, name:'Fortino Napoleonico', emoji:'🏰', photo:'',
              it:'Costruito all\'inizio dell\'Ottocento per difendere la baia, il Fortino Napoleonico è oggi uno degli edifici storici più caratteristici di Portonovo.',
              en:'Built in the early 19th century to defend the bay, the Napoleonic Fort is today one of the most characteristic historic buildings in Portonovo.',
              de:'Zu Beginn des 19. Jahrhunderts zur Verteidigung der Bucht erbaut, ist das Napoleonische Fort heute eines der markantesten historischen Gebäude von Portonovo.',
              pl:'Zbudowany na początku XIX wieku dla obrony zatoki, Fort Napoleoński jest dziś jednym z najbardziej charakterystycznych zabytkowych budynków Portonovo.',
              itLong:'<p>Fu realizzato durante il Regno d\'Italia napoleonico per controllare la costa e contrastare eventuali sbarchi nemici.</p><p>La struttura, perfettamente integrata nel paesaggio, ha cambiato più volte destinazione nel corso dei secoli fino a essere trasformata nell\'attuale struttura ricettiva.</p><p>Passeggiando nei suoi dintorni si percepisce chiaramente il valore strategico che questa baia aveva per il controllo dell\'Adriatico.</p>',
              enLong:'<p>It was built during the Napoleonic Kingdom of Italy to control the coast and repel potential enemy landings.</p><p>Perfectly integrated into the landscape, the structure has changed use several times over the centuries, eventually becoming today\'s hospitality venue.</p><p>Walking around it, you can clearly sense the strategic value this bay once held for controlling the Adriatic.</p>',
              deLong:'<p>Es entstand im napoleonischen Königreich Italien zur Küstenüberwachung.</p><p>Perfekt in die Landschaft integriert, wechselte das Gebäude im Laufe der Jahrhunderte mehrfach seine Funktion, bis es zur heutigen Unterkunft wurde.</p>',
              plLong:'<p>Powstał za czasów napoleońskiego Królestwa Włoch, by kontrolować wybrzeże.</p><p>Doskonale wtopiona w krajobraz budowla wielokrotnie zmieniała przeznaczenie na przestrzeni wieków, aż stała się dzisiejszym obiektem noclegowym.</p>',
              deLong:'<p>Perfekt in die Landschaft integriert, wechselte das Gebäude im Laufe der Jahrhunderte mehrfach seine Funktion, bis es zur heutigen Unterkunft wurde.</p>',
              plLong:'<p>Doskonale wtopiona w krajobraz budowla wielokrotnie zmieniała przeznaczenie na przestrzeni wieków, aż stała się dzisiejszym obiektem noclegowym.</p>',
              itTime:'10–15 minuti (esterno).',enTime:'10–15 minutes (exterior).',deTime:'10–15 Minuten (außen).',plTime:'10–15 minut (zewnątrz).',
              dist:'🚌 12 km – 25 min', mapQuery:'Fortino Napoleonico Portonovo', lat:43.5655625, lng:13.5923125 },
            { order:4, name:'Lago Grande di Portonovo', emoji:'🦩', photo:'',
              it:'Uno dei rarissimi laghi costieri salmastri dell\'Adriatico.',
              en:'One of the very few brackish coastal lakes on the Adriatic.',
              de:'Einer der seltenen brackigen Küstenseen der Adria.',
              pl:'Jedno z bardzo nielicznych słonawych jezior przybrzeżnych na Adriatyku.',
              itLong:'<p>Separato dal mare da una sottile striscia di terra, ospita un ecosistema di grande valore naturalistico. Le sue acque, alimentate sia da sorgenti sia dal mare, sono un habitat ideale per numerose specie di uccelli acquatici.</p><p>Passeggiando lungo il sentiero che costeggia il lago è possibile osservare aironi, folaghe e altre specie migratorie che sostano durante l\'anno.</p><p>Questo piccolo angolo di natura rappresenta uno degli aspetti meno conosciuti ma più interessanti della baia di Portonovo.</p>',
              enLong:'<p>Separated from the sea by a thin strip of land, it hosts an ecosystem of great naturalistic value. Fed by both springs and the sea, its waters are an ideal habitat for numerous species of waterbirds.</p><p>Walking along the path skirting the lake, you can spot herons, coots and other migratory species that stop here throughout the year.</p><p>This small corner of nature is one of the lesser-known yet most interesting aspects of the Portonovo bay.</p>',
              deLong:'<p>Durch einen schmalen Landstreifen vom Meer getrennt, mit einem wertvollen Ökosystem. Ideales Habitat für zahlreiche Wasservogelarten.</p><p>Entlang des Seeuferwegs lassen sich Reiher, Blässhühner und andere Zugvögel beobachten.</p>',
              plLong:'<p>Oddzielone od morza wąskim pasem lądu, z cennym ekosystemem. Idealny habitat dla licznych gatunków ptaków wodnych.</p><p>Spacerując ścieżką wzdłuż jeziora, można zaobserwować czaple, łyski i inne gatunki wędrowne.</p>',
              deLong:'<p>Entlang des Seeuferwegs lassen sich Reiher, Blässhühner und andere Zugvögel beobachten. Eine der weniger bekannten, aber interessantesten Facetten der Bucht von Portonovo.</p>',
              plLong:'<p>Spacerując ścieżką wzdłuż jeziora, można zaobserwować czaple, łyski i inne gatunki wędrowne. To mało znany, lecz bardzo interesujący zakątek zatoki Portonovo.</p>',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Lago Grande Portonovo', lat:43.5629375, lng:13.5911875 },
            { order:5, name:'Lago Profondo di Portonovo', emoji:'🌿', photo:'',
              it:'Più piccolo e meno conosciuto del vicino Lago Grande, il Lago Profondo è un prezioso ambiente naturale immerso nella vegetazione della baia di Portonovo.',
              en:'Smaller and less known than the nearby Lago Grande, the Lago Profondo is a precious natural environment set within the vegetation of the Portonovo bay.',
              de:'Kleiner und weniger bekannt als der nahegelegene Lago Grande, ist der Lago Profondo eine wertvolle Naturlandschaft inmitten der Vegetation der Bucht von Portonovo.',
              pl:'Mniejsze i mniej znane niż pobliskie Lago Grande, Lago Profondo to cenne środowisko naturalne pośród roślinności zatoki Portonovo.',
              itLong:'<p>La sua tranquillità lo rende uno dei luoghi più suggestivi per gli amanti della natura. Si è formato grazie all\'incontro tra acque dolci di falda e infiltrazioni marine, creando un ecosistema delicato e ricco di biodiversità. Pur essendo meno accessibile rispetto al Lago Grande, rappresenta un\'importante area naturalistica protetta.</p><p>L\'ambiente circostante ospita canneti, vegetazione mediterranea e numerose specie di uccelli, insetti e anfibi. Qui dominano il silenzio e i suoni della natura.</p>',
              enLong:'<p>Its tranquillity makes it one of the most evocative spots for nature lovers. It formed where fresh groundwater meets sea infiltration, creating a delicate ecosystem rich in biodiversity. Though less accessible than the Lago Grande, it is an important protected natural area.</p><p>The surrounding environment hosts reed beds, Mediterranean vegetation and numerous species of birds, insects and amphibians, where silence and the sounds of nature prevail.</p>',
              deLong:'<p>Seine Ruhe macht ihn zu einem der eindrucksvollsten Orte für Naturliebhaber. Er entstand durch das Zusammentreffen von Grundwasser und Meerwasser-Infiltration und bildet ein empfindliches, artenreiches Ökosystem. Obwohl er weniger zugänglich ist als der Lago Grande, stellt er ein wichtiges Naturschutzgebiet dar.</p><p>Schilf, mediterrane Vegetation und zahlreiche Vogel-, Insekten- und Amphibienarten prägen die Umgebung. Hier herrschen Stille und die Klänge der Natur.</p>',
              plLong:'<p>Jego spokój czyni go jednym z najbardziej sugestywnych miejsc dla miłośników przyrody. Powstał dzięki spotkaniu wód gruntowych z infiltracją morską, tworząc delikatny i bogaty w bioróżnorodność ekosystem. Choć jest mniej dostępny niż pobliskie Lago Grande, stanowi ważny chroniony obszar przyrodniczy.</p><p>Trzcinowiska, roślinność śródziemnomorska oraz liczne gatunki ptaków, owadów i płazów tworzą otoczenie. Panują tu cisza i dźwięki natury.</p>',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚌 12 km – 25 min', mapQuery:'Lago Profondo Portonovo', lat:43.5605625, lng:13.5999375 },
            { order:6, name:'Belvedere di Portonovo', emoji:'🌅', photo:'',
              it:'Il Belvedere di Portonovo regala una delle viste più spettacolari della Riviera del Conero. Da qui lo sguardo abbraccia l\'intera baia, il mare Adriatico e le alte falesie che caratterizzano questo tratto di costa.',
              en:'The Belvedere di Portonovo offers one of the most spectacular views on the Riviera del Conero. From here the eye takes in the whole bay, the Adriatic Sea and the high cliffs that characterise this stretch of coast.',
              de:'Der Belvedere di Portonovo bietet einen der spektakulärsten Ausblicke der Riviera del Conero. Von hier aus überblickt man die gesamte Bucht, die Adria und die hohen Klippen, die diesen Küstenabschnitt prägen.',
              pl:'Belvedere di Portonovo oferuje jeden z najbardziej spektakularnych widoków Riwiery Conero. Stąd wzrok obejmuje całą zatokę, Morze Adriatyckie i wysokie klify charakteryzujące ten odcinek wybrzeża.',
              itLong:'<p>Situato lungo la strada panoramica che scende verso Portonovo, il belvedere è una tappa quasi obbligata per chi visita la zona.</p><p>Dall\'alto si distinguono perfettamente la Chiesa di Santa Maria, il Fortino Napoleonico, la Torre De Bosis, i due laghi costieri e la lunga spiaggia di ciottoli che si sviluppa ai piedi del Monte Conero.</p>',
              enLong:'<p>Located along the scenic road that descends towards Portonovo, the belvedere is an almost obligatory stop for anyone visiting the area.</p><p>From above you can clearly make out the Church of Santa Maria, the Napoleonic Fort, the Torre De Bosis, the two coastal lakes and the long pebble beach that stretches at the foot of Monte Conero.</p>',
              deLong:'<p>Der an der Panoramastraße nach Portonovo gelegene Aussichtspunkt ist ein fast obligatorischer Halt für alle, die das Gebiet besuchen.</p><p>Von oben erkennt man deutlich die Kirche Santa Maria, das Napoleonische Fort, den Torre De Bosis, die beiden Küstenseen und den langen Kiesstrand am Fuße des Monte Conero.</p>',
              plLong:'<p>Położony przy panoramicznej drodze schodzącej do Portonovo punkt widokowy to niemal obowiązkowy przystanek dla każdego odwiedzającego okolicę.</p><p>Z góry doskonale widać kościół Santa Maria, Fort Napoleoński, Torre De Bosis, dwa przybrzeżne jeziora oraz długą kamienistą plażę rozciągającą się u podnóża Monte Conero.</p>',
              dist:'🚌 12 km – 25 min', mapQuery:'Belvedere di Portonovo', lat:43.5632479, lng:13.5839845 },

            { order:7, name:'Punto panoramico', emoji:'🌄', photo:'',
              it:'Obbligatorio fermarsi per ammirare dall\'alto il panorama sulla spettacolare spiaggia di Mezzavalle e la caratteristica scogliera naturale del Trave che sembra un molo in mezzo al mare.',
              en:'A must-stop to admire from above the panorama over the spectacular Mezzavalle beach and the distinctive natural Trave reef, which looks like a pier in the middle of the sea.',
              de:'Ein Pflichthalt, um von oben das Panorama über den spektakulären Strand von Mezzavalle und das charakteristische natürliche Riff Trave zu bewundern, das wie ein Pier mitten im Meer aussieht.',
              pl:'Obowiązkowy przystanek, by podziwiać z góry panoramę na spektakularną plażę Mezzavalle i charakterystyczną naturalną rafę Trave, która wygląda jak molo pośrodku morza.',
              dist:'🚌 12 km – 25 min', mapQuery:'43.5642544,13.5793158', lat:43.5642544, lng:13.5793158 }
        ],

        conero: {
            intro: {
                it:'Il Monte Conero è il simbolo della Riviera del Conero e l\'unico promontorio dell\'Adriatico che si innalza a picco sul mare, raggiungendo i 572 metri di altitudine. Ricoperto da una rigogliosa macchia mediterranea, offre panorami spettacolari, sentieri immersi nel verde e scorci che spaziano dalle falesie bianche alle acque cristalline. Dal Belvedere Nord e dal Belvedere Sud si godono alcune delle viste più suggestive delle Marche, mentre i numerosi percorsi escursionistici conducono a luoghi iconici come il Passo del Lupo, l\'Abbazia di San Pietro al Conero e le spiagge più selvagge della costa. Un luogo dove natura, storia e paesaggio si incontrano in un equilibrio unico.',
                en:'Monte Conero is the symbol of the Riviera del Conero, the only Adriatic headland that rises straight from the sea, reaching 572 metres in altitude. Covered in lush Mediterranean scrub, it offers spectacular panoramas, trails immersed in greenery and views ranging from white cliffs to crystal-clear waters. From the Belvedere Nord and Belvedere Sud you can enjoy some of the most striking views in the Marche, while the many hiking trails lead to iconic spots such as the Passo del Lupo, the Abbey of San Pietro al Conero and the wildest beaches on the coast. A place where nature, history and landscape meet in a unique balance.',
                de:'Der Monte Conero ist das Symbol der Riviera del Conero und das einzige Vorgebirge der Adria, das steil aus dem Meer aufragt und eine Höhe von 572 Metern erreicht. Bedeckt von üppiger mediterraner Macchia bietet er spektakuläre Panoramen, grüne Wanderwege und Ausblicke von weißen Klippen bis zu kristallklarem Wasser. Vom Belvedere Nord und Belvedere Sud aus genießt man einige der eindrucksvollsten Ausblicke der Marken, während die zahlreichen Wanderwege zu ikonischen Orten wie dem Passo del Lupo, der Abtei San Pietro al Conero und den wildesten Stränden der Küste führen. Ein Ort, an dem Natur, Geschichte und Landschaft in einzigartigem Gleichgewicht aufeinandertreffen.',
                pl:'Monte Conero to symbol Riviera del Conero i jedyny cypel na Adriatyku, który wznosi się stromo prosto z morza, osiągając wysokość 572 metrów. Pokryty bujnymi śródziemnomorskimi zaroślami, oferuje spektakularne panoramy, szlaki zanurzone w zieleni i widoki sięgające od białych klifów po krystalicznie czystą wodę. Z Belvedere Nord i Belvedere Sud można podziwiać jedne z najbardziej urzekających widoków Marchii, a liczne szlaki turystyczne prowadzą do kultowych miejsc, takich jak Passo del Lupo, Opactwo San Pietro al Conero i najbardziej dzikie plaże wybrzeża. Miejsce, w którym natura, historia i krajobraz spotykają się w wyjątkowej równowadze.'
            },
            links: [
                { icon:'🌐', url:'https://connect.anconatourism.it/monte-conero/', it:'Portale ufficiale Monte Conero', en:'Official Monte Conero portal', de:'Offizielles Monte-Conero-Portal', pl:'Oficjalny portal Monte Conero' },
                { icon:'🥾', url:'https://www.parcodelconero.org/sentieri/', it:'Sentieri del Parco del Conero', en:'Parco del Conero trails', de:'Wanderwege des Parco del Conero', pl:'Szlaki Parku Conero' }
            ],
            points: [
                { order:1, name:'Belvedere Nord', emoji:'🌄', photo:'',
                  it:'Uno dei punti panoramici più belli del Monte Conero, dal quale si apre una vista ampia sulla costa e sul mare Adriatico.',
                  en:'One of the most beautiful viewpoints on Monte Conero, offering a wide view over the coast and the Adriatic Sea.',
                  de:'Einer der schönsten Aussichtspunkte des Monte Conero mit einem weiten Blick auf die Küste und die Adria.',
                  pl:'Jeden z najpiękniejszych punktów widokowych Monte Conero, z rozległym widokiem na wybrzeże i Morze Adriatyckie.',
                  itLong:'<p>Immerso nella vegetazione, permette di osservare il paesaggio da una prospettiva diversa rispetto al versante meridionale. Un luogo tranquillo, ideale per una breve sosta durante la passeggiata.</p>',
                  enLong:'<p>Surrounded by vegetation, it offers a different perspective on the landscape compared to the southern side. A peaceful spot, ideal for a short stop during the walk.</p>',
                  deLong:'<p>Umgeben von Vegetation bietet er eine andere Perspektive auf die Landschaft als die Südseite. Ein ruhiger Ort, ideal für eine kurze Rast während des Spaziergangs.</p>',
                  plLong:'<p>Otoczony roślinnością oferuje inną perspektywę krajobrazu niż strona południowa. Spokojne miejsce, idealne na krótki postój podczas spaceru.</p>',
                  dist:'🥾 Solo sentiero (nessun accesso auto)', mapQuery:'Belvedere Nord Monte Conero', lat:43.5530467, lng:13.6024867 },

                { order:2, name:'Pian Grande', emoji:'🌳', photo:'',
                  it:'Una delle zone più panoramiche del Monte Conero, immersa nel bosco e affacciata verso Portonovo.',
                  en:'One of the most panoramic areas of Monte Conero, immersed in woodland and facing Portonovo.',
                  de:'Eines der aussichtsreichsten Gebiete des Monte Conero, mitten im Wald gelegen und Portonovo zugewandt.',
                  pl:'Jeden z najbardziej widokowych obszarów Monte Conero, zanurzony w lesie i zwrócony w stronę Portonovo.',
                  itLong:'<p>Il pianoro è attraversato da diversi sentieri e offre scorci suggestivi sulla costa e sul paesaggio circostante. È un ottimo punto di partenza per esplorare la parte più verde e selvaggia del promontorio.</p>',
                  enLong:'<p>The plateau is crossed by several trails and offers evocative views over the coast and surrounding landscape. It is an excellent starting point for exploring the greenest and wildest part of the headland.</p>',
                  deLong:'<p>Die Hochebene wird von mehreren Wegen durchzogen und bietet eindrucksvolle Ausblicke auf die Küste und die umliegende Landschaft. Ein hervorragender Ausgangspunkt, um den grünsten und wildesten Teil des Vorgebirges zu erkunden.</p>',
                  plLong:'<p>Płaskowyż przecinają liczne szlaki, oferujące sugestywne widoki na wybrzeże i okoliczny krajobraz. To doskonały punkt wyjścia do odkrywania najbardziej zielonej i dzikiej części cypla.</p>',
                  dist:'🥾 Solo sentiero (nessun accesso auto)', mapQuery:'Pian Grande Monte Conero', lat:43.5554862, lng:13.5944683 },

                { order:3, name:'Grotte Romane', emoji:'🏺', photo:'',
                  it:'Un sistema di antiche cavità e cunicoli scavati nella roccia del Monte Conero, legati all\'antica presenza e attività umana sul promontorio.',
                  en:'A system of ancient cavities and tunnels carved into the rock of Monte Conero, linked to the ancient human presence and activity on the headland.',
                  de:'Ein System aus antiken Hohlräumen und Stollen, die in den Fels des Monte Conero gehauen wurden und mit der antiken menschlichen Präsenz und Aktivität auf dem Vorgebirge zusammenhängen.',
                  pl:'System starożytnych jaskiń i tuneli wykutych w skale Monte Conero, związanych z dawną obecnością i działalnością człowieka na tym cyplu.',
                  itLong:'<p>Si raggiungono attraverso i sentieri del monte e rappresentano una testimonianza curiosa della sua storia. Una tappa particolare per chi vuole scoprire il Conero anche attraverso i suoi luoghi meno conosciuti.</p>',
                  enLong:'<p>They are reached via the mountain\'s trails and represent a curious testimony to its history. A distinctive stop for those wanting to discover the Conero through its lesser-known spots as well.</p>',
                  deLong:'<p>Sie sind über die Wanderwege des Berges erreichbar und stellen ein kurioses Zeugnis seiner Geschichte dar. Eine besondere Station für alle, die den Conero auch durch seine weniger bekannten Orte entdecken möchten.</p>',
                  plLong:'<p>Dociera się do nich szlakami górskimi i stanowią ciekawe świadectwo jego historii. Wyjątkowy przystanek dla tych, którzy chcą odkryć Conero również poprzez mniej znane miejsca.</p>',
                  dist:'🥾 Solo sentiero (nessun accesso auto)', mapQuery:'Grotte Romane Monte Conero', lat:43.5474213, lng:13.5961695 },

                { order:4, name:'Badia di San Pietro al Conero', emoji:'⛪', photo:'',
                  it:'Antica abbazia benedettina costruita sulla sommità del Monte Conero, in una posizione spettacolare tra bosco e mare.',
                  en:'An ancient Benedictine abbey built on the summit of Monte Conero, in a spectacular position between woodland and sea.',
                  de:'Antike Benediktinerabtei auf dem Gipfel des Monte Conero, in spektakulärer Lage zwischen Wald und Meer.',
                  pl:'Starożytne opactwo benedyktyńskie zbudowane na szczycie Monte Conero, w spektakularnym miejscu między lasem a morzem.',
                  itLong:'<p>La chiesa romanica, semplice e suggestiva, conserva l\'atmosfera raccolta dell\'antico monastero. Nei pressi si trovano un albergo, un ristorante, un punto di ristoro e un parcheggio. Da qui partono diversi sentieri e si aprono splendidi panorami sulla Riviera del Conero.</p>',
                  enLong:'<p>The simple, evocative Romanesque church preserves the intimate atmosphere of the ancient monastery. Nearby are a hotel, a restaurant, a refreshment point and a car park. Several trails start from here, opening onto splendid views of the Riviera del Conero.</p>',
                  deLong:'<p>Die schlichte, eindrucksvolle romanische Kirche bewahrt die stille Atmosphäre des antiken Klosters. In der Nähe befinden sich ein Hotel, ein Restaurant, ein Rastplatz und ein Parkplatz. Von hier aus führen mehrere Wanderwege zu herrlichen Ausblicken auf die Riviera del Conero.</p>',
                  plLong:'<p>Prosty, sugestywny romański kościół zachowuje kameralną atmosferę dawnego klasztoru. W pobliżu znajdują się hotel, restauracja, punkt odpoczynku i parking. Stąd wyrusza kilka szlaków prowadzących do wspaniałych panoram Riviera del Conero.</p>',
                  dist:'🚗 ~20 km – 30 min (stima, verificare in loco)', mapQuery:'Badia di San Pietro al Conero', lat:43.5472801, lng:13.6162096 },

                { order:5, name:'Belvedere Sud', emoji:'🌅', photo:'',
                  it:'Un punto panoramico immerso nella natura, affacciato sulle falesie e sul mare della Riviera del Conero.',
                  en:'A panoramic viewpoint immersed in nature, facing the cliffs and the sea of the Riviera del Conero.',
                  de:'Ein in die Natur eingebetteter Aussichtspunkt mit Blick auf die Klippen und das Meer der Riviera del Conero.',
                  pl:'Punkt widokowy zanurzony w naturze, z widokiem na klify i morze Riviera del Conero.',
                  itLong:'<p>La vista permette di ammirare uno dei paesaggi più caratteristici del promontorio, con la costa che si apre verso l\'Adriatico. Nelle giornate limpide è uno dei luoghi più suggestivi per fermarsi a osservare il panorama.</p>',
                  enLong:'<p>The view lets you admire one of the headland\'s most characteristic landscapes, with the coast opening towards the Adriatic. On clear days it is one of the most evocative spots to stop and take in the panorama.</p>',
                  deLong:'<p>Der Blick lässt eine der charakteristischsten Landschaften des Vorgebirges bewundern, mit der Küste, die sich zur Adria hin öffnet. An klaren Tagen ist dies einer der eindrucksvollsten Orte, um innezuhalten und das Panorama zu genießen.</p>',
                  plLong:'<p>Widok pozwala podziwiać jeden z najbardziej charakterystycznych krajobrazów cypla, z wybrzeżem otwierającym się ku Adriatykowi. W pogodne dni to jedno z najbardziej sugestywnych miejsc na przystanek podziwiania panoramy.</p>',
                  dist:'🥾 Solo sentiero (nessun accesso auto)', mapQuery:'Belvedere Sud Monte Conero', lat:43.5438339, lng:13.6229862 },

                { order:6, name:'Grotta del Mortarolo', emoji:'🕳️', photo:'',
                  it:'Una piccola cavità naturale nascosta tra la vegetazione del Monte Conero, lungo uno dei percorsi del promontorio.',
                  en:'A small natural cavity hidden among the vegetation of Monte Conero, along one of the headland\'s trails.',
                  de:'Eine kleine natürliche Höhle, verborgen in der Vegetation des Monte Conero, entlang eines der Wege des Vorgebirges.',
                  pl:'Mała naturalna jaskinia ukryta wśród roślinności Monte Conero, wzdłuż jednego ze szlaków cypla.',
                  itLong:'<p>Il sentiero attraversa il bosco e conduce in un ambiente appartato, dove la natura è ancora protagonista. Una tappa particolare per chi ama camminare e scoprire gli angoli meno conosciuti del Conero.</p>',
                  enLong:'<p>The trail crosses the woodland and leads to a secluded setting, where nature still takes centre stage. A distinctive stop for those who love walking and discovering the lesser-known corners of the Conero.</p>',
                  deLong:'<p>Der Pfad durchquert den Wald und führt zu einem abgelegenen Ort, an dem die Natur noch die Hauptrolle spielt. Eine besondere Station für alle, die gerne wandern und die weniger bekannten Winkel des Conero entdecken.</p>',
                  plLong:'<p>Szlak przecina las i prowadzi do ustronnego miejsca, gdzie natura wciąż odgrywa główną rolę. Wyjątkowy przystanek dla tych, którzy uwielbiają spacerować i odkrywać mniej znane zakątki Conero.</p>',
                  dist:'🥾 Solo sentiero (nessun accesso auto)', mapQuery:'Grotta del Mortarolo Monte Conero', lat:43.5420977, lng:13.6224953 },

                { order:7, name:'Passo del Lupo', emoji:'🐺', photo:'',
                  it:'Uno dei punti panoramici più spettacolari del Monte Conero, affacciato sulle falesie e sul mare della Riviera. ⚠️ Attualmente il transito è vietato.',
                  en:'One of the most spectacular viewpoints on Monte Conero, facing the cliffs and the sea of the Riviera. ⚠️ The trail is currently closed to transit.',
                  de:'Einer der spektakulärsten Aussichtspunkte des Monte Conero mit Blick auf die Klippen und das Meer der Riviera. ⚠️ Der Durchgang ist derzeit gesperrt.',
                  pl:'Jeden z najbardziej spektakularnych punktów widokowych Monte Conero, z widokiem na klify i morze Riviery. ⚠️ Przejście jest obecnie zabronione.',
                  itLong:'<p>Da qui si gode una vista straordinaria sulla Spiaggia delle Due Sorelle e sulla costa. Il percorso richiede attenzione e non è adatto a tutti.</p><p><b>⚠️ Attenzione:</b> attualmente il transito è vietato. Verificate la situazione presso il Parco del Conero prima di incamminarvi.</p>',
                  enLong:'<p>From here you can enjoy an extraordinary view over the Due Sorelle beach and the coast. The path requires care and is not suitable for everyone.</p><p><b>⚠️ Warning:</b> the trail is currently closed to transit. Check the current situation with the Parco del Conero before setting off.</p>',
                  deLong:'<p>Von hier aus genießt man einen außergewöhnlichen Blick auf den Strand Due Sorelle und die Küste. Der Weg erfordert Aufmerksamkeit und ist nicht für alle geeignet.</p><p><b>⚠️ Achtung:</b> Der Durchgang ist derzeit gesperrt. Informieren Sie sich vor dem Aufbruch beim Parco del Conero über die aktuelle Lage.</p>',
                  plLong:'<p>Stąd roztacza się niezwykły widok na plażę Due Sorelle i wybrzeże. Trasa wymaga uwagi i nie jest odpowiednia dla wszystkich.</p><p><b>⚠️ Uwaga:</b> przejście jest obecnie zabronione. Przed wyruszeniem sprawdźcie aktualną sytuację w Parco del Conero.</p>',
                  dist:'🥾 Solo sentiero – 🚫 Transito attualmente vietato', mapQuery:'Passo del Lupo Monte Conero', lat:43.5423310, lng:13.6261572 }
            ]
        },

        borghi: [
            { name:'Senigallia', emoji:'🏖️', photo:'',
              it:'Famosa per la sua "Spiaggia di Velluto", Senigallia unisce mare, cultura e gastronomia. Il centro storico conserva monumenti come la Rocca Roveresca, la Rotonda a Mare e i Portici Ercolani, mentre il lungomare invita a rilassanti passeggiate. In estate la città si anima con eventi internazionali come il Summer Jamboree. Si raggiunge da Ancona in circa 30 minuti.',
              en:'Famous for its "Velvet Beach", Senigallia combines sea, culture and gastronomy. The historic centre preserves monuments such as the Rocca Roveresca, the Rotonda a Mare and the Portici Ercolani, while the seafront invites relaxing walks. In summer the town comes alive with international events such as the Summer Jamboree. It is reached from Ancona in about 30 minutes.',
              de:'Berühmt für ihren "Samtstrand", verbindet Senigallia Meer, Kultur und Gastronomie. Das historische Zentrum bewahrt Monumente wie die Rocca Roveresca, die Rotonda a Mare und die Portici Ercolani, während die Uferpromenade zu entspannten Spaziergängen einlädt. Im Sommer belebt sich die Stadt mit internationalen Veranstaltungen wie dem Summer Jamboree. Von Ancona aus in etwa 30 Minuten erreichbar.',
              pl:'Słynąca ze swojej "Aksamitnej Plaży", Senigallia łączy morze, kulturę i gastronomię. Historyczne centrum zachowuje zabytki takie jak Rocca Roveresca, Rotonda a Mare i Portici Ercolani, a nadmorska promenada zaprasza na relaksujące spacery. Latem miasto ożywa dzięki międzynarodowym wydarzeniom, takim jak Summer Jamboree. Dojazd z Ankony zajmuje około 30 minut.',
              itTime:'Mezza giornata – giornata intera.',enTime:'Half day – full day.',deTime:'Halber – ganzer Tag.',plTime:'Pół – cały dzień.',
              dist:'🚗 30 km – 30 min', mapQuery:'Senigallia', lat:43.7163, lng:13.2088 },
            { name:'Jesi', emoji:'🏛️', photo:'',
              it:'Città elegante circondata da possenti mura medievali, Jesi è il luogo di nascita dell\'imperatore Federico II. Passeggiando nel centro storico si incontrano piazze, palazzi rinascimentali e il celebre Teatro Pergolesi. È anche il cuore della produzione del Verdicchio dei Castelli di Jesi, uno dei vini bianchi più apprezzati d\'Italia. Dista circa 35 minuti da Ancona ed è perfetta per una gita tra arte, storia e sapori autentici.',
              en:'An elegant city surrounded by mighty medieval walls, Jesi is the birthplace of Emperor Frederick II. Strolling through the historic centre you\'ll find squares, Renaissance palaces and the famous Teatro Pergolesi. It is also the heart of Verdicchio dei Castelli di Jesi production, one of Italy\'s most appreciated white wines. It is about 35 minutes from Ancona and perfect for a day trip combining art, history and authentic flavours.',
              de:'Eine elegante Stadt, umgeben von mächtigen mittelalterlichen Mauern, ist Jesi der Geburtsort von Kaiser Friedrich II. Beim Spaziergang durch das historische Zentrum begegnet man Plätzen, Renaissance-Palästen und dem berühmten Teatro Pergolesi. Es ist auch das Herz der Verdicchio dei Castelli di Jesi-Produktion, einem der beliebtesten Weißweine Italiens. Etwa 35 Minuten von Ancona entfernt, perfekt für einen Ausflug zwischen Kunst, Geschichte und authentischen Aromen.',
              pl:'Eleganckie miasto otoczone potężnymi średniowiecznymi murami, Jesi to miejsce narodzin cesarza Fryderyka II. Spacerując po historycznym centrum, można spotkać place, renesansowe pałace i słynny Teatro Pergolesi. To także serce produkcji Verdicchio dei Castelli di Jesi, jednego z najbardziej cenionych białych win Włoch. Znajduje się około 35 minut od Ankony i jest idealne na wycieczkę łączącą sztukę, historię i autentyczne smaki.',
              itTime:'2–3 ore.',enTime:'2–3 hours.',deTime:'2–3 Stunden.',plTime:'2–3 godziny.',
              dist:'🚗 30 km – 35 min', mapQuery:'Jesi AN', lat:43.52048, lng:13.23773 },
            { name:'Sirolo', emoji:'🏘️', photo:'sirolo.jpg',
              it:'Arroccato su un balcone naturale affacciato sul mare, Sirolo è uno dei borghi più belli delle Marche. Vicoli fioriti, piazze panoramiche e scorci sul Conero lo rendono una meta imperdibile. Di origine medievale, conserva ancora oggi il fascino di un piccolo borgo fortificato.',
              en:'Perched on a natural balcony overlooking the sea, Sirolo is one of the most beautiful villages in the Marche. Flower-lined alleys, panoramic squares and Conero views make it an unmissable destination. Of medieval origin, it still retains the charm of a small fortified village.',
              de:'Auf einem natürlichen Balkon über dem Meer thronend, ist Sirolo eines der schönsten Dörfer der Marken. Mittelalterlichen Ursprungs, mit dem Charme eines kleinen befestigten Dorfes, blühenden Gassen und Panoramaplätzen.',
              pl:'Wznoszący się na naturalnym balkonie nad morzem, Sirolo to jedna z najpiękniejszych miejscowości Marchii. Średniowiecznego pochodzenia, wciąż zachowuje urok małej ufortyfikowanej wioski, z kwiecistymi uliczkami i panoramicznymi placami.',
              itLong:'<p>Passeggiando tra le strette vie del centro si incontrano botteghe artigiane, ristoranti, caffè e terrazze panoramiche che si aprono sul mare. La celebre Piazza Vittorio Veneto è il cuore del paese e offre una vista straordinaria sulla costa del Conero. Da qui si comprende perfettamente perché Sirolo sia considerato uno dei luoghi più suggestivi dell\'Adriatico.</p><p>Durante l\'estate il borgo si anima con concerti, mercatini e manifestazioni culturali che ne rendono ancora più piacevole la visita.</p>',
              enLong:'<p>Strolling through the narrow streets of the centre you\'ll find craft workshops, restaurants, cafés and panoramic terraces opening onto the sea. The famous Piazza Vittorio Veneto is the heart of the village, offering an extraordinary view over the Conero coast. From here it is easy to understand why Sirolo is considered one of the most striking places on the Adriatic.</p><p>In summer the village comes alive with concerts, markets and cultural events that make a visit even more enjoyable.</p>',
              deLong:'<p>Beim Spaziergang durch die engen Gassen des Zentrums begegnet man Handwerksläden, Restaurants, Cafés und Panoramaterrassen, die sich zum Meer hin öffnen. Die berühmte Piazza Vittorio Veneto ist das Herz des Ortes und bietet einen außergewöhnlichen Blick auf die Küste des Conero. Von hier aus versteht man sofort, warum Sirolo als einer der eindrucksvollsten Orte der Adria gilt.</p><p>Im Sommer belebt sich der Ort mit Konzerten, Märkten und kulturellen Veranstaltungen, die einen Besuch noch angenehmer machen.</p>',
              plLong:'<p>Spacerując wąskimi uliczkami centrum, można natrafić na warsztaty rzemieślnicze, restauracje, kawiarnie i panoramiczne tarasy otwierające się na morze. Słynny Piazza Vittorio Veneto jest sercem miejscowości i oferuje niezwykły widok na wybrzeże Conero. Stąd doskonale rozumie się, dlaczego Sirolo uważane jest za jedno z najbardziej sugestywnych miejsc Adriatyku.</p><p>Latem miejscowość ożywa dzięki koncertom, targom i wydarzeniom kulturalnym, które sprawiają, że wizyta jest jeszcze przyjemniejsza.</p>',
              itNote:'La terrazza di Piazza Vittorio Veneto: uno dei punti di vista più belli dell\'Adriatico.',
              enNote:'The Piazza Vittorio Veneto terrace: one of the finest viewpoints on the Adriatic.',
              deNote:'Terrasse der Piazza: einer der schönsten Adriaausblicke.',
              plNote:'Taras Piazza: jeden z najpiękniejszych widoków Adriatyku.',
              itPhoto:'Dal belvedere con il mare e le falesie sullo sfondo.',
              enPhoto:'From the belvedere with sea and cliffs behind.',
              dePhoto:'Vom Belvedere mit Meer und Klippen.',
              plPhoto:'Z belwederu z morzem i klifami.',
              itTime:'1–2 ore.',enTime:'1–2 hours.',deTime:'1–2 Stunden.',plTime:'1–2 godziny.',
              dist:'🚗 22 km – 30 min', mapQuery:'Sirolo AN', lat:43.518188, lng:13.620688 },
            { name:'Offagna', emoji:'🏰', photo:'offagna.jpg',
              it:'Inserito tra i Borghi più belli d\'Italia, Offagna è dominato da una splendida rocca medievale che ancora oggi caratterizza il profilo del paese. Il simbolo del borgo è la Rocca di Offagna, costruita nel XV secolo per controllare il territorio circostante. Le sue mura e le torri raccontano un passato fatto di battaglie, difesa e vita medievale.',
              en:'Listed among Italy\'s most beautiful villages, Offagna is dominated by a splendid medieval fortress that still shapes the village\'s skyline today. The symbol of the village is the Rocca di Offagna, built in the 15th century to control the surrounding territory. Its walls and towers tell of a past made of battles, defence and medieval life.',
              de:'Eines der schönsten Dörfer Italiens, Offagna wird von einer prächtigen mittelalterlichen Festung dominiert, die noch heute das Ortsbild prägt. Das Symbol des Dorfes ist die Rocca di Offagna aus dem 15. Jahrhundert, deren Mauern und Türme von Kämpfen und mittelalterlichem Leben erzählen.',
              pl:'Wpisane na listę najpiękniejszych miasteczek Włoch, Offagna zdominowane jest przez wspaniałą średniowieczną fortecę, która do dziś kształtuje sylwetkę miasteczka. Symbolem miasteczka jest Rocca di Offagna z XV wieku, której mury i wieże opowiadają o przeszłości pełnej bitew i średniowiecznego życia.',
              itLong:'<p>Passeggiando nel centro storico si incontrano antiche abitazioni in pietra, piccole piazze e scorci che sembrano rimasti immutati nel tempo. Ogni estate il paese ospita celebri rievocazioni storiche che trasformano le sue strade in un autentico villaggio medievale.</p>',
              enLong:'<p>Strolling through the historic centre you\'ll find ancient stone houses, small squares and views that seem to have remained unchanged over time. Every summer the village hosts famous historical re-enactments that transform its streets into an authentic medieval village.</p>',
              deLong:'<p>Beim Spaziergang durch das historische Zentrum begegnet man alten Steinhäusern, kleinen Plätzen und Ausblicken, die die Zeit überdauert zu haben scheinen. Jeden Sommer finden hier berühmte historische Reenactments statt, die die Straßen des Dorfes in ein authentisches mittelalterliches Dorf verwandeln.</p>',
              plLong:'<p>Spacerując po historycznym centrum, można spotkać stare kamienne domy, małe place i widoki, które wydają się niezmienione od wieków. Każdego lata miasteczko gości słynne rekonstrukcje historyczne, które zamieniają jego ulice w autentyczną średniowieczną wioskę.</p>',
              itNote:'La vista dalla sommità della Rocca sulle colline marchigiane.',
              enNote:'The view from the top of the Rocca over the Marche hills.',
              deNote:'Ausblick von der Festungsspitze.',
              plNote:'Widok ze szczytu Rocca.',
              itTime:'1–2 ore.',enTime:'1–2 hours.',deTime:'1–2 Stunden.',plTime:'1–2 godziny.',
              dist:'🚗 12 km – 18 min', mapQuery:'Offagna Ancona', lat:43.5274876, lng:13.4412360 },
            { name:'Loreto', emoji:'⛪', photo:'loreto.jpg',
              it:'Loreto è una delle principali mete di pellegrinaggio del mondo cattolico. La sua maestosa basilica custodisce la Santa Casa, secondo la tradizione la dimora della Madonna trasportata dalla Terra Santa e, proprio per questo motivo, la Madonna di Loreto nel tempo è diventata la Patrona dell\'Aeronautica Militare Italiana e di tutto il mondo dell\'aviazione.',
              en:'Loreto is one of the main pilgrimage destinations in the Catholic world. Its majestic basilica houses the Holy House, traditionally the home of the Madonna transported from the Holy Land, and for this very reason the Madonna of Loreto over time became the patron saint of the Italian Air Force and of the entire aviation world.',
              de:'Loreto ist eines der wichtigsten Pilgerziele der katholischen Welt. Ihre majestätische Basilika beherbergt das Heilige Haus, überliefert als Wohnstätte der Madonna aus dem Heiligen Land, und genau aus diesem Grund wurde die Madonna von Loreto im Laufe der Zeit zur Schutzpatronin der italienischen Luftwaffe und der gesamten Luftfahrt.',
              pl:'Loreto to jedno z głównych miejsc pielgrzymkowych świata katolickiego. Jej majestatyczna bazylika kryje Świętą Chatę, według tradycji dom Madonny przeniesiony z Ziemi Świętej, i właśnie z tego powodu Madonna z Loreto z czasem stała się patronką włoskiego lotnictwa wojskowego i całego świata lotnictwa.',
              itLong:'<p>La Basilica della Santa Casa rappresenta uno dei più importanti santuari mariani al mondo e accoglie milioni di pellegrini ogni anno. Il complesso monumentale unisce elementi rinascimentali, barocchi e neoclassici, custodendo opere d\'arte di straordinario valore.</p><p>Anche per chi non è interessato agli aspetti religiosi, Loreto offre un patrimonio storico e artistico di assoluto rilievo, oltre a splendide vedute sulla campagna marchigiana e sul mare Adriatico.</p>',
              enLong:'<p>The Basilica of the Holy House is one of the most important Marian shrines in the world and welcomes millions of pilgrims every year. The monumental complex blends Renaissance, Baroque and Neoclassical elements, housing artworks of extraordinary value.</p><p>Even for those uninterested in the religious side, Loreto offers historical and artistic heritage of the highest calibre, along with splendid views over the Marche countryside and the Adriatic Sea.</p>',
              itNote:'Il rivestimento marmoreo della Santa Casa, opera di Bramante e dei principali artisti del Rinascimento. Raggiungibile in treno da Ancona in circa 20 minuti.',
              enNote:'The marble casing of the Holy House, by Bramante and leading Renaissance artists. Reachable by train from Ancona in about 20 minutes.',
              deNote:'Marmorverkleidung von Bramante. Mit dem Zug von Ancona in ca. 20 Minuten erreichbar.',
              plNote:'Marmurowa okładzina dzieła Bramantego. Dostępne pociągiem z Ankony w około 20 minut.',
              itTime:'1–3 ore.',enTime:'1–3 hours.',deTime:'1–3 Stunden.',plTime:'1–3 godziny.',
              dist:'🚗 21 km – 32 min', mapQuery:'Loreto AN', lat:43.4411021, lng:13.6094860 },
            { name:'Recanati', emoji:'📖', photo:'recanati.jpg',
              it:'Città natale di Giacomo Leopardi, Recanati è uno dei luoghi più evocativi delle Marche. Letteratura, arte e paesaggi si fondono in un borgo che conserva intatto il fascino dell\'Ottocento. Passeggiare per Recanati significa entrare nei luoghi che hanno ispirato alcune delle pagine più celebri della letteratura italiana.',
              en:'Birthplace of Giacomo Leopardi, Recanati is one of the most evocative places in the Marche. Literature, art and landscapes blend in a village that keeps the charm of the 19th century intact. Walking through Recanati means stepping into the places that inspired some of the most celebrated pages of Italian literature.',
              de:'Geburtsort von Giacomo Leopardi, Recanati ist einer der eindrucksvollsten Orte der Marken. Literatur, Kunst und Landschaft verschmelzen in einem Dorf, das den Charme des 19. Jahrhunderts bewahrt hat. Ein Spaziergang durch Recanati bedeutet, in die Orte einzutauchen, die einige der berühmtesten Seiten der italienischen Literatur inspiriert haben.',
              pl:'Miasto rodzinne Giacoma Leopardiego, Recanati to jedno z najbardziej sugestywnych miejsc Marchii. Literatura, sztuka i krajobrazy łączą się w miasteczku, które zachowało nienaruszony urok XIX wieku. Spacer po Recanati oznacza wejście w miejsca, które zainspirowały jedne z najsłynniejszych stron literatury włoskiej.',
              itLong:'<p>Qui si trovano il Palazzo Leopardi, la Biblioteca di famiglia, il Colle dell\'Infinito e numerosi luoghi legati alla vita del poeta. Il centro storico conserva eleganti palazzi nobiliari, teatri e piazze che raccontano secoli di storia e cultura.</p><p>Anche chi non conosce approfonditamente Leopardi rimane affascinato dall\'atmosfera unica della città.</p>',
              enLong:'<p>Here you\'ll find Palazzo Leopardi, the family library, the Colle dell\'Infinito and numerous places linked to the poet\'s life. The historic centre preserves elegant noble palaces, theatres and squares that tell centuries of history and culture.</p><p>Even those unfamiliar with Leopardi\'s work are captivated by the town\'s unique atmosphere.</p>',
              itNote:'Il Colle dell\'Infinito al tramonto: uno dei luoghi più poetici d\'Italia.',
              enNote:'The Colle dell\'Infinito at sunset: one of the most poetic places in Italy.',
              deNote:'Colle dell\'Infinito bei Sonnenuntergang: einer der poetischsten Orte.',
              plNote:'Colle dell\'Infinito o zachodzie: jedno z najbardziej poetyckich miejsc.',
              itPhoto:'Dal belvedere vicino all\'Orto sul Colle dell\'Infinito.',
              enPhoto:'From the belvedere near the garden on the Colle dell\'Infinito.',
              dePhoto:'Vom Belvedere am Colle dell\'Infinito.',
              plPhoto:'Z belwederu przy Colle dell\'Infinito.',
              itTime:'2–4 ore.',enTime:'2–4 hours.',deTime:'2–4 Stunden.',plTime:'2–4 godziny.',
              dist:'🚗 25 km – 38 min', mapQuery:'Recanati', lat:43.3980809, lng:13.5518423 },
            { name:'Urbino', emoji:'🎨', photo:'',
              it:'Patrimonio UNESCO e culla del Rinascimento, Urbino è la città natale di Raffaello. Il magnifico Palazzo Ducale domina un centro storico rimasto quasi immutato nei secoli, ricco di chiese, musei e scorci panoramici. Passeggiare tra le sue strade significa immergersi nell\'arte e nella storia. Da Ancona dista circa un\'ora e mezza.',
              en:'A UNESCO World Heritage Site and cradle of the Renaissance, Urbino is the birthplace of Raphael. The magnificent Palazzo Ducale dominates a historic centre that has remained almost unchanged over the centuries, rich in churches, museums and panoramic views. Walking through its streets means immersing yourself in art and history. It is about an hour and a half from Ancona.',
              de:'UNESCO-Weltkulturerbe und Wiege der Renaissance, Urbino ist die Geburtsstadt Raffaels. Der prächtige Palazzo Ducale beherrscht ein historisches Zentrum, das über die Jahrhunderte fast unverändert geblieben ist, reich an Kirchen, Museen und Panoramablicken. Ein Spaziergang durch seine Straßen bedeutet Eintauchen in Kunst und Geschichte. Etwa anderthalb Stunden von Ancona entfernt.',
              pl:'Wpisane na listę UNESCO i kolebka renesansu, Urbino to miasto rodzinne Rafaela. Wspaniały Palazzo Ducale dominuje nad historycznym centrum, które pozostało niemal niezmienione przez wieki, bogatym w kościoły, muzea i panoramiczne widoki. Spacer jego ulicami oznacza zanurzenie się w sztuce i historii. Około półtorej godziny od Ankony.',
              itLong:'<p>Arroccata sulle colline marchigiane, Urbino deve il suo straordinario splendore al duca Federico da Montefeltro, che trasformò la città in un punto di riferimento per artisti, architetti e studiosi del Rinascimento.</p><p>Il monumento simbolo è il maestoso Palazzo Ducale, oggi sede della Galleria Nazionale delle Marche, che custodisce importanti opere di Piero della Francesca, Raffaello e di altri grandi maestri. Da non perdere anche la Casa Natale di Raffaello, il Duomo e il fitto intreccio di vicoli, scalinate e piazze che rendono ogni passeggiata un viaggio nella storia.</p>',
              enLong:'<p>Perched on the hills of the Marche, Urbino owes its extraordinary splendour to Duke Federico da Montefeltro, who transformed the city into a reference point for Renaissance artists, architects and scholars.</p><p>The symbolic monument is the majestic Palazzo Ducale, today home to the Galleria Nazionale delle Marche, which houses important works by Piero della Francesca, Raphael and other great masters. Also not to be missed are Raphael\'s birthplace, the Cathedral, and the dense network of alleys, staircases and squares that make every walk a journey through history.</p>',
              deLong:'<p>Auf den Hügeln der Marken thront Urbino, das seinen außergewöhnlichen Glanz dem Herzog Federico da Montefeltro verdankt, der die Stadt zu einem Bezugspunkt für Künstler, Architekten und Gelehrte der Renaissance machte.</p><p>Das Wahrzeichen der Stadt ist der prächtige Palazzo Ducale, heute Sitz der Galleria Nazionale delle Marche, die bedeutende Werke von Piero della Francesca, Raffael und anderen großen Meistern beherbergt. Nicht verpassen sollte man auch das Geburtshaus Raffaels, den Dom und das dichte Geflecht aus Gassen, Treppen und Plätzen, die jeden Spaziergang zu einer Reise durch die Geschichte machen.</p>',
              plLong:'<p>Wznosząc się na wzgórzach Marchii, Urbino zawdzięcza swój niezwykły blask księciu Federico da Montefeltro, który przekształcił miasto w punkt odniesienia dla artystów, architektów i uczonych renesansu.</p><p>Symbolem miasta jest majestatyczny Palazzo Ducale, dziś siedziba Galleria Nazionale delle Marche, przechowującej ważne dzieła Piera della Francesca, Rafaela i innych wielkich mistrzów. Warto też zobaczyć Dom Rodzinny Rafaela, katedrę oraz gęstą sieć uliczek, schodów i placów, które sprawiają, że każdy spacer staje się podróżą przez historię.</p>',
              itTime:'Mezza giornata – giornata intera.',enTime:'Half day – full day.',deTime:'Halber – ganzer Tag.',plTime:'Pół – cały dzień.',
              dist:'🚗 100 km – 1h30', mapQuery:'Urbino PU', lat:43.7262, lng:12.6363 },
            { name:'Ascoli Piceno', emoji:'⛲', photo:'',
              it:'Conosciuta come la "città delle cento torri", Ascoli Piceno conquista con la splendida Piazza del Popolo, considerata una delle più belle d\'Italia. Le facciate in travertino, i vicoli medievali e gli storici caffè creano un\'atmosfera senza tempo. È la patria delle celebri olive all\'ascolana, simbolo della cucina marchigiana. Da Ancona si raggiunge in circa un\'ora e mezza.',
              en:'Known as the "city of a hundred towers", Ascoli Piceno wins visitors over with the splendid Piazza del Popolo, considered one of the most beautiful in Italy. The travertine façades, medieval alleys and historic cafés create a timeless atmosphere. It is the home of the famous olive all\'ascolana, a symbol of Marche cuisine. It is reached from Ancona in about an hour and a half.',
              de:'Bekannt als "Stadt der hundert Türme", begeistert Ascoli Piceno mit der prächtigen Piazza del Popolo, die als eine der schönsten Italiens gilt. Die Travertinfassaden, mittelalterlichen Gassen und historischen Cafés schaffen eine zeitlose Atmosphäre. Sie ist die Heimat der berühmten olive all\'ascolana, einem Symbol der Küche der Marken. Von Ancona aus in etwa anderthalb Stunden erreichbar.',
              pl:'Znane jako "miasto stu wież", Ascoli Piceno zdobywa serca wspaniałym Piazza del Popolo, uważanym za jeden z najpiękniejszych placów Włoch. Trawertynowe fasady, średniowieczne uliczki i historyczne kawiarnie tworzą ponadczasową atmosferę. To ojczyzna słynnych olive all\'ascolana, symbolu kuchni marchijskiej. Dojazd z Ankony zajmuje około półtorej godziny.',
              itLong:'<p>Il cuore della città è la splendida Piazza del Popolo, considerata uno dei più armoniosi esempi di piazza rinascimentale italiana. Qui si affacciano il Palazzo dei Capitani del Popolo, la storica Chiesa di San Francesco e gli eleganti portici che ospitano il celebre Caffè Meletti, simbolo della città.</p><p>Meritano una visita anche Piazza Arringo, il Duomo di Sant\'Emidio e il Ponte Romano di Solestà. Prima di ripartire è quasi d\'obbligo assaggiare le autentiche olive all\'ascolana, nate proprio qui.</p>',
              enLong:'<p>The heart of the city is the splendid Piazza del Popolo, considered one of the most harmonious examples of an Italian Renaissance square. Facing onto it are the Palazzo dei Capitani del Popolo, the historic Church of San Francesco and the elegant porticoes housing the famous Caffè Meletti, a symbol of the city.</p><p>Piazza Arringo, the Cathedral of Sant\'Emidio and the Roman Bridge of Solestà are also worth a visit. Before leaving, tasting the authentic olive all\'ascolana, born right here, is almost obligatory.</p>',
              deLong:'<p>Das Herz der Stadt ist die prächtige Piazza del Popolo, die als eines der harmonischsten Beispiele eines italienischen Renaissanceplatzes gilt. An ihr liegen der Palazzo dei Capitani del Popolo, die historische Kirche San Francesco und die eleganten Arkaden mit dem berühmten Caffè Meletti, einem Wahrzeichen der Stadt.</p><p>Einen Besuch wert sind auch die Piazza Arringo, der Dom Sant\'Emidio und die Römerbrücke von Solestà. Vor der Abreise sollte man unbedingt die authentischen olive all\'ascolana probieren, die genau hier entstanden sind.</p>',
              plLong:'<p>Sercem miasta jest wspaniały Piazza del Popolo, uważany za jeden z najbardziej harmonijnych przykładów włoskiego placu renesansowego. Otaczają go Palazzo dei Capitani del Popolo, historyczny kościół San Francesco oraz eleganckie portyki mieszczące słynną Caffè Meletti, symbol miasta.</p><p>Warto odwiedzić także Piazza Arringo, katedrę Sant\'Emidio oraz Rzymski Most Solestà. Przed wyjazdem niemal obowiązkowe jest spróbowanie autentycznych olive all\'ascolana, które narodziły się właśnie tutaj.</p>',
              itTime:'Mezza giornata – giornata intera.',enTime:'Half day – full day.',deTime:'Halber – ganzer Tag.',plTime:'Pół – cały dzień.',
              dist:'🚗 120 km – 1h40', mapQuery:'Ascoli Piceno AP', lat:42.8534, lng:13.5741 },
            { name:'Grotte di Frasassi', emoji:'🕯️', photo:'frasassi.jpg',
              it:'Tra le meraviglie naturali più spettacolari d\'Europa, le Grotte di Frasassi custodiscono immense sale sotterranee, laghi cristallini e straordinarie formazioni di stalattiti e stalagmiti. Il percorso guidato è adatto a tutti e offre un\'esperienza davvero indimenticabile. Nelle vicinanze meritano una visita anche l\'Abbazia di San Vittore e il suggestivo Tempio del Valadier. Da Ancona si raggiungono in circa 50 minuti.',
              en:'Among Europe\'s most spectacular natural wonders, the Frasassi Caves hold immense underground chambers, crystalline lakes and extraordinary stalactite and stalagmite formations. The guided route is suitable for everyone and offers a truly unforgettable experience. Nearby, the Abbey of San Vittore and the evocative Tempio del Valadier are also worth a visit. They are reached from Ancona in about 50 minutes.',
              de:'Zu den spektakulärsten Naturwundern Europas zählend, bergen die Grotten von Frasassi riesige unterirdische Säle, kristallklare Seen und außergewöhnliche Stalaktiten- und Stalagmitenformationen. Die geführte Route ist für alle geeignet und bietet ein wirklich unvergessliches Erlebnis. In der Nähe lohnen sich auch die Abtei San Vittore und der eindrucksvolle Tempio del Valadier. Von Ancona aus in etwa 50 Minuten erreichbar.',
              pl:'Wśród najbardziej spektakularnych cudów natury Europy, Groty Frasassi kryją ogromne podziemne sale, krystaliczne jeziora i niezwykłe formacje stalaktytów i stalagmitów. Trasa z przewodnikiem jest odpowiednia dla wszystkich i oferuje naprawdę niezapomniane przeżycie. W pobliżu warto odwiedzić także Opactwo San Vittore i sugestywną Świątynię Valadiera. Dojazd z Ankony zajmuje około 50 minut.',
              itLong:'<p>Scoperte nel 1971 e aperte al pubblico pochi anni dopo, le Grotte di Frasassi si sviluppano per oltre trenta chilometri nel sottosuolo del Parco Naturale Regionale della Gola della Rossa e di Frasassi.</p><p>Il percorso turistico attraversa ambienti di straordinaria bellezza, come l\'imponente Abisso Ancona, una cavità talmente vasta da poter contenere il Duomo di Milano, e la spettacolare Sala delle Candeline, ricca di delicate concrezioni calcaree modellate dall\'acqua nel corso di milioni di anni.</p><p>La visita è adatta a tutti e si svolge lungo un itinerario guidato di circa un\'ora e un quarto, con una temperatura costante di circa 14 °C durante tutto l\'anno.</p>',
              enLong:'<p>Discovered in 1971 and opened to the public a few years later, the Frasassi Caves extend for over thirty kilometres beneath the Gola della Rossa e di Frasassi Regional Nature Park.</p><p>The tourist route crosses environments of extraordinary beauty, such as the imposing Abisso Ancona, a cavity so vast it could contain Milan Cathedral, and the spectacular Sala delle Candeline, rich in delicate limestone formations shaped by water over millions of years.</p><p>The visit is suitable for everyone and follows a guided route of about an hour and a quarter, with a constant temperature of around 14°C all year round.</p>',
              deLong:'<p>1971 entdeckt und wenige Jahre später der Öffentlichkeit zugänglich gemacht, erstrecken sich die Grotten von Frasassi über mehr als dreißig Kilometer im Untergrund des Regionalen Naturparks Gola della Rossa e di Frasassi.</p><p>Die Besucherroute durchquert Umgebungen von außergewöhnlicher Schönheit, wie den imposanten Abisso Ancona, eine so weite Höhle, dass sie den Mailänder Dom aufnehmen könnte, und den spektakulären Saal der Kerzen (Sala delle Candeline), reich an zarten Kalksteinformationen, die das Wasser über Millionen von Jahren geformt hat.</p><p>Der Besuch eignet sich für alle und erfolgt entlang einer geführten Route von etwa einer Stunde und einer Viertelstunde, bei einer konstanten Temperatur von rund 14 °C das ganze Jahr über.</p>',
              plLong:'<p>Odkryte w 1971 roku i udostępnione publiczności kilka lat później, Groty Frasassi rozciągają się na ponad trzydziestu kilometrach pod Parkiem Regionalnym Gola della Rossa e di Frasassi.</p><p>Trasa turystyczna przemierza miejsca o niezwykłym pięknie, takie jak imponująca Abisso Ancona, jaskinia na tyle rozległa, że mogłaby pomieścić mediolańską katedrę, oraz spektakularna Sala delle Candeline, bogata w delikatne formacje wapienne ukształtowane przez wodę na przestrzeni milionów lat.</p><p>Zwiedzanie jest dostępne dla wszystkich i odbywa się wzdłuż trasy z przewodnikiem trwającej około godziny i kwadransa, przy stałej temperaturze około 14°C przez cały rok.</p>',
              itNote:'Biglietto online fortemente consigliato, soprattutto in alta stagione, per evitare lunghe attese in biglietteria.',
              enNote:'Online tickets strongly recommended, especially in high season, to avoid long queues at the ticket office.',
              deNote:'Online-Tickets werden dringend empfohlen, besonders in der Hochsaison.',
              plNote:'Zdecydowanie zalecane bilety online, zwłaszcza w wysokim sezonie.',

              dist:'🚗 65 km – 50 min', mapQuery:'Grotte di Frasassi', lat:43.3963, lng:12.9691 }

        gastronomy: {
            intro: {
                it:'La cucina anconetana racconta il legame profondo tra mare e colline. Piatti di pesce, ricette tramandate da generazioni e prodotti del territorio rendono la gastronomia locale una delle esperienze da non perdere durante il soggiorno. Ancona è una città di mare e questo si riflette nella sua cucina. Le ricette tradizionali nascono dall\'incontro tra il pescato dell\'Adriatico e gli ingredienti dell\'entroterra marchigiano, dando vita a piatti semplici ma ricchi di sapore. Molte preparazioni hanno origini antiche e ancora oggi vengono realizzate secondo le ricette tradizionali. Nei ristoranti della città è possibile trovare sia locali storici sia proposte più moderne, accomunate dall\'utilizzo di materie prime locali e pesce fresco.',
                en:'Ancona\'s cuisine tells of the deep bond between sea and hills. Fish dishes, recipes handed down through generations and local products make the local gastronomy one of the unmissable experiences of a stay. Ancona is a seaside city and this is reflected in its cuisine. Traditional recipes arise from the meeting of Adriatic catch and ingredients from the Marche hinterland, giving life to simple but flavourful dishes. Many preparations have ancient origins and are still made today following traditional recipes. In the city\'s restaurants you\'ll find both historic establishments and more modern offerings, united by the use of local ingredients and fresh fish.',
                de:'Die anconitanische Küche erzählt von der tiefen Verbindung zwischen Meer und Hügeln. Fischgerichte, über Generationen weitergegebene Rezepte und lokale Produkte machen die Gastronomie zu einem der unvergesslichen Erlebnisse des Aufenthalts.',
                pl:'Kuchnia ankońska opowiada o głębokim związku między morzem a wzgórzami. Dania rybne, przepisy przekazywane z pokolenia na pokolenie i lokalne produkty czynią miejscową gastronomię jednym z niezapomnianych doświadczeń pobytu.'
            },
            hostTip: {
                it:'Se soggiorni nel weekend o nei mesi estivi, prenota con anticipo, soprattutto per i ristoranti di pesce e quelli di Portonovo.',
                en:'If staying at the weekend or in summer, book in advance, especially for fish restaurants and those at Portonovo.',
                de:'Wochenende oder Sommer: Im Voraus buchen, besonders Fischrestaurants.',
                pl:'Weekend lub lato: rezerwuj z wyprzedzeniem, szczególnie restauracje rybne.'
            },
            dishes: [
                { name:'Brodetto all\'Anconetana', emoji:'🍲',
                  it:'Il piatto simbolo della tradizione marinara cittadina. Nato a bordo delle barche da pesca con il pesce invendibile, viene preparato con numerose varietà di pesce cucinate con pomodoro, cipolla, olio extravergine, zafferano e una piccola quantità di aceto — gli ingredienti che gli conferiscono il tipico colore dorato e un sapore inconfondibile, distinguendolo da altre versioni adriatiche.',
                  en:'The signature dish of the city\'s maritime tradition. Born on fishing boats using unsaleable fish, it is made with many varieties of fish cooked with tomato, onion, extra virgin olive oil, saffron and a little vinegar — the ingredients that give it its typical golden colour and unmistakable flavour, setting it apart from other Adriatic versions.',
                  de:'Das Wahrzeichen-Gericht der maritimen Tradition der Stadt. Viele Fischarten mit Tomaten, Zwiebeln, Öl, Safran und Essig — die goldene Farbe und der unverwechselbare Geschmack.',
                  pl:'Flagowe danie morskiej tradycji miasta. Wiele gatunków ryb z pomidorami, cebulą, oliwą, szafranem i octem — złoty kolor i niepowtarzalny smak.' },
                { name:'Sardoncini Scottadito', emoji:'🐟',
                  it:'Uno dei piatti più amati della tradizione anconetana. Le alici dell\'Adriatico vengono cotte alla griglia e servite ben calde, tanto da doverle mangiare "scottandosi le dita", da cui deriva il loro nome. Semplici e saporiti, sono perfetti accompagnati da pane e un bicchiere di vino bianco locale.',
                  en:'One of the most beloved dishes of the Ancona tradition. Adriatic anchovies are grilled and served piping hot, so hot you have to eat them "burning your fingers" — hence the name. Simple and flavourful, perfect with bread and a glass of local white wine.',
                  de:'Eines der beliebtesten Gerichte Anconas. Adria-Sardellen werden gegrillt und heiß serviert. Einfach und schmackhaft, perfekt mit Brot und einem Glas lokalem Weißwein.',
                  pl:'Jedno z ulubionych dań tradycji ankońskiej. Sardele z Adriatyku grillowane i podawane na gorąco. Proste i smaczne, doskonałe z chlebem i kieliszkiem lokalnego białego wina.' },
                { name:'Raguse in Porchetta', emoji:'🐚',
                  it:'Specialità tipica della costa anconetana dal sapore intenso e aromatico. Le lumachine di mare vengono cotte nel pomodoro con finocchietto selvatico, aglio e spezie, richiamando i profumi della tradizionale porchetta marchigiana. Immancabile la classica scarpetta.',
                  en:'A typical speciality of the Ancona coast with an intense, aromatic flavour. Sea snails are cooked in tomato with wild fennel, garlic and spices, echoing the aromas of traditional Marche-style porchetta. Mopping up the sauce with bread is a must.',
                  de:'Typische Spezialität der Küste Anconas mit intensivem, aromatischem Geschmack. Meeresschnecken in Tomatensauce mit wildem Fenchel, Knoblauch und Gewürzen.',
                  pl:'Typowy specjał wybrzeża Ankony o intensywnym, aromatycznym smaku. Ślimaki morskie duszone w pomidorach z dzikim koperkiem, czosnkiem i przyprawami.' },
                { name:'Moscioli Selvatici di Portonovo', emoji:'🦪',
                  it:'I Moscioli di Portonovo sono mitili selvatici che crescono naturalmente sulle rocce del Monte Conero. Sono un presidio Slow Food e rappresentano una delle eccellenze gastronomiche delle Marche. A differenza delle comuni cozze allevate, i moscioli vengono raccolti esclusivamente in mare aperto da pescatori autorizzati. La raccolta è rigorosamente regolamentata per preservare questo prezioso habitat naturale e avviene solo in determinati periodi dell\'anno. Il loro sapore intenso e iodato è molto apprezzato dagli intenditori. Possono essere gustati semplicemente aperti in padella oppure utilizzati in primi piatti e zuppe di mare.',
                  en:'The Moscioli of Portonovo are wild mussels that grow naturally on the rocks of Monte Conero. They are a Slow Food Presidium and one of the gastronomic excellences of the Marche. Unlike common farmed mussels, moscioli are collected exclusively in open sea by authorised fishermen. Collection is strictly regulated to preserve this precious natural habitat and only takes place during certain periods of the year. Their intense, iodine-rich flavour is highly appreciated by connoisseurs. They can be enjoyed simply pan-opened or used in first courses and seafood soups.',
                  de:'Die Moscioli von Portonovo sind wilde Muscheln, die natürlich auf den Felsen des Monte Conero wachsen. Sie sind ein Slow-Food-Presidio und eine der gastronomischen Exzellenzen der Marken. Im Gegensatz zu gewöhnlichen Zuchtmuscheln werden Moscioli ausschließlich im offenen Meer von autorisierten Fischern gesammelt. Ihr intensiver, jodhaltiger Geschmack wird von Kennern sehr geschätzt.',
                  pl:'Moscioli z Portonovo to dzikie małże rosnące naturalnie na skałach Monte Conero. Są prezydium Slow Food i jednym z gastronomicznych skarbów Marchii. W przeciwieństwie do zwykłych hodowlanych małży, moscioli zbierane są wyłącznie na otwartym morzu przez uprawnionych rybaków. Ich intensywny, jodowy smak jest bardzo ceniony przez smakoszy.' },
                { name:'Stoccafisso all\'Anconetana', emoji:'🐟',
                  it:'Lo Stoccafisso all\'Anconetana è uno dei piatti più rappresentativi della tradizione cittadina, frutto degli antichi rapporti commerciali tra Ancona e il Nord Europa. Lo stoccafisso arrivava ad Ancona sulle navi mercantili provenienti dalla Norvegia e venne presto adottato dalla cucina locale. La ricetta tradizionale prevede una lunga cottura con patate, pomodoro, vino bianco, olio extravergine, olive e aromi mediterranei. Il risultato è un piatto delicato ma ricco di gusto, che ancora oggi rappresenta uno dei simboli della gastronomia marchigiana.',
                  en:'Stoccafisso all\'Anconetana is one of the most representative dishes of the city\'s tradition, the result of ancient trade relations between Ancona and Northern Europe. Stockfish arrived in Ancona on merchant ships from Norway and was soon adopted by local cuisine. The traditional recipe involves long cooking with potatoes, tomato, white wine, extra virgin olive oil, olives and Mediterranean aromatics. The result is a delicate yet flavour-rich dish that still represents one of the symbols of Marche gastronomy.',
                  de:'Der Stoccafisso all\'Anconetana ist eines der repräsentativsten Gerichte der Stadttradition, Ergebnis der alten Handelsbeziehungen zwischen Ancona und Nordeuropa. Der Stockfisch kam mit Handelsschiffen aus Norwegen nach Ancona und wurde bald in die lokale Küche übernommen. Lange Garzeit mit Kartoffeln, Tomaten, Weißwein, Olivenöl, Oliven und mediterranen Aromen.',
                  pl:'Stoccafisso all\'Anconetana to jedno z najbardziej reprezentatywnych dań miejskiej tradycji, owoc dawnych stosunków handlowych między Ankoną a Europą Północną. Sztokfisz przybywał do Ankony na statkach handlowych z Norwegii i szybko został przyjęty przez lokalną kuchnię. Długie gotowanie z ziemniakami, pomidorami, białym winem, oliwą, oliwkami i śródziemnomorskimi aromatami.' },
                { name:'Vincisgrassi', emoji:'🍝',
                  it:'I Vincisgrassi sono la versione marchigiana delle lasagne e rappresentano uno dei piatti più celebri della cucina regionale. Preparati con numerosi strati di pasta fresca, ragù di carne e besciamella, i vincisgrassi richiedono una lunga preparazione e sono tradizionalmente serviti durante le festività. La ricetta varia leggermente da famiglia a famiglia, ma mantiene sempre il carattere ricco e sostanzioso che l\'ha resa famosa.',
                  en:'Vincisgrassi are the Marche version of lasagne and represent one of the most celebrated dishes of regional cuisine. Made with numerous layers of fresh pasta, meat ragù and béchamel, vincisgrassi require long preparation and are traditionally served during festivities. The recipe varies slightly from family to family, but always keeps the rich, hearty character that made it famous.',
                  de:'Vincisgrassi sind die Marken-Version der Lasagne und eines der berühmtesten Gerichte der regionalen Küche. Zahlreiche Schichten frischer Pasta, Fleischragù und Béchamel; lange Zubereitung, traditionell zu Festtagen serviert. Das Rezept variiert leicht von Familie zu Familie.',
                  pl:'Vincisgrassi to marchijska wersja lasagne i jedno z najsłynniejszych dań kuchni regionalnej. Liczne warstwy świeżego makaronu, ragù mięsnego i beszamelu; długie przygotowanie, tradycyjnie podawane podczas świąt. Przepis różni się nieznacznie w zależności od rodziny.' },
                { name:'Rosso Conero DOC', emoji:'🍷',
                  it:'Il Rosso Conero è il vino simbolo del territorio. Ottenuto prevalentemente da uve Montepulciano coltivate sulle colline del Conero, accompagna perfettamente i piatti della tradizione marchigiana. Le vigne crescono su terreni ricchi di minerali, influenzati dalla vicinanza del mare e dal particolare microclima del Monte Conero. Questo conferisce al vino struttura, eleganza e intensi profumi di frutti rossi e spezie. Numerose cantine della zona propongono visite guidate e degustazioni, offrendo l\'opportunità di conoscere da vicino una delle produzioni vinicole più prestigiose delle Marche.',
                  en:'Rosso Conero is the territory\'s signature wine. Made mainly from Montepulciano grapes grown on the Conero hills, it pairs perfectly with traditional Marche dishes. The vines grow on mineral-rich soils, influenced by the proximity of the sea and the particular microclimate of Monte Conero. This gives the wine structure, elegance and intense aromas of red fruit and spices. Many local wineries offer guided tours and tastings, giving the chance to get to know up close one of the Marche\'s most prestigious wine productions.',
                  de:'Der Rosso Conero ist der Symbolwein des Gebiets, hauptsächlich aus Montepulciano-Trauben auf den Hügeln des Conero. Die Reben wachsen auf mineralreichen Böden, beeinflusst von der Meeresnähe und dem besonderen Mikroklima. Struktur, Eleganz und intensive Aromen von roten Früchten und Gewürzen. Zahlreiche Weingüter bieten Führungen und Verkostungen an.',
                  pl:'Rosso Conero to symboliczne wino regionu, głównie z winogron Montepulciano uprawianych na wzgórzach Conero. Winnice rosną na glebach bogatych w minerały, pod wpływem bliskości morza i szczególnego mikroklimatu Monte Conero. Struktura, elegancja i intensywne aromaty czerwonych owoców i przypraw. Liczne winnice oferują zwiedzanie z przewodnikiem i degustacje.' }
            ],
        },
