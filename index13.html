    const appData = {

        mustsee: [
            { order:1, name:'Fontana del Calamo (Le 13 Cannelle)', emoji:'⛲', photo:'fontana-calamo.jpg',
              it:'Conosciuta dagli anconetani come la Fontana delle 13 Cannelle, è uno dei simboli più autentici della città e rappresenta il punto ideale da cui iniziare la scoperta del centro storico.',
              en:'Known to Ancona residents as the Fountain of the 13 Spouts, one of the city\'s most authentic symbols and the ideal starting point for exploring the historic centre.',
              de:'Als Brunnen der 13 Wasserspeier bekannt, eines der authentischsten Symbole der Stadt und idealer Ausgangspunkt für die Entdeckung der Altstadt.',
              pl:'Znana jako Fontanna 13 Dysz, jeden z najbardziej autentycznych symboli miasta i idealny punkt wyjścia do odkrywania centrum historycznego.',
              itLong:'<p>L\'attuale aspetto rinascimentale risale alla metà del Cinquecento, ma la sorgente era già utilizzata nei secoli precedenti per rifornire d\'acqua abitanti e marinai. Le tredici maschere in bronzo, da cui sgorga l\'acqua, hanno dato origine al nome con cui la fontana è ancora oggi conosciuta.</p><p>Di fronte alla fontana una targa ricorda l\'antica Porta del Calamo, uno degli ingressi medievali della città, demolita dopo l\'Unità d\'Italia nel 1860 per favorire l\'espansione urbana.</p>',
              enLong:'<p>Its current Renaissance appearance dates from the mid-16th century, though the spring was already in use in earlier centuries to supply water to residents and sailors. The thirteen bronze masks from which the water flows gave rise to the name by which the fountain is still known today.</p><p>Opposite the fountain a plaque commemorates the ancient Porta del Calamo, one of the city\'s medieval gates, demolished after the Unification of Italy in 1860 to allow for urban expansion.</p>',
              deLong:'<p>Das heutige Renaissance-Aussehen stammt aus der Mitte des 16. Jahrhunderts, doch die Quelle wurde bereits in früheren Jahrhunderten zur Wasserversorgung von Bewohnern und Seeleuten genutzt. Die dreizehn Bronzemasken, aus denen das Wasser fließt, gaben dem Brunnen seinen bis heute bekannten Namen.</p><p>Gegenüber dem Brunnen erinnert eine Gedenktafel an das antike Porta del Calamo, eines der mittelalterlichen Stadttore, das 1860 nach der Einigung Italiens für die Stadterweiterung abgerissen wurde.</p>',
              plLong:'<p>Obecny renesansowy wygląd pochodzi z połowy XVI wieku, choć źródło było wykorzystywane już w poprzednich wiekach do zaopatrywania mieszkańców i marynarzy w wodę. Trzynaście brązowych masek, z których wypływa woda, dały fontannie nazwę, pod którą jest znana do dziś.</p><p>Naprzeciwko fontanny tablica upamiętnia dawną Porta del Calamo, jedną ze średniowiecznych bram miasta, zburzoną po zjednoczeniu Włoch w 1860 roku w celu rozbudowy miasta.</p>',
              itNote:'Cercate le differenze tra le tredici maschere: nessuna è uguale all\'altra.',
              enNote:'Look for the differences between the thirteen masks: no two are the same.',
              deNote:'Suchen Sie Unterschiede: Keine Maske gleicht der anderen.',
              plNote:'Szukajcie różnic: żadna maska nie jest taka sama.',

              enPhoto:'Head-on with morning light on the bronzes.',
              dePhoto:'Frontal im Morgenlicht auf den Bronzen.',
              plPhoto:'Czołowo z porannym światłem na brązach.',
              itTime:'5–10 minuti.',enTime:'5–10 minutes.',deTime:'5–10 Minuten.',plTime:'5–10 minut.',
              dist:'📍 Punto di partenza', mapQuery:'Fontana del Calamo Ancona', lat:43.6184165, lng:13.5129301 },

            { order:2, name:'Teatro delle Muse', emoji:'🎭', photo:'teatro-muse.jpg',
              it:'Il Teatro delle Muse è il principale teatro delle Marche e il cuore della vita culturale di Ancona.',
              en:'The Teatro delle Muse is the principal theatre of the Marche and the heart of Ancona\'s cultural life.',
              de:'Das Teatro delle Muse ist das wichtigste Theater der Marken und das Herz des kulturellen Lebens von Ancona.',
              pl:'Teatro delle Muse to główny teatr Marchii i serce życia kulturalnego Ankony.',
              itLong:'<p>Inaugurato nel 1827 in elegante stile neoclassico, rappresenta ancora oggi uno dei luoghi più importanti della città per concerti, opere liriche, spettacoli di prosa e danza. Gravemente danneggiato durante i bombardamenti della Seconda guerra mondiale, rimase chiuso per molti decenni prima di essere completamente restaurato e restituito alla città nel 2002.</p><p>La piazza antistante è uno dei punti d\'incontro preferiti dagli anconetani e spesso ospita eventi e manifestazioni.</p>',
              enLong:'<p>Inaugurated in 1827 in elegant neoclassical style, it remains one of the city\'s most important venues for concerts, opera, drama and dance. Severely damaged during Second World War bombing raids, it remained closed for many decades before being fully restored and returned to the city in 2002.</p><p>The square in front is one of Ancona locals\' favourite meeting spots and often hosts events.</p>',
              deLong:'<p>1827 im eleganten neoklassizistischen Stil eingeweiht, ist es noch heute einer der wichtigsten Orte der Stadt für Konzerte, Opern, Schauspiel und Tanz. Im Zweiten Weltkrieg schwer beschädigt, blieb es jahrzehntelang geschlossen, bevor es 2002 vollständig restauriert der Stadt zurückgegeben wurde.</p><p>Der davorliegende Platz ist einer der beliebtesten Treffpunkte der Anconitaner und beherbergt oft Veranstaltungen.</p>',
              plLong:'<p>Otwarty w 1827 roku w eleganckim stylu neoklasycystycznym, pozostaje jednym z najważniejszych miejsc miasta na koncerty, opery, spektakle teatralne i taniec. Poważnie uszkodzony podczas bombardowań II wojny światowej, pozostawał zamknięty przez wiele dziesięcioleci, zanim został całkowicie odrestaurowany i zwrócony miastu w 2002 roku.</p><p>Plac przed teatrem to jedno z ulubionych miejsc spotkań mieszkańców Ankony, często gospodarz wydarzeń.</p>',
              itNote:'Il pronao con le sei colonne ioniche: trovate l\'angolazione che mostra le colonne in prospettiva.',

              plPhoto:'Z placu o zachodzie słońca.',
              itTime:'10 min (esterno). 2 ore con spettacolo.',enTime:'10 min (exterior). 2h with show.',deTime:'10 Min. (Außen). 2 Std. mit Vorstellung.',plTime:'10 min (zewnątrz). 2 godz. ze spektaklem.',
              dist:'🚶 350 m – 5 min', mapQuery:'Teatro delle Muse Ancona', lat:43.6192483, lng:13.5099488 },

            { order:3, name:'Loggia dei Mercanti', emoji:'🏛️', photo:'loggia-mercanti.jpg',
              it:'La Loggia dei Mercanti è uno dei più raffinati esempi di architettura gotico-rinascimentale di Ancona.',
              en:'The Loggia dei Mercanti is one of Ancona\'s finest examples of Gothic-Renaissance architecture.',
              de:'Die Loggia dei Mercanti ist eines der feinsten Beispiele gotisch-Renaissance-Architektur Anconas.',
              pl:'Loggia dei Mercanti to jeden z najpiękniejszych przykładów architektury gotycko-renesansowej Ankony.',
              itLong:'<p>Costruita nel Quattrocento su progetto di Giorgio da Sebenico, lo stesso architetto del vicino Palazzo Benincasa, era il luogo dove mercanti provenienti da tutto il Mediterraneo concludevano affari e commerci. La ricca facciata in pietra racconta l\'importanza economica che Ancona ebbe come Repubblica Marinara e porto commerciale, crocevia di culture, lingue e popoli.</p><p>Fermatevi qualche istante ad osservare i dettagli delle decorazioni: testimoniano la ricchezza raggiunta dalla città durante il suo periodo di massimo splendore.</p><p>Una piccola traccia della vita di un tempo: lungo la facciata di Palazzo Benincasa, a livello della strada, sono ancora visibili alcuni robusti anelli di ferro. Probabilmente servivano come punti di posta per legare i cavalli davanti al palazzo, quando via della Loggia era una delle strade commerciali più importanti della città. Un dettaglio discreto che racconta un\'epoca in cui mercanti, carri e cavalli animavano quotidianamente questa parte di Ancona.</p>',
              enLong:'<p>Built in the 15th century to a design by Giorgio da Sebenico, the same architect behind the nearby Palazzo Benincasa, it was where merchants from across the Mediterranean concluded deals. The richly decorated stone façade tells of Ancona\'s economic importance as a Maritime Republic and trading port, a crossroads of cultures, languages and peoples.</p><p>Take a moment to observe the details of the decorations: they bear witness to the wealth the city achieved during its period of greatest splendour.</p><p>A small trace of times past: along the façade of Palazzo Benincasa, at street level, sturdy iron rings are still visible. They likely served as hitching points for horses in front of the palace, back when Via della Loggia was one of the city\'s most important commercial streets. A discreet detail telling of an era when merchants, carts and horses filled this part of Ancona every day.</p>',
              deLong:'<p>Im 15. Jahrhundert nach einem Entwurf von Giorgio da Sebenico erbaut, demselben Architekten des nahegelegenen Palazzo Benincasa, war sie der Ort, an dem Kaufleute aus dem gesamten Mittelmeerraum Geschäfte abschlossen. Die reich verzierte Steinfassade erzählt von Anconas wirtschaftlicher Bedeutung als Seerepublik.</p><p>Nehmen Sie sich einen Moment Zeit, um die Details der Dekorationen zu betrachten.</p><p>Eine kleine Spur vergangener Zeiten: entlang der Fassade des Palazzo Benincasa sind auf Straßenniveau noch stabile Eisenringe zu sehen. Sie dienten vermutlich zum Anbinden von Pferden vor dem Palast, als die Via della Loggia eine der wichtigsten Handelsstraßen der Stadt war. Ein unauffälliges Detail, das von einer Zeit erzählt, in der Kaufleute, Karren und Pferde diesen Teil Anconas täglich belebten.</p>',
              plLong:'<p>Zbudowana w XV wieku według projektu Giorgio da Sebenico, tego samego architekta pobliskiego Palazzo Benincasa, była miejscem, gdzie kupcy z całego basenu Morza Śródziemnego zawierali transakcje. Bogato zdobiona kamienna fasada opowiada o gospodarczym znaczeniu Ankony jako Republiki Morskiej.</p><p>Zatrzymajcie się na chwilę, aby przyjrzeć się szczegółom dekoracji.</p><p>Mały ślad dawnego życia: wzdłuż fasady Palazzo Benincasa, na poziomie ulicy, wciąż widoczne są solidne żelazne pierścienie. Prawdopodobnie służyły do przywiązywania koni przed pałacem, gdy via della Loggia była jedną z najważniejszych ulic handlowych miasta. Dyskretny szczegół opowiadający o epoce, w której kupcy, wozy i konie codziennie ożywiały tę część Ankony.</p>',
              itNote:'Cercate i tre leoni rampanti: sono il simbolo araldico di Ancona.',
              enNote:'Look for the three rampant lions: Ancona\'s heraldic symbol.',
              deNote:'Die drei Löwen: das Wappensymbol Anconas.',
              plNote:'Trzy lwy wspinające: herbowy symbol Ankony.',
              itPhoto:'Frontalmente con luce mattutina sui bassorilievi.',
              enPhoto:'Head-on with morning light on the bas-reliefs.',
              dePhoto:'Frontal im Morgenlicht.',
              plPhoto:'Czołowo z porannym światłem.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 50 m – 1 min', mapQuery:'Loggia dei Mercanti Ancona', lat:43.6199818, lng:13.5098563 },

            { order:4, name:'Chiesa di Santa Maria della Piazza', emoji:'⛪', photo:'santa-maria-piazza.jpg',
              it:'La Chiesa di Santa Maria della Piazza è uno dei più preziosi esempi di architettura romanica delle Marche.',
              en:'The Church of Santa Maria della Piazza is one of the most precious examples of Romanesque architecture in the Marche.',
              de:'Die Kirche Santa Maria della Piazza ist eines der wertvollsten Beispiele romanischer Architektur der Marken.',
              pl:'Kościół Santa Maria della Piazza to jeden z najcenniejszych przykładów architektury romańskiej Marchii.',
              itLong:'<p>Edificata tra l\'XI e il XII secolo, sorge sui resti di una basilica paleocristiana del IV secolo, testimoniando oltre millecinquecento anni di storia e di fede. La sua elegante facciata, impreziosita da archetti e decorazioni scolpite nella pietra bianca del Conero, è considerata uno dei capolavori del romanico adriatico.</p><p>All\'interno, una parte del pavimento è realizzata in vetro e permette di osservare gli straordinari mosaici della chiesa paleocristiana sottostante, visitabile accedendo al piano inferiore.</p><p>Di fronte alla chiesa si apre la storica Portella Santa Maria, uno degli antichi passaggi aperti lungo il muro fronte mare che collegava direttamente il centro cittadino al porto. Per secoli mercanti, pellegrini e marinai hanno attraversato questo stesso varco entrando nella Repubblica Marinara di Ancona.</p>',
              enLong:'<p>Built between the 11th and 12th centuries, it stands over the remains of a 4th-century Early Christian basilica, bearing witness to over fifteen hundred years of history and faith. Its elegant façade, adorned with arcades and carvings in white Conero stone, is considered one of the masterpieces of Adriatic Romanesque.</p><p>Inside, part of the floor is made of glass, revealing the extraordinary mosaics of the Early Christian church below, which can also be visited on the lower level.</p><p>Facing the church is the historic Portella Santa Maria, one of the ancient openings along the seafront wall that connected the city centre directly to the port. For centuries merchants, pilgrims and sailors passed through this very gateway entering the Maritime Republic of Ancona.</p>',
              deLong:'<p>Zwischen dem 11. und 12. Jahrhundert erbaut, steht sie über den Resten einer frühchristlichen Basilika aus dem 4. Jahrhundert. Die elegante Fassade aus weißem Conero-Stein gilt als Meisterwerk der adriatischen Romanik.</p><p>Im Inneren ist ein Teil des Bodens aus Glas und ermöglicht den Blick auf die außergewöhnlichen Mosaiken der darunterliegenden frühchristlichen Kirche.</p><p>Gegenüber der Kirche öffnet sich die historische Portella Santa Maria, einer der antiken Durchgänge, die das Zentrum direkt mit dem Hafen verbanden.</p>',
              plLong:'<p>Zbudowany między XI a XII wiekiem, stoi nad pozostałościami wczesnochrześcijańskiej bazyliki z IV wieku. Elegancka fasada z białego kamienia Conero uznawana jest za arcydzieło romanizmu adriatyckiego.</p><p>Wewnątrz część podłogi wykonana jest ze szkła, odsłaniając niezwykłe mozaiki wczesnochrześcijańskiego kościoła poniżej.</p><p>Naprzeciwko kościoła znajduje się historyczna Portella Santa Maria, jedno z dawnych przejść łączących centrum bezpośrednio z portem.</p>',
              itNote:'Il pavimento vetrato vicino all\'altare: un dettaglio che quasi tutti mancano.',
              enNote:'The glass floor near the altar: a detail almost all visitors miss.',
              deNote:'Der Glasboden beim Altar: fast alle übersehen ihn.',
              plNote:'Szklana podłoga przy ołtarzu: prawie wszyscy ją przeoczają.',
              itPhoto:'La facciata in controluce nella luce mattutina.',
              enPhoto:'The façade against the morning light.',
              dePhoto:'Die Fassade im Gegenlicht.',
              plPhoto:'Fasada pod światło rano.',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚶 100 m – 2 min', mapQuery:'Santa Maria della Piazza Ancona', lat:43.6205592, lng:13.5103676 },

            { order:5, name:'Arco di Traiano', emoji:'🏛️', photo:'arco-traiano.jpg',
              it:'L\'Arco di Traiano è il monumento romano più celebre di Ancona e uno dei meglio conservati dell\'intero Adriatico.',
              en:'The Arch of Trajan is the most celebrated Roman monument in Ancona, one of the best preserved on the entire Adriatic.',
              de:'Der Trajansbogen ist das bekannteste römische Monument Anconas und eines der besterhaltenen der gesamten Adria.',
              pl:'Łuk Trajana to najsłynniejszy rzymski zabytek Ankony i jeden z najlepiej zachowanych na całym Adriatyku.',
              itLong:'<p>Fu eretto nel 115 d.C. per volontà del Senato Romano in onore dell\'imperatore Traiano, che finanziò personalmente l\'ampliamento del porto, trasformando Ancona in uno degli scali più importanti del Mediterraneo. Realizzato in candido marmo greco proveniente dall\'isola di Paro, l\'arco colpisce ancora oggi per l\'eleganza delle sue proporzioni e per la posizione spettacolare, affacciata direttamente sul mare.</p><p>Fermatevi qualche istante ad ammirare il panorama: davanti a voi si estende il porto moderno, mentre alle spalle si innalza il profilo del colle Guasco con la Cattedrale di San Ciriaco. È uno dei punti più fotografati di Ancona.</p>',
              enLong:'<p>It was erected in 115 AD by the will of the Roman Senate in honour of Emperor Trajan, who personally financed the port expansion, turning Ancona into one of the most important harbours of the Mediterranean. Built in white Greek marble from the island of Paros, the arch still impresses today with its elegant proportions and spectacular seafront position.</p><p>Take a moment to admire the panorama: ahead of you the modern port stretches out, while behind you rises the profile of the Guasco hill with the Cathedral of San Ciriaco. It is one of the most photographed spots in Ancona.</p>',
              deLong:'<p>Er wurde 115 n. Chr. auf Beschluss des römischen Senats zu Ehren von Kaiser Trajan errichtet, der die Hafenerweiterung persönlich finanzierte. Aus weißem griechischem Marmor der Insel Paros gefertigt, beeindruckt der Bogen noch heute durch seine eleganten Proportionen.</p><p>Nehmen Sie sich einen Moment Zeit, um das Panorama zu bewundern: vor Ihnen der moderne Hafen, hinter Ihnen der Colle Guasco mit der Kathedrale San Ciriaco.</p>',
              plLong:'<p>Wzniesiony w 115 r. n.e. z woli rzymskiego Senatu na cześć cesarza Trajana, który osobiście sfinansował rozbudowę portu. Wykonany z białego greckiego marmuru z wyspy Paros, łuk wciąż zachwyca elegancją proporcji.</p><p>Zatrzymajcie się na chwilę, by podziwiać panoramę: przed wami nowoczesny port, za wami wzgórze Guasco z Katedrą San Ciriaco.</p>',
              itNote:'Pur piccolo rispetto ad altri archi romani, è tra i più armoniosi dell\'Impero.',
              enNote:'Despite being small, it is considered one of the most harmonious arches in the Empire.',
              deNote:'Trotz geringer Größe einer der harmonischsten Bögen des Reiches.',
              plNote:'Mimo małych rozmiarów jeden z najbardziej harmonijnych łuków Imperium.',
              itPhoto:'Dal molo con il Duomo sul Colle Guasco alle spalle dell\'arco.',
              enPhoto:'From the jetty with the Cathedral on Guasco hill behind the arch.',
              dePhoto:'Vom Kai mit Dom hinter dem Bogen.',
              plPhoto:'Z mola z Katedrą za łukiem.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 300 m – 4 min', mapQuery:'Arco di Traiano Ancona', lat:43.6252706, lng:13.5066018 },

            { order:6, name:'Arco Clementino', emoji:'🏛️', photo:'arco-clementino.jpg',
              it:'L\'Arco Clementino rappresenta il passaggio tra la città romana e quella settecentesca.',
              en:'The Arch of Clement marks the passage between Roman Ancona and the 18th-century city.',
              de:'Der Clementinische Bogen markiert den Übergang zwischen dem römischen und dem barocken Ancona.',
              pl:'Łuk Klementyński stanowi przejście między rzymską a osiemnastowieczną Ankoną.',
              itLong:'<p>Progettato da Luigi Vanvitelli nel XVIII secolo, fu dedicato a Papa Clemente XII, il pontefice che concesse ad Ancona il prestigioso status di Porto Franco, favorendo un periodo di grande prosperità economica e commerciale. Con la facciata costruita in resistente pietra d\'Istria, mentre la controfacciata è in semplici mattoni d\'argilla, l\'arco presenta linee sobrie ed eleganti tipiche dell\'architettura vanvitelliana e costituiva l\'ingresso monumentale per chi arrivava in città via mare.</p><p>Passeggiando tra l\'Arco di Traiano e l\'Arco Clementino è facile immaginare l\'intenso traffico di navi mercantili, ambasciatori e viaggiatori che per secoli hanno fatto di Ancona uno dei principali porti dell\'Adriatico.</p>',
              enLong:'<p>Designed by Luigi Vanvitelli in the 18th century, it was dedicated to Pope Clement XII, who granted Ancona the prestigious status of Free Port, favouring a period of great economic and commercial prosperity. Its façade is built in sturdy Istrian stone, while the rear is in simple clay bricks; the arch shows the sober, elegant lines typical of Vanvitellian architecture and once served as the monumental entrance for those arriving in the city by sea.</p><p>Walking between the Arch of Trajan and the Arch of Clement, it is easy to imagine the intense traffic of merchant ships, ambassadors and travellers that for centuries made Ancona one of the leading ports of the Adriatic.</p>',
              deLong:'<p>Im 18. Jahrhundert von Luigi Vanvitelli entworfen, wurde er Papst Klemens XII. gewidmet, der Ancona den prestigeträchtigen Status eines Freihafens verlieh. Die Fassade besteht aus widerstandsfähigem istrischem Stein, die Rückseite aus einfachen Tonziegeln.</p><p>Beim Spaziergang zwischen dem Trajansbogen und dem Clementinischen Bogen kann man sich leicht den regen Verkehr von Handelsschiffen, Botschaftern und Reisenden vorstellen.</p>',
              plLong:'<p>Zaprojektowany przez Luigiego Vanvitellego w XVIII wieku, poświęcony papieżowi Klemensowi XII, który nadał Ankonie prestiżowy status Wolnego Portu. Fasada zbudowana z odpornego kamienia istryjskiego, tylna ściana z prostej cegły glinianej.</p><p>Spacerując między Łukiem Trajana a Łukiem Klemensa, łatwo wyobrazić sobie intensywny ruch statków handlowych, ambasadorów i podróżników.</p>',
              itNote:'Confrontate i due archi: Traiano austero e imperiale, Clementino elegante e commerciale.',
              enNote:'Compare the two arches: Trajan\'s austere and imperial, Clement\'s elegant and commercial.',
              deNote:'Zwei Bögen vergleichen: Trajans streng, Klements elegant.',
              plNote:'Porównajcie łuki: Trajana surowy, Klemensa elegancki.',
              itTime:'10 minuti.',enTime:'10 minutes.',deTime:'10 Minuten.',plTime:'10 minut.',
              dist:'🚶 50 m – 1 min', mapQuery:'Arco Clementino Ancona', lat:43.6252604, lng:13.5049529 },

            { order:'6b', name:'Lanterna Rossa', emoji:'🔴', photo:'lanterna-rossa.jpg',
              it:'Per chi desidera proseguire la passeggiata, la Lanterna Rossa rappresenta una deviazione breve ma altamente consigliata.',
              en:'For those wishing to continue the walk, the Red Lighthouse is a short but highly recommended detour.',
              de:'Für alle, die den Spaziergang fortsetzen möchten, ist die Rote Laterne ein kurzer, aber sehr empfehlenswerter Umweg.',
              pl:'Dla tych, którzy chcą kontynuować spacer, Czerwona Latarnia to krótkie, ale bardzo polecane odejście od trasy.',
              itLong:'<p>Attraversando sulla destra il varco nelle mura si raggiunge la Torre dei Piloti del porto; poco oltre, un passaggio quasi nascosto conduce al lungo molo che termina con l\'inconfondibile faro rosso, da oltre un secolo punto di riferimento per le imbarcazioni in ingresso. Luogo autentico e rilassato, ancora poco frequentato dal turismo di massa.</p>',
              enLong:'<p>Through the gap in the walls on the right you reach the port\'s Pilots\' Tower; just beyond, an almost hidden passage leads to the long jetty ending at the unmistakable red lighthouse, for over a century a reference point for incoming vessels. An authentic, relaxed spot still little known to mass tourism.</p>',
              deLong:'<p>Durch die Lücke in der Mauer rechts erreicht man den Turm der Hafenlotsen; kurz danach führt ein fast verborgener Durchgang zum langen Steg mit dem unverwechselbaren roten Leuchtturm. Ein authentischer, entspannter Ort, der vom Massentourismus noch wenig entdeckt wurde.</p>',
              plLong:'<p>Przez przejście w murach po prawej stronie dociera się do Wieży Pilotów portu; nieco dalej niemal ukryte przejście prowadzi na długie molo zakończone niezapomnianą czerwoną latarnią. Autentyczne, spokojne miejsce, wciąż mało znane masowej turystyce.</p>',
              itNote:'Salite sul molo: il Duomo da un lato, porto e Adriatico dall\'altro. Uno dei panorami più spettacolari di Ancona.',
              enNote:'Climb the jetty: the Cathedral on one side, port and Adriatic on the other. One of Ancona\'s most spectacular views.',
              deNote:'Auf den Kai: Dom auf einer Seite, Hafen und Adria auf der anderen.',
              plNote:'Na molo: Katedra po jednej stronie, port i Adriatyk po drugiej.',
              itPhoto:'Dal molo con il faro rosso in primo piano e il profilo della città sullo sfondo.',
              enPhoto:'From the jetty with the red lighthouse in front and the city skyline behind.',
              dePhoto:'Vom Kai mit rotem Leuchtturm im Vordergrund.',
              plPhoto:'Z mola z czerwoną latarnią.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚶 200 m – 3 min', mapQuery:'Lanterna Rossa Ancona', lat:43.6255485, lng:13.4942123 },

            { order:7, name:'Resti del Porto Romano', emoji:'⚓', photo:'porto-romano.jpg',
              it:'Percorrendo il lungomare in direzione del centro storico si incontrano i suggestivi resti dell\'antico Porto Romano, testimonianza dell\'importanza strategica che Ancona rivestiva già oltre duemila anni fa.',
              en:'Walking along the seafront towards the historic centre, you encounter the evocative remains of the ancient Roman Port, testimony to the strategic importance Ancona already held over two thousand years ago.',
              de:'Entlang der Promenade in Richtung Altstadt begegnet man den eindrucksvollen Überresten des antiken Römischen Hafens, Zeugnis der strategischen Bedeutung Anconas vor über zweitausend Jahren.',
              pl:'Idąc promenadą w kierunku centrum historycznego, natrafiamy na sugestywne pozostałości starożytnego Portu Rzymskiego, świadectwo strategicznego znaczenia, jakie Ankona miała już ponad dwa tysiące lat temu.',
              itLong:'<p>La passerella che l\'attraversa consente di osservare dall\'alto le strutture portuali risalenti all\'epoca romana, quando il porto rappresentava uno dei principali punti di collegamento tra la penisola italiana e le province orientali dell\'Impero. Proprio qui attraccavano navi cariche di merci provenienti dalla Grecia, dall\'Asia Minore e dai principali scali del Mediterraneo.</p><p>Sulla destra si trova la medievale Casa del Capitano del Porto, uno degli edifici più antichi dell\'area portuale, che ricorda come questa zona sia rimasta il cuore economico della città per secoli.</p>',
              enLong:'<p>The walkway crossing it lets you look down on the Roman-era port structures, when the harbour was one of the main links between the Italian peninsula and the eastern provinces of the Empire. Ships loaded with goods from Greece, Asia Minor and all the main Mediterranean ports docked right here.</p><p>On the right stands the medieval Casa del Capitano del Porto (Harbour Captain\'s House), one of the oldest buildings in the port area, a reminder that this zone remained the economic heart of the city for centuries.</p>',
              deLong:'<p>Der Steg darüber erlaubt den Blick auf die Hafenstrukturen aus römischer Zeit, als der Hafen eine der wichtigsten Verbindungen zwischen der italienischen Halbinsel und den östlichen Provinzen des Reiches war.</p><p>Rechts befindet sich das mittelalterliche Haus des Hafenkapitäns, eines der ältesten Gebäude im Hafengebiet.</p>',
              plLong:'<p>Kładka nad nimi pozwala z góry obserwować struktury portowe z czasów rzymskich, gdy port stanowił jedno z głównych połączeń między Półwyspem Apenińskim a wschodnimi prowincjami Imperium.</p><p>Po prawej stronie znajduje się średniowieczny Dom Kapitana Portu, jeden z najstarszych budynków w obszarze portowym.</p>',
              itNote:'La tecnica costruttiva romana: blocchi uniti senza malta, solo con perni metallici. Resistono da duemila anni.',
              enNote:'Roman construction: blocks joined without mortar, only with metal pins. Holding for two thousand years.',
              deNote:'Römische Technik: Blöcke ohne Mörtel, nur mit Metallstiften.',
              plNote:'Technika rzymska: bloki bez zaprawy, tylko metalowymi bolcami.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 300 m – 4 min', mapQuery:'Porto Romano Ancona', lat:43.6235224, lng:13.5095720 },

            { order:8, name:'Palazzo degli Anziani', emoji:'🏛️', photo:'palazzo-anziani.jpg',
              it:'Il Palazzo degli Anziani è uno dei luoghi più rappresentativi della storia civile di Ancona.',
              en:'The Palazzo degli Anziani is one of the most representative places of Ancona\'s civic history.',
              de:'Der Palazzo degli Anziani ist einer der repräsentativsten Orte der Zivilgeschichte Anconas.',
              pl:'Palazzo degli Anziani to jedno z najbardziej reprezentatywnych miejsc historii cywilnej Ankony.',
              itLong:'<p>Da oltre otto secoli domina il porto dall\'alto del colle e continua ancora oggi a ospitare il Consiglio Comunale della città. Le sue origini sono avvolte nella storia e nella leggenda: una tradizione attribuisce la prima costruzione a Galla Placidia nel V secolo, mentre l\'edificio attuale venne realizzato nel 1270 su progetto di Margaritone d\'Arezzo e successivamente rinnovato nel Cinquecento dall\'architetto Pellegrino Tibaldi.</p><p>Qui si riuniva il Consiglio degli Anziani, l\'organo che governava la Repubblica di Ancona durante il periodo della sua indipendenza. Le decisioni che riguardavano commerci, alleanze e difesa della città venivano prese proprio in queste sale.</p><p>Sulla sinistra si trova l\'ascensore pubblico che conduce alla sovrastante Piazza Stracca e offre anche accesso a servizi igienici. La piazza si può raggiungere anche salendo lungo i suggestivi percorsi che si snodano sui due fianchi del palazzo. Una volta raggiunta la parte alta della città, si gode di una splendida vista sui tetti del centro storico e sul porto.</p>',
              enLong:'<p>For over eight centuries it has dominated the port from the hilltop and still houses the City Council today. Its origins are wrapped in history and legend: tradition attributes the first construction to Galla Placidia in the 5th century, while the present building was built in 1270 to a design by Margaritone d\'Arezzo and later renovated in the 16th century by architect Pellegrino Tibaldi.</p><p>Here the Council of Elders met, the body that governed the Republic of Ancona during its period of independence. Decisions concerning trade, alliances and the city\'s defence were made right in these halls.</p><p>On the left is the public lift leading up to Piazza Stracca, which also offers access to public toilets. The square can also be reached by climbing the scenic paths that wind along both sides of the palace. Once at the top of the city, you enjoy a splendid view over the rooftops of the historic centre and the port.</p>',
              deLong:'<p>Seit über acht Jahrhunderten beherrscht er den Hafen vom Hügel aus und beherbergt noch heute den Stadtrat. Der Sage nach geht die erste Errichtung auf Galla Placidia im 5. Jahrhundert zurück, das heutige Gebäude entstand 1270 nach einem Entwurf von Margaritone d\'Arezzo und wurde im 16. Jahrhundert von Pellegrino Tibaldi erneuert.</p><p>Hier tagte der Ältestenrat, das Organ, das die Republik Ancona während ihrer Unabhängigkeit regierte.</p><p>Links befindet sich der öffentliche Aufzug zur Piazza Stracca mit Zugang zu öffentlichen Toiletten. Oben angekommen genießt man einen herrlichen Blick über die Dächer der Altstadt und den Hafen.</p>',
              plLong:'<p>Od ponad ośmiu wieków dominuje nad portem ze wzgórza i wciąż mieści Radę Miejską. Tradycja przypisuje pierwszą budowę Galli Placydii w V wieku, obecny budynek powstał w 1270 roku według projektu Margaritone d\'Arezzo i został odnowiony w XVI wieku przez Pellegrina Tibaldiego.</p><p>Tutaj obradowała Rada Starszych, organ rządzący Republiką Ankony w okresie jej niepodległości.</p><p>Po lewej stronie znajduje się publiczna winda prowadząca na Piazza Stracca, oferująca też dostęp do toalet publicznych. Na górze rozciąga się wspaniały widok na dachy centrum historycznego i port.</p>',
              itNote:'L\'ascensore pubblico: panorama gratuito sui tetti del centro storico e bagni pubblici.',
              enNote:'The public lift: free panoramic view over the rooftops and public toilets.',
              deNote:'Öffentlicher Aufzug: kostenloser Panoramablick und öffentliche Toiletten.',
              plNote:'Publiczna winda: bezpłatny widok panoramiczny i toalety.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 350 m – 5 min', mapQuery:'Palazzo degli Anziani Ancona', lat:43.6226783, lng:13.5105215 },

            { order:9, name:'Museo Archeologico Nazionale', emoji:'🏺', photo:'museo-archeologico.jpg',
              it:'Ospitato nello splendido Palazzo Ferretti, il Museo Archeologico Nazionale delle Marche custodisce una delle collezioni più importanti dell\'Italia centrale.',
              en:'Housed in the splendid Palazzo Ferretti, the National Archaeological Museum of the Marche holds one of the most important collections in central Italy.',
              de:'Im prächtigen Palazzo Ferretti untergebracht, bewahrt das Nationale Archäologische Museum der Marken eine der bedeutendsten Sammlungen Mittelitaliens.',
              pl:'Mieszczące się w cudownym Palazzo Ferretti, Narodowe Muzeum Archeologiczne Marchii przechowuje jedną z najważniejszych kolekcji środkowych Włoch.',
              itLong:'<p>Le sale affrescate da Pellegrino Tibaldi fanno da cornice a un viaggio che attraversa migliaia di anni di storia: dai primi insediamenti preistorici fino all\'età romana. Tra i reperti più celebri spiccano i ricchi corredi funerari dei Piceni, l\'antico popolo che abitava queste terre prima della conquista romana.</p><p>La visita permette di comprendere come il territorio marchigiano sia stato per secoli un crocevia di culture, commerci e civiltà provenienti dall\'intero bacino mediterraneo. Anche chi non dispone del tempo necessario per visitare il museo può soffermarsi ad ammirare il palazzo, uno dei più eleganti edifici rinascimentali della città.</p>',
              enLong:'<p>Rooms frescoed by Pellegrino Tibaldi frame a journey spanning thousands of years of history, from the first prehistoric settlements to the Roman age. Among the most celebrated finds are the rich funerary goods of the Piceni, the ancient people who inhabited these lands before the Roman conquest.</p><p>The visit shows how the Marche region has for centuries been a crossroads of cultures, trade and civilisations from across the Mediterranean basin. Even those without time to visit the museum can pause to admire the palace itself, one of the city\'s most elegant Renaissance buildings.</p>',
              deLong:'<p>Die von Pellegrino Tibaldi mit Fresken geschmückten Säle rahmen eine Reise durch Jahrtausende der Geschichte, von den ersten prähistorischen Siedlungen bis zur Römerzeit. Zu den berühmtesten Funden zählen die reichen Grabbeigaben der Picener.</p><p>Der Besuch zeigt, wie das Gebiet der Marken über Jahrhunderte ein Knotenpunkt von Kulturen, Handel und Zivilisationen war.</p>',
              plLong:'<p>Sale ozdobione freskami Pellegrina Tibaldiego stanowią oprawę podróży przez tysiące lat historii, od pierwszych osad prehistorycznych po epokę rzymską. Wśród najsłynniejszych znalezisk wyróżniają się bogate wyposażenia grobowe Piceńczyków.</p><p>Wizyta pozwala zrozumieć, jak region Marchii był przez wieki skrzyżowaniem kultur, handlu i cywilizacji.</p>',
              itNote:'I corredi funerari piceni al piano superiore: l\'oreficeria è di qualità eccezionale.',
              enNote:'The Picene funerary goods on the upper floor: goldwork of exceptional quality.',
              deNote:'Picenische Grabbeigaben im Obergeschoss: außergewöhnliches Goldschmiedewerk.',
              plNote:'Wyposażenie grobowe Picenów: złotnictwo wyjątkowej jakości.',
              itPhoto:'La facciata di Palazzo Ferretti: uno degli angoli rinascimentali più eleganti.',
              enPhoto:'The Palazzo Ferretti façade: one of the most elegant Renaissance corners.',
              dePhoto:'Palazzo-Ferretti-Fassade: eleganteste Renaissanceecke.',
              plPhoto:'Fasada Palazzo Ferretti: najelegantszy zakątek renesansowy.',
              itTime:'1–2 ore.',enTime:'1–2 hours.',deTime:'1–2 Stunden.',plTime:'1–2 godziny.',
              dist:'🚶 150 m – 2 min', mapQuery:'Museo Archeologico Nazionale Marche Ancona', lat:43.6234656, lng:13.5109808 },

            { order:10, name:'Cattedrale di San Ciriaco', emoji:'⛪', photo:'duomo-san-ciriaco.jpg',
              it:'La Cattedrale di San Ciriaco è il simbolo assoluto di Ancona e il luogo che meglio rappresenta l\'anima della città.',
              en:'The Cathedral of San Ciriaco is Ancona\'s absolute symbol, the place that best represents the city\'s soul.',
              de:'Die Kathedrale San Ciriaco ist das absolute Symbol Anconas und der Ort, der die Seele der Stadt am besten verkörpert.',
              pl:'Katedra San Ciriaco to absolutny symbol Ankony i miejsce, które najlepiej oddaje duszę miasta.',
              itLong:'<p>Sorge sulla sommità del Colle Guasco, in una posizione straordinaria che domina il porto, il centro storico e l\'intero tratto di costa adriatica. L\'edificio attuale è il risultato di secoli di storia. Prima ancora della cattedrale, qui sorgeva un tempio dedicato a Venere Euplea, protettrice della navigazione e dei marinai. Alcuni resti delle antiche fondazioni sono ancora oggi visibili.</p><p>Nel VI secolo venne costruita una basilica paleocristiana che, nell\'anno 1000, divenne cattedrale con l\'arrivo delle reliquie di San Ciriaco. La chiesa colpisce per la sua particolare fusione di elementi romanici, bizantini e gotici, che la rendono unica nel panorama italiano. Il portale decorato, la cupola e l\'atmosfera raccolta degli interni raccontano oltre mille anni di storia religiosa e civile.</p><p>All\'esterno vi attende uno dei panorami più spettacolari delle Marche. Nelle giornate limpide lo sguardo abbraccia il porto, il Monte Conero e l\'intera baia di Ancona, offrendo una vista che da sola vale la salita.</p>',
              enLong:'<p>It stands on the summit of the Guasco Hill in an extraordinary position dominating the port, the historic centre and the entire stretch of Adriatic coast. The current building is the result of centuries of history. Before the cathedral, a temple dedicated to Venus Euplea, protector of navigation and sailors, stood here. Some remains of the ancient foundations are still visible today.</p><p>In the 6th century an Early Christian basilica was built here, which in the year 1000 became a cathedral with the arrival of the relics of Saint Cyriacus. The church impresses with its particular fusion of Romanesque, Byzantine and Gothic elements, making it unique on the Italian scene. The decorated portal, the dome and the intimate atmosphere of the interior tell over a thousand years of religious and civil history.</p><p>Outside, one of the most spectacular views in the Marche awaits. On clear days the view takes in the port, Monte Conero and the entire bay of Ancona, a view alone worth the climb.</p>',
              deLong:'<p>Sie steht auf dem Gipfel des Colle Guasco, in außergewöhnlicher Lage über Hafen, Altstadt und der gesamten Adriaküste. Vor der Kathedrale stand hier ein Tempel der Venus Euplea, Beschützerin der Schifffahrt und der Seeleute; einige antike Fundamentreste sind noch sichtbar.</p><p>Im 6. Jahrhundert entstand hier eine frühchristliche Basilika, die im Jahr 1000 mit der Ankunft der Reliquien des Heiligen Cyriacus zur Kathedrale wurde. Die Kirche beeindruckt durch ihre besondere Verschmelzung romanischer, byzantinischer und gotischer Elemente.</p><p>Draußen erwartet Sie eines der spektakulärsten Panoramen der Marken, mit Blick auf Hafen, Monte Conero und die gesamte Bucht von Ancona.</p>',
              plLong:'<p>Wznosi się na szczycie wzgórza Guasco, w niezwykłym położeniu górującym nad portem, starówką i całym pasmem wybrzeża Adriatyku. Przed katedrą stała tu świątynia Wenus Euplei, opiekunki żeglugi i marynarzy; niektóre pozostałości antycznych fundamentów są nadal widoczne.</p><p>W VI wieku zbudowano tu wczesnochrześcijańską bazylikę, która w roku 1000 stała się katedrą wraz z przybyciem relikwii św. Cyriaka. Kościół zachwyca szczególnym połączeniem elementów romańskich, bizantyjskich i gotyckich.</p><p>Na zewnątrz czeka jedna z najbardziej spektakularnych panoram Marchii, z widokiem na port, Monte Conero i całą zatokę Ankony.</p>',
              itNote:'Uscite sul lato orientale: la vista sul porto e sul mare è tra le più belle dell\'Adriatico.',
              enNote:'Exit on the eastern side: the view over the port and sea is among the finest on the Adriatic.',
              deNote:'Ostseite: Blick über Hafen und Meer, einer der schönsten der Adria.',
              plNote:'Wschodnia strona: widok na port i morze należy do najpiękniejszych.',
              itPhoto:'Dal belvedere orientale con la cupola in primo piano e il porto sotto.',
              enPhoto:'From the eastern belvedere with the dome in front and the port below.',
              dePhoto:'Östlicher Aussichtspunkt mit Kuppel und Hafen.',
              plPhoto:'Wschodni belweder z kopułą i portem.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚶 400 m – 6 min', mapQuery:'Cattedrale San Ciriaco Ancona', lat:43.6251216, lng:13.5100370 },

            { order:11, name:'Anfiteatro Romano', emoji:'🏟️', photo:'anfiteatro-romano.jpg',
              it:'Pochi visitatori immaginano che sotto le strade e gli edifici del centro storico si nasconda uno dei più importanti siti archeologici della città.',
              en:'Few visitors imagine that beneath the streets and buildings of the historic centre lies one of the city\'s most important archaeological sites.',
              de:'Nur wenige Besucher ahnen, dass sich unter den Straßen und Gebäuden der Altstadt eine der wichtigsten archäologischen Stätten der Stadt verbirgt.',
              pl:'Niewielu zwiedzających wyobraża sobie, że pod ulicami i budynkami centrum historycznego kryje się jedno z najważniejszych stanowisk archeologicznych miasta.',
              itLong:'<p>L\'Anfiteatro Romano, costruito a picco sul mare tra il I e il II secolo d.C., poteva ospitare migliaia di spettatori ed era il principale luogo dedicato agli spettacoli pubblici dell\'antica Ancona. Qui si svolgevano rappresentazioni teatrali, eventi pubblici e celebrazioni che coinvolgevano l\'intera comunità cittadina. Nel corso dei secoli l\'anfiteatro venne progressivamente inglobato dalle costruzioni successive, fino a scomparire quasi completamente alla vista.</p><p>In quell\'area in epoca recente sorgeva il carcere della città, distrutto da un forte terremoto nel 1972. I lavori di rimozione delle macerie hanno fatto riemergere i resti dell\'antico anfiteatro romano, e i successivi scavi archeologici hanno riportato alla luce parte delle gradinate e delle strutture originarie, permettendo di comprendere le dimensioni e l\'importanza di questo complesso monumentale.</p>',
              enLong:'<p>The Roman Amphitheatre, built high above the sea between the 1st and 2nd centuries AD, could hold thousands of spectators and was the main venue for public spectacles in ancient Ancona. Theatrical performances, public events and celebrations involving the whole city community took place here. Over the centuries the amphitheatre was gradually absorbed by later buildings, until it almost completely disappeared from view.</p><p>In more recent times the city prison stood on that spot, destroyed by a powerful earthquake in 1972. The rubble-clearing works brought the remains of the ancient Roman amphitheatre back to light, and subsequent archaeological excavations uncovered part of the original tiers and structures, revealing the size and importance of this monumental complex.</p>',
              deLong:'<p>Das zwischen dem 1. und 2. Jahrhundert n. Chr. hoch über dem Meer erbaute Römische Amphitheater konnte Tausende von Zuschauern aufnehmen und war der wichtigste Ort für öffentliche Spektakel im antiken Ancona.</p><p>In jüngerer Zeit stand dort das Stadtgefängnis, das 1972 durch ein starkes Erdbeben zerstört wurde. Die Aufräumarbeiten brachten die Überreste des antiken römischen Amphitheaters wieder ans Licht.</p>',
              plLong:'<p>Amfiteatr Rzymski, zbudowany wysoko nad morzem między I a II wiekiem n.e., mógł pomieścić tysiące widzów i był głównym miejscem publicznych widowisk starożytnej Ankony.</p><p>W nowszych czasach stało tam więzienie miejskie, zniszczone przez silne trzęsienie ziemi w 1972 roku. Prace przy usuwaniu gruzu przywróciły do życia pozostałości starożytnego rzymskiego amfiteatru.</p>',
              itNote:'Immaginatevi le gradinate piene: l\'acustica era progettata per portare la voce fino all\'ultimo posto.',
              enNote:'Imagine the tiers full: acoustics were designed to carry voices to the last seat.',
              deNote:'Volle Ränge vorstellen: Akustik für Stimmen bis zum letzten Platz.',
              plNote:'Wyobraźcie pełne trybuny: akustyka przenosiła głos do ostatniego miejsca.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 200 m – 3 min', mapQuery:'Anfiteatro Romano Ancona', lat:43.6247408, lng:13.5117513 },

            { order:12, name:'Chiesa del Gesù', emoji:'⛪', photo:'chiesa-gesu.jpg',
              it:'Monumento commissionato dal conte Nappi nel 1605.',
              en:'Monument commissioned by Count Nappi in 1605.',
              de:'Monument, das 1605 von Graf Nappi in Auftrag gegeben wurde.',
              pl:'Monument zamówiony przez hrabiego Nappi w 1605 roku.',
              itLong:'<p>Nel 1733 i Gesuiti affidarono a Luigi Vanvitelli il progetto dell\'ampliamento della chiesa realizzato con la facciata concava che richiama la forma del porto.</p><p>Continuando a scendere per via Pizzecolli, una delle più antiche vie della città, si raggiunge piazza San Francesco, ove si erge l\'omonima chiesa.</p>',
              enLong:'<p>In 1733 the Jesuits entrusted Luigi Vanvitelli with the project for the enlargement of the church, carried out with a concave façade that echoes the shape of the harbour.</p><p>Continuing down Via Pizzecolli, one of the oldest streets in the city, you reach Piazza San Francesco, where the church of the same name stands.</p>',
              deLong:'<p>1733 beauftragten die Jesuiten Luigi Vanvitelli mit dem Erweiterungsprojekt der Kirche, das mit einer konkaven Fassade ausgeführt wurde, die die Form des Hafens widerspiegelt.</p><p>Weiter die Via Pizzecolli hinunter, eine der ältesten Straßen der Stadt, erreichen Sie die Piazza San Francesco, wo die gleichnamige Kirche steht.</p>',
              plLong:'<p>W 1733 roku Jezuici powierzyli Luigiemu Vanvitellemu projekt rozbudowy kościoła, zrealizowany z wklęsłą fasadą nawiązującą do kształtu portu.</p><p>Kontynuując w dół Via Pizzecolli, jedną z najstarszych ulic miasta, docieramy do Piazza San Francesco, gdzie wznosi się kościół o tej samej nazwie.</p>',
              dist:'🚶 600 m – 8 min', mapQuery:'Chiesa del Gesù Ancona', lat:43.6226099, lng:13.5111676 },

            { order:13, name:'San Francesco alle Scale', emoji:'⛪', photo:'san-francesco-scale.jpg',
              it:'Dall\'alto di una gradinata, la Chiesa di San Francesco delle Scale prospetta su Piazza San Francesco, con un notevole effetto scenografico.',
              en:'From the top of a flight of steps, the Church of San Francesco delle Scale overlooks Piazza San Francesco, with a remarkable scenic effect.',
              de:'Von der Spitze einer Treppe überblickt die Kirche San Francesco delle Scale die Piazza San Francesco mit bemerkenswerter szenischer Wirkung.',
              pl:'Ze szczytu schodów kościół San Francesco delle Scale góruje nad Piazza San Francesco, tworząc niezwykły efekt scenograficzny.',
              itLong:'<p>Facciata con magnifico portale gotico-veneziano a forma di tabernacolo, realizzato in pietra di Brioni da Giorgio da Sebenico, alla metà del Quattrocento (1455). All\'interno opere notevoli, dal Lotto a Tibaldi.</p><p>Scendendo per via Pizzecolli si arriva alla Pinacoteca civica.</p>',
              enLong:'<p>Façade with a magnificent Venetian-Gothic tabernacle-shaped portal, made of Brioni stone by Giorgio da Sebenico in the mid-15th century (1455). Inside, notable works from Lotto to Tibaldi.</p><p>Descending Via Pizzecolli you reach the Civic Art Gallery (Pinacoteca civica).</p>',
              deLong:'<p>Fassade mit einem prächtigen venezianisch-gotischen Portal in Form eines Tabernakels, gefertigt aus Brioni-Stein von Giorgio da Sebenico Mitte des 15. Jahrhunderts (1455). Im Inneren bedeutende Werke von Lotto bis Tibaldi.</p><p>Über die Via Pizzecolli gelangt man zur Städtischen Pinakothek (Pinacoteca civica).</p>',
              plLong:'<p>Fasada ze wspaniałym wenecko-gotyckim portalem w kształcie tabernakulum, wykonanym z kamienia z Brioni przez Giorgio da Sebenico w połowie XV wieku (1455). We wnętrzu znakomite dzieła, od Lotta po Tibaldiego.</p><p>Schodząc Via Pizzecolli, docieramy do Pinakoteki Miejskiej (Pinacoteca civica).</p>',
              dist:'🚶 450 m – 6 min', mapQuery:'Chiesa di San Francesco alle Scale Ancona', lat:43.6214786, lng:13.5118841 },

            { order:14, name:'Pinacoteca Civica F. Podesti', emoji:'🖼️', photo:'',
              it:'Pinacoteca civica con opere di importanti autori tra cui Tiziano, Lotto, Crivelli, Guercino.',
              en:'Civic art gallery with works by important artists including Titian, Lotto, Crivelli, Guercino.',
              de:'Städtische Gemäldegalerie mit Werken bedeutender Künstler wie Tizian, Lotto, Crivelli, Guercino.',
              pl:'Miejska pinakoteka z dziełami ważnych artystów, m.in. Tycjana, Lotta, Crivellego, Guercina.',
              itLong:'<p>Continuando si passa per il cinquecentesco Arco del Rastrello e si arriva in Piazza del Plebiscito.</p>',
              enLong:'<p>Continuing, you pass through the 16th-century Arco del Rastrello and reach Piazza del Plebiscito.</p>',
              deLong:'<p>Weiter geht es durch den Arco del Rastrello aus dem 16. Jahrhundert zur Piazza del Plebiscito.</p>',
              plLong:'<p>Idąc dalej, przechodzimy przez XVI-wieczny Arco del Rastrello i docieramy na Piazza del Plebiscito.</p>',
              dist:'🚶 300 m – 4 min', mapQuery:'Pinacoteca Civica Podesti Ancona', lat:43.6208333, lng:13.5122222 },

            { order:'14-bis', name:'Palazzo del Governo', emoji:'🏛️', photo:'',
              it:'Affacciato su Piazza del Plebiscito, è uno degli edifici simbolo della storia civile di Ancona.',
              itLong:'<p>Nato nella seconda metà del Trecento, fu ampliato nel Quattrocento e nel 1484 Francesco di Giorgio Martini ne ridisegnò l\'architettura in forme rinascimentali.</p><p>Entrando nel cortile si incontrano due archi ogivali appartenenti alla costruzione più antica e una curiosa testimonianza della vita quotidiana della città: i campioni delle antiche misure ufficiali per mattone, coppo, braccio e piede. Servivano per controllare che materiali e merci rispettassero gli standard stabiliti dalla città. Oggi il palazzo è sede della Prefettura.</p>',
              en:'Facing Piazza del Plebiscito, it is one of the landmark buildings of Ancona\'s civic history.',
              enLong:'<p>Built in the second half of the 14th century, it was enlarged in the 15th century, and in 1484 Francesco di Giorgio Martini redesigned its architecture in Renaissance forms.</p><p>Entering the courtyard you find two pointed arches from the older construction and a curious testimony to the city\'s everyday life: the official standard measures for brick, roof tile, arm\'s length (braccio) and foot (piede), used to check that materials and goods met the standards set by the city. Today the palace is the seat of the Prefecture.</p>',
              de:'Am Piazza del Plebiscito gelegen, ist er eines der symbolträchtigen Gebäude der Zivilgeschichte Anconas.',
              deLong:'<p>In der zweiten Hälfte des 14. Jahrhunderts erbaut, wurde er im 15. Jahrhundert erweitert, und 1484 gestaltete Francesco di Giorgio Martini seine Architektur in Renaissanceformen um.</p><p>Im Innenhof trifft man auf zwei Spitzbögen des älteren Baus und ein kurioses Zeugnis des Alltagslebens der Stadt: die amtlichen Vergleichsmaße für Ziegel, Dachziegel, Elle (braccio) und Fuß (piede), mit denen kontrolliert wurde, ob Materialien und Waren den städtischen Normen entsprachen. Heute ist der Palast Sitz der Präfektur.</p>',
              pl:'Stojący przy Piazza del Plebiscito, to jeden z symbolicznych budynków cywilnej historii Ankony.',
              plLong:'<p>Zbudowany w drugiej połowie XIV wieku, został rozbudowany w XV wieku, a w 1484 roku Francesco di Giorgio Martini przeprojektował jego architekturę w formach renesansowych.</p><p>Wchodząc na dziedziniec, można zobaczyć dwa ostrołukowe łuki należące do starszej budowli oraz ciekawe świadectwo codziennego życia miasta: oficjalne wzorce miar dla cegły, dachówki, łokcia (braccio) i stopy (piede), służące do sprawdzania, czy materiały i towary spełniają standardy ustalone przez miasto. Dziś pałac jest siedzibą Prefektury.</p>',
              dist:'🚶 300 m – 4 min', mapQuery:'Palazzo del Governo Piazza del Plebiscito Ancona', lat:43.6197818, lng:13.5110925 },

            { order:15, name:'Piazza del Plebiscito (Piazza del Papa)', emoji:'🗿', photo:'piazza-plebiscito.jpg',
              it:'Conosciuta da tutti gli anconetani come Piazza del Papa, è uno degli angoli più eleganti e vivaci del centro storico. Il suo nome popolare deriva dalla monumentale statua di Papa Clemente XII, collocata al centro della piazza per celebrare il pontefice che concesse ad Ancona il prestigioso status di Porto Franco.',
              en:'Known to all Ancona locals as Piazza del Papa, it is one of the most elegant and lively corners of the historic centre. Its popular name comes from the monumental statue of Pope Clement XII, placed at the centre of the square to celebrate the pontiff who granted Ancona the prestigious status of Free Port.',
              de:'Von allen Bewohnern Anconas als Piazza del Papa bekannt, einer der elegantesten und lebendigsten Ecken der Altstadt. Der volkstümliche Name stammt von der monumentalen Statue Papst Klemens\' XII., der Ancona den Freihafenstatus verlieh.',
              pl:'Znana wszystkim mieszkańcom Ankony jako Piazza del Papa, to jeden z najbardziej eleganckich i tętniących życiem zakątków centrum historycznego. Popularna nazwa pochodzi od monumentalnego posągu papieża Klemensa XII, który nadał Ankonie status Wolnego Portu.',
              itLong:'<p>Realizzata tra il XVII e il XVIII secolo, Piazza del Plebiscito deve il suo nome popolare alla statua di Papa Clemente XII, collocata al centro della piazza nel 1738.</p><p>Intorno alla piazza si concentrano alcuni degli edifici più significativi di Ancona. La monumentale Chiesa di San Domenico, progettata da Carlo Marchionni, custodisce la Crocifissione di Tiziano, uno dei capolavori artistici più importanti della città.</p><p>Si affacciano inoltre il Palazzo del Governo, sede della Prefettura, riconoscibile per la sua caratteristica torre con l\'orologio, e il Palazzo Mengoni Ferretti, che ospita la storica Biblioteca Comunale Luciano Benincasa, custode di un prezioso patrimonio di manoscritti, carte nautiche e volumi antichi.</p><p>Oggi Piazza del Papa è uno dei principali luoghi di ritrovo di Ancona per la presenza di ristoranti e locali che, con i loro tavolini all\'aperto, la rendono particolarmente animata nelle ore serali.</p><p>Da qui, passando per la caratteristica Via degli Orefici, si raggiunge Corso Mazzini, una delle vie più animate di Ancona, chiamato dagli anconetani anche Corso Vecchio per distinguerlo dal "nuovo" Corso Garibaldi.</p>',
              enLong:'<p>Built between the 17th and 18th centuries, Piazza del Plebiscito owes its popular name to the statue of Pope Clement XII, placed at the centre of the square in 1738.</p><p>Some of Ancona\'s most significant buildings surround the square. The monumental Church of San Domenico, designed by Carlo Marchionni, houses Titian\'s Crucifixion, one of the city\'s most important artistic masterpieces.</p><p>Also facing the square are the Palazzo del Governo, seat of the Prefecture, recognisable by its distinctive clock tower, and the Palazzo Mengoni Ferretti, home to the historic Luciano Benincasa Municipal Library, keeper of a precious heritage of manuscripts, nautical charts and antique volumes.</p><p>Today Piazza del Papa is one of Ancona\'s main gathering spots thanks to its restaurants and bars, whose outdoor tables make it especially lively in the evenings.</p><p>From here, through the characteristic Via degli Orefici, you reach Corso Mazzini, one of Ancona\'s liveliest streets, called by locals "Corso Vecchio" to distinguish it from the "new" Corso Garibaldi.</p>',
              deLong:'<p>Zwischen dem 17. und 18. Jahrhundert entstanden, verdankt die Piazza del Plebiscito ihren volkstümlichen Namen der 1738 in der Platzmitte aufgestellten Statue Papst Klemens\' XII.</p><p>Rund um den Platz liegen einige der bedeutendsten Gebäude Anconas: die monumentale Kirche San Domenico mit der Kreuzigung von Tizian, der Palazzo del Governo mit seinem markanten Uhrturm und der Palazzo Mengoni Ferretti mit der historischen Stadtbibliothek Luciano Benincasa.</p><p>Heute ist die Piazza del Papa dank ihrer Restaurants und Lokale mit Tischen im Freien einer der beliebtesten Treffpunkte Anconas, besonders am Abend.</p><p>Von hier führt die Via degli Orefici zum Corso Mazzini, den die Anconitaner auch "Corso Vecchio" nennen, um ihn vom "neuen" Corso Garibaldi zu unterscheiden.</p>',
              plLong:'<p>Powstały między XVII a XVIII wiekiem, Piazza del Plebiscito zawdzięcza swoją popularną nazwę posągowi papieża Klemensa XII, ustawionemu na środku placu w 1738 roku.</p><p>Wokół placu skupiają się jedne z najważniejszych budynków Ankony: monumentalny kościół San Domenico z Ukrzyżowaniem Tycjana, Palazzo del Governo z charakterystyczną wieżą zegarową oraz Palazzo Mengoni Ferretti z historyczną Biblioteką Miejską im. Luciano Benincasy.</p><p>Dziś Piazza del Papa jest jednym z głównych miejsc spotkań w Ankonie dzięki restauracjom i lokalom z stolikami na świeżym powietrzu, szczególnie ożywionym wieczorami.</p><p>Stąd, przez charakterystyczną Via degli Orefici, dociera się do Corso Mazzini, zwanego przez mieszkańców "Corso Vecchio", by odróżnić go od "nowego" Corso Garibaldi.</p>',
              itNote:'La statua di Papa Clemente XII · La Chiesa di San Domenico e la Crocifissione di Tiziano · La torre dell\'orologio del Palazzo del Governo · Il Palazzo Mengoni Ferretti e la Biblioteca Comunale Luciano Benincasa · L\'atmosfera della piazza nelle ore serali.',
              enNote:'The statue of Pope Clement XII · The Church of San Domenico and Titian\'s Crucifixion · The clock tower of the Palazzo del Governo · The Palazzo Mengoni Ferretti and the Luciano Benincasa Municipal Library · The atmosphere of the square in the evening.',
              deNote:'Die Statue Papst Klemens\' XII. · Die Kirche San Domenico mit der Kreuzigung von Tizian · Der Uhrturm des Palazzo del Governo · Der Palazzo Mengoni Ferretti und die Stadtbibliothek Luciano Benincasa · Die Abendatmosphäre auf dem Platz.',
              plNote:'Posąg papieża Klemensa XII · Kościół San Domenico i Ukrzyżowanie Tycjana · Wieża zegarowa Palazzo del Governo · Palazzo Mengoni Ferretti i Biblioteka Miejska Luciano Benincasy · Wieczorna atmosfera placu.',
              itPhoto:'Dal lato di Corso Garibaldi con la statua e il Palazzo del Governo.',
              enPhoto:'From the Corso Garibaldi side with the statue and Palazzo del Governo.',
              dePhoto:'Vom Corso Garibaldi mit Statue und Palazzo del Governo.',
              plPhoto:'Od Corso Garibaldi z posągiem.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 50 m – 1 min', mapQuery:'Piazza del Plebiscito Ancona', lat:43.6195337, lng:13.5116510 },

            { order:16, name:'Corso Garibaldi', emoji:'🚶', photo:'',
              it:'Corso Garibaldi è il salotto di Ancona.',
              en:'Corso Garibaldi is Ancona\'s drawing room.',
              de:'Corso Garibaldi ist der Salon von Ancona.',
              pl:'Corso Garibaldi to salon Ankony.',
              itLong:'<p>Questa ampia strada pedonale collega Piazza Cavour al porto ed è percorsa ogni giorno da residenti, studenti e visitatori. Passeggiando tra eleganti palazzi ottocenteschi si incontrano boutique, librerie, negozi storici, caffetterie e gelaterie che rendono il corso il luogo ideale per vivere il ritmo quotidiano della città.</p><p>Lungo il percorso si percepisce il carattere autentico di Ancona: una città che non vive solo di turismo, ma conserva una forte identità locale fatta di commercio, incontri e tradizioni.</p><p>È la passeggiata perfetta per chi desidera osservare la vita cittadina, fare acquisti o semplicemente concedersi un buon caffè. Dalle 18 alle 20 è la tradizionale ora dello "struscio", cioè percorrere ripetutamente su e giù per il corso — chiamato anche "fare le vasche" — per chiacchierare e guardare chi passa.</p><p>Guardando i portoni dei palazzi storici, si possono notare piccoli manufatti di ferro quasi dimenticati: i nettascarpe, detti anche grattascarponi. Erano semplici lame fissate accanto all\'ingresso, utilizzate per raschiare dalle suole il fango e la terra prima di entrare. Diffusi soprattutto tra Settecento e Ottocento, erano una presenza comune quando le strade non erano ancora asfaltate. Oggi sono piccoli frammenti di archeologia urbana, spesso conservati proprio dove svolgevano la loro funzione.</p>',
              enLong:'<p>This wide pedestrian street connects Piazza Cavour to the port and is walked every day by residents, students and visitors. Strolling among elegant 19th-century buildings you\'ll find boutiques, bookshops, historic shops, cafés and ice cream parlours that make the street the ideal place to experience the city\'s daily rhythm.</p><p>Along the way you sense Ancona\'s authentic character: a city that doesn\'t live on tourism alone, but keeps a strong local identity built on commerce, encounters and tradition.</p><p>It\'s the perfect walk for people-watching, shopping, or simply enjoying a good coffee. From 6 to 8pm is the traditional "struscio" hour — strolling up and down the street, also called "fare le vasche" (doing laps), to chat and watch the world go by.</p><p>Looking at the doorways of historic buildings, you can spot small, almost forgotten iron fittings: boot scrapers, simple blades fixed beside the entrance and used to scrape mud and dirt off soles before stepping inside. Common above all between the 18th and 19th centuries, they were an everyday presence when streets were not yet paved. Today they are small fragments of urban archaeology, often preserved exactly where they once did their job.</p>',
              deLong:'<p>Diese breite Fußgängerstraße verbindet die Piazza Cavour mit dem Hafen und wird täglich von Einwohnern, Studenten und Besuchern begangen. Zwischen eleganten Gebäuden aus dem 19. Jahrhundert findet man Boutiquen, Buchhandlungen, historische Geschäfte, Cafés und Eisdielen.</p><p>Entlang des Weges spürt man den authentischen Charakter Anconas: eine Stadt, die nicht nur vom Tourismus lebt, sondern eine starke lokale Identität bewahrt.</p><p>Von 18 bis 20 Uhr ist die traditionelle Stunde des "struscio" — das wiederholte Auf- und Abgehen der Straße.</p><p>Ein Blick auf die Eingangstüren historischer Gebäude offenbart kleine, fast vergessene Eisenobjekte: Schuhabstreifer, einfache Klingen neben dem Eingang, mit denen man vor dem Betreten Schlamm und Erde von den Sohlen kratzte. Vor allem zwischen dem 18. und 19. Jahrhundert verbreitet, waren sie alltäglich, als die Straßen noch nicht asphaltiert waren. Heute sind sie kleine Fragmente städtischer Archäologie, oft genau dort erhalten, wo sie einst ihren Zweck erfüllten.</p>',
              plLong:'<p>Ta szeroka piesza ulica łączy Piazza Cavour z portem i jest codziennie uczęszczana przez mieszkańców, studentów i turystów. Wśród eleganckich XIX-wiecznych budynków znajdują się butiki, księgarnie, historyczne sklepy, kawiarnie i lodziarnie.</p><p>Wzdłuż trasy wyczuwa się autentyczny charakter Ankony: miasta, które nie żyje tylko z turystyki, lecz zachowuje silną lokalną tożsamość.</p><p>Od 18 do 20 to tradycyjna godzina "struscio" — spacerowania tam i z powrotem ulicą.</p><p>Patrząc na bramy historycznych kamienic, można zauważyć małe, niemal zapomniane żelazne przedmioty: skrobaczki do butów, proste ostrza umieszczone przy wejściu, służące do usuwania błota i ziemi z podeszwy przed wejściem do środka. Rozpowszechnione zwłaszcza między XVIII a XIX wiekiem, były codziennym elementem, gdy ulice nie były jeszcze wybrukowane. Dziś są małymi fragmentami miejskiej archeologii, często zachowanymi dokładnie tam, gdzie kiedyś pełniły swoją funkcję.</p>',
              itNote:'Bar Torino al n. 66, aperto dal 1921: l\'aperitivo serale sul marciapiede è un rito irrinunciabile.',
              enNote:'Bar Torino at no. 66, open since 1921: the evening aperitif on the pavement is an unmissable ritual.',
              deNote:'Bar Torino Nr. 66, seit 1921: Aperitif auf dem Bürgersteig.',
              plNote:'Bar Torino nr 66, od 1921: aperitif na chodniku.',
              itTime:'15–20 minuti di passeggiata.',enTime:'15–20 min walking.',deTime:'15–20 Min. Spaziergang.',plTime:'15–20 min spaceru.',
              dist:'🚶 300 m – 4 min', mapQuery:'Corso Garibaldi Ancona', lat:43.617938, lng:13.512813 },

            { order:17, name:'Piazza Cavour', emoji:'🌳', photo:'',
              it:'Realizzata nella seconda metà dell\'Ottocento, Piazza Cavour rappresenta il principale spazio monumentale della città moderna.',
              en:'Built in the second half of the 19th century, Piazza Cavour is the main monumental space of the modern city.',
              de:'In der zweiten Hälfte des 19. Jahrhunderts entstanden, ist die Piazza Cavour der wichtigste Monumentalplatz der modernen Stadt.',
              pl:'Powstały w drugiej połowie XIX wieku, Piazza Cavour to główna przestrzeń monumentalna nowoczesnego miasta.',
              itLong:'<p>Ampia, elegante e ricca di aree verdi, costituisce il collegamento naturale tra il centro storico e il quartiere del Passetto. Al centro si erge il monumento dedicato a Camillo Benso Conte di Cavour, protagonista del processo di unificazione italiana, circondato da giardini curati che nelle belle giornate diventano punto di ritrovo per famiglie, studenti e residenti.</p>',
              enLong:'<p>Wide, elegant and rich in green areas, it forms the natural link between the historic centre and the Passetto district. At its centre stands the monument to Count Camillo Benso di Cavour, a leading figure of Italian unification, surrounded by well-kept gardens that on sunny days become a gathering spot for families, students and residents.</p>',
              deLong:'<p>Weitläufig, elegant und reich an Grünflächen, bildet sie die natürliche Verbindung zwischen der Altstadt und dem Stadtteil Passetto. In ihrer Mitte erhebt sich das Denkmal für Camillo Benso Conte di Cavour, umgeben von gepflegten Gärten.</p>',
              plLong:'<p>Rozległy, elegancki i pełen zieleni plac stanowi naturalne połączenie między centrum historycznym a dzielnicą Passetto. W jego centrum wznosi się pomnik Camillo Benso Conte di Cavour, otoczony zadbanymi ogrodami.</p>',
              itNote:'Le prospettive alberate creano corridoi visivi unici: fermatevi al centro.',
              enNote:'Tree-lined perspectives create unique visual corridors: stop at the centre.',
              deNote:'Baumalleen: einzigartige Sichtkorridore.',
              plNote:'Aleje drzew: unikalne korytarze widokowe.',
              itTime:'10 minuti.',enTime:'10 minutes.',deTime:'10 Minuten.',plTime:'10 minut.',
              dist:'🚶 550 m – 7 min', mapQuery:'Piazza Cavour Ancona', lat:43.616938, lng:13.516813 },

            { order:18, name:'Viale della Vittoria', emoji:'🌲', photo:'',
              it:'Viale della Vittoria è uno dei percorsi più piacevoli di Ancona.',
              en:'Viale della Vittoria is one of Ancona\'s most pleasant routes.',
              de:'Viale della Vittoria ist einer der angenehmsten Wege Anconas.',
              pl:'Viale della Vittoria to jedna z najprzyjemniejszych tras w Ankonie.',
              itLong:'<p>Il lungo viale alberato collega Piazza Cavour al Passetto ed è considerato dagli anconetani una delle passeggiate più belle della città. Gli eleganti edifici storici, i giardini e i filari di tigli creano un ambiente tranquillo e ombreggiato, perfetto per raggiungere il mare a piedi in ogni periodo dell\'anno.</p><p>Durante il tragitto si incontrano caffè, gelaterie e locali dove fermarsi per una pausa, mentre l\'aria marina si fa sempre più intensa avvicinandosi alla costa.</p><p>Alla fine del viale compare uno dei panorami più spettacolari dell\'Adriatico: la monumentale scalinata del Passetto e la circostante falesia a picco sul mare.</p>',
              enLong:'<p>The long tree-lined avenue connects Piazza Cavour to the Passetto, considered by locals one of the city\'s finest walks. Elegant historic buildings, gardens and rows of lime trees create a quiet, shaded environment, perfect for reaching the sea on foot at any time of year.</p><p>Along the way you\'ll find cafés, ice cream parlours and spots to pause, while the sea air grows more intense as you approach the coast.</p><p>At the end of the avenue one of the Adriatic\'s most spectacular views appears: the monumental staircase of the Passetto and the surrounding cliff plunging into the sea.</p>',
              deLong:'<p>Die baumgesäumte Allee verbindet die Piazza Cavour mit dem Passetto und gilt als einer der schönsten Spaziergänge der Stadt, gesäumt von eleganten historischen Gebäuden und Lindenreihen.</p><p>Unterwegs findet man Cafés und Eisdielen für eine Pause, während die Meeresluft zur Küste hin immer intensiver wird.</p><p>Am Ende der Allee erscheint einer der spektakulärsten Ausblicke der Adria: die monumentale Treppe des Passetto und die umliegende Klippe.</p>',
              plLong:'<p>Długa aleja obsadzona drzewami łączy Piazza Cavour z Passetto i uchodzi za jeden z najpiękniejszych spacerów w mieście, z eleganckimi historycznymi budynkami i rzędami lip.</p><p>Po drodze znajdują się kawiarnie i lodziarnie na przerwę, podczas gdy morskie powietrze staje się coraz intensywniejsze w miarę zbliżania się do wybrzeża.</p><p>Na końcu alei pojawia się jeden ze spektakularnych widoków Adriatyku: monumentalne schody Passetto i otaczający klif.</p>',
              itNote:'Lungo il viale caffè e gelaterie storiche: una sosta è d\'obbligo prima del mare.',
              enNote:'Historic cafés and ice cream parlours along the way: a stop is a must before the sea.',
              deNote:'Historische Cafés und Eisdielen: Halt vor dem Meer.',
              plNote:'Historyczne kawiarnie i lodziarnie: przystanek przed morzem.',
              itTime:'15 minuti di passeggiata.',enTime:'15 min walking.',deTime:'15 Min. Spaziergang.',plTime:'15 min spaceru.',
              dist:'🚶 1350 m – 18 min', mapQuery:'Viale della Vittoria Ancona', lat:43.615563, lng:13.526063 }
        ],

        passetto: [
            { name:'Monumento ai Caduti', emoji:'🏛️', photo:'passetto.jpg',
              it:'Il Monumento ai Caduti, inaugurato nel 1930 e progettato dall\'architetto Guido Cirilli, è uno dei simboli architettonici più riconoscibili di Ancona.',
              en:'The Monument to the Fallen, inaugurated in 1930 and designed by architect Guido Cirilli, is one of Ancona\'s most recognisable architectural landmarks.',
              de:'Das 1930 eingeweihte Kriegerdenkmal von Architekt Guido Cirilli ist eines der markantesten architektonischen Wahrzeichen Anconas.',
              pl:'Pomnik Poległych, otwarty w 1930 roku według projektu architekta Guido Cirillego, to jeden z najbardziej rozpoznawalnych zabytków architektonicznych Ankony.',
              itLong:'<p>Le sue maestose colonne in pietra bianca si affacciano direttamente sul mare, creando un\'imponente quinta monumentale che domina la falesia del Passetto. Nato per commemorare i caduti della Prima guerra mondiale, è diventato nel tempo uno dei luoghi più rappresentativi della città.</p><p>La sottostante grande terrazza panoramica offre una vista straordinaria sulla costa del Monte Conero, sulle spiagge rocciose e sull\'Adriatico.</p>',
              enLong:'<p>Its majestic white stone columns face directly onto the sea, creating an imposing backdrop dominating the Passetto cliff. Built to commemorate the fallen of the First World War, it has become over time one of the city\'s most representative sites.</p><p>The large panoramic terrace below offers an extraordinary view over the Monte Conero coast, the rocky beaches and the Adriatic.</p>',
              deLong:'<p>Errichtet zum Gedenken an die Gefallenen des Ersten Weltkriegs, dominieren seine majestätischen weißen Säulen die Klippe des Passetto.</p><p>Die darunterliegende große Panoramaterrasse bietet einen außergewöhnlichen Blick auf die Küste des Monte Conero, die Felsstrände und die Adria.</p>',
              plLong:'<p>Wzniesiony ku pamięci poległych I wojny światowej, z majestatycznymi białymi kolumnami dominującymi nad klifem Passetto.</p><p>Rozciągający się poniżej duży panoramiczny taras oferuje niezwykły widok na wybrzeże Monte Conero, skaliste plaże i Adriatyk.</p>',
              itNote:'All\'alba e al tramonto il panorama assume colori particolarmente suggestivi.',
              enNote:'At dawn and sunset the panorama takes on particularly evocative colours.',
              deNote:'Bei Sonnenauf- und -untergang besonders stimmungsvolle Farben.',
              plNote:'O świcie i zachodzie słońca szczególnie sugestywne kolory.',
              itPhoto:'Dal belvedere con le colonne in primo piano e il Monte Conero sullo sfondo.',
              enPhoto:'From the belvedere with the columns in front and Monte Conero behind.',
              dePhoto:'Vom Belvedere mit Säulen und Conero.',
              plPhoto:'Z belwederu z kolumnami i Conero.',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',

            { name:'Grotte del Passetto', emoji:'🕳️', photo:'',
              it:'Le Grotte del Passetto sono uno dei luoghi più iconici e fotografati di Ancona, un perfetto incontro tra la forza della natura e l\'ingegno dell\'uomo.',
              en:'The Passetto grottoes are one of Ancona\'s most iconic and photographed spots, a perfect meeting of natural force and human ingenuity.',
              de:'Die Grotten des Passetto sind einer der ikonischsten und meistfotografierten Orte Anconas, eine perfekte Begegnung zwischen Naturkraft und menschlichem Erfindungsgeist.',
              pl:'Groty Passetto to jedno z najbardziej ikonicznych i fotografowanych miejsc w Ankonie, doskonałe spotkanie siły natury z ludzką pomysłowością.',
              itLong:'<p>Scavate direttamente nella roccia calcarea della falesia a partire dalla fine dell\'Ottocento, queste caratteristiche grotte nacquero come ricovero per le piccole imbarcazioni dei pescatori. Oggi hanno perso la loro funzione originaria e sono utilizzate da molte famiglie anconetane come comodo punto di appoggio attrezzato affacciato direttamente sul mare.</p><p>Ogni grotta è diversa dall\'altra: porte colorate, dettagli personalizzati e piccoli moli raccontano il profondo legame che la città ha sempre avuto con il mare.</p><p>Passeggiando lungo il molo si percepisce un\'atmosfera unica, lontana dal turismo di massa. Il rumore delle onde che si infrangono contro la falesia e il profumo della salsedine rendono questo luogo uno dei più autentici di tutta Ancona.</p><p><b>Curiosità:</b> Nelle giornate di mare calmo l\'acqua assume incredibili sfumature turchesi e smeraldo, regalando uno scenario ideale per fotografie indimenticabili.</p>',
              enLong:'<p>Carved directly into the limestone cliff from the late 19th century, these distinctive caves were originally shelters for small fishing boats. Today they have lost their original function and are used by many Ancona families as a well-equipped seafront retreat.</p><p>Each grotto is different from the next: coloured doors, personalised details and small jetties tell of the deep bond this city has always had with the sea.</p><p>Walking along the pier you sense a unique atmosphere, far from mass tourism. The sound of waves breaking against the cliff and the scent of sea salt make this one of the most authentic spots in all of Ancona.</p><p><b>Curiosity:</b> On calm days the water takes on incredible turquoise and emerald hues, a perfect scene for unforgettable photographs.</p>',
              deLong:'<p>Ab Ende des 19. Jahrhunderts direkt in den Kalkstein der Klippe gehauen, dienten sie ursprünglich als Unterschlupf für Fischerboote. Heute haben sie ihre ursprüngliche Funktion verloren und werden von vielen Familien Anconas als gut ausgestatteter Rückzugsort am Meer genutzt.</p><p>Jede Grotte ist anders: bunte Türen, persönliche Details und kleine Stege erzählen von der tiefen Verbindung der Stadt zum Meer.</p><p>Entlang des Stegs spürt man eine einzigartige Atmosphäre, fernab vom Massentourismus.</p><p><b>Wissenswertes:</b> An ruhigen Tagen nimmt das Wasser unglaubliche türkis- und smaragdgrüne Farbtöne an.</p>',
              plLong:'<p>Wykute bezpośrednio w wapiennym klifie od końca XIX wieku, pierwotnie służyły jako schronienie dla łodzi rybackich. Dziś straciły swoją pierwotną funkcję i są wykorzystywane przez wiele ankońskich rodzin jako wygodne, wyposażone miejsce nad samym morzem.</p><p>Każda grota jest inna: kolorowe drzwi, spersonalizowane detale i małe pomosty opowiadają o głębokiej więzi miasta z morzem.</p><p>Spacerując wzdłuż mola, wyczuwa się wyjątkową atmosferę, z dala od masowej turystyki.</p><p><b>Ciekawostka:</b> W spokojne dni woda przybiera niesamowite odcienie turkusu i szmaragdu.</p>',
              itNote:'Cercate la grotta con la porta azzurra: una delle più fotografate.',
              enNote:'Look for the grotto with the blue door: one of the most photographed.',
