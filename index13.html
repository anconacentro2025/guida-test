            { name:'Spiaggia del Passetto', emoji:'🌊', photo:'passetto.jpg',
              it:'Ai piedi della falesia si trova la Spiaggia del Passetto, uno dei luoghi di mare più amati dagli anconetani.',
              en:'At the foot of the cliff lies the Spiaggia del Passetto, one of Ancona\'s most loved seaside spots.',
              de:'Am Fuße der Klippe liegt die Spiaggia del Passetto, einer der beliebtesten Strände der Anconitaner.',
              pl:'U podnóża klifu znajduje się Spiaggia del Passetto, jedno z najbardziej ukochanych przez mieszkańców Ankony miejsc nad morzem.',
              itNote:'Arrivate la mattina presto per l\'acqua più calma e la spiaggia meno affollata.',
              enNote:'Arrive early morning for the calmest water and fewest people.',
              deNote:'Früh morgens für das ruhigste Wasser.',
              plNote:'Wczesnym rankiem dla spokojniejszej wody.',
              itPhoto:'Dagli scogli al tramonto con la falesia illuminata.',
              enPhoto:'From the rocks at sunset with the illuminated cliff.',
              dePhoto:'Von den Felsen bei Sonnenuntergang.',
              plPhoto:'Ze skał o zachodzie słońca.',
              itLong:'<p>A differenza delle classiche spiagge sabbiose dell\'Adriatico, qui il paesaggio è caratterizzato da grandi scogli bianchi levigati dal mare, acqua limpida e una spettacolare parete rocciosa che protegge la costa. È un ambiente naturale unico, capace di sorprendere chi visita Ancona per la prima volta.</p><p>La trasparenza dell\'acqua rende questo tratto di costa particolarmente apprezzato per il nuoto, lo snorkeling e i bagni durante l\'estate. Nelle prime ore del mattino e al tramonto il luogo assume un\'atmosfera ancora più suggestiva, quando il sole illumina la falesia con sfumature dorate e il mare diventa incredibilmente calmo. Si consigliano scarpe da scoglio, poiché il fondale è prevalentemente roccioso.</p><p>Dalla punta del molo si scorgono gli scogli delle Due Sorelle ai piedi del Conero.</p>',
              enLong:'<p>Unlike classic sandy Adriatic beaches, the landscape here features large white rocks smoothed by the sea, clear water and a spectacular rocky wall protecting the coast. It is a unique natural environment, capable of surprising first-time visitors to Ancona.</p><p>The clarity of the water makes this stretch of coast especially loved for swimming, snorkelling and summer bathing. In the early morning and at sunset the place takes on an even more evocative atmosphere, when the sun lights the cliff with golden hues and the sea becomes incredibly calm. Water shoes are recommended, as the seabed is mostly rocky.</p><p>From the tip of the pier you can spot the Due Sorelle sea stacks at the foot of the Conero.</p>',
              deLong:'<p>Anders als bei klassischen Sandstränden der Adria ist die Landschaft hier von großen, vom Meer glattgeschliffenen weißen Felsen, klarem Wasser und einer spektakulären Felswand geprägt, die die Küste schützt.</p><p>Die Klarheit des Wassers macht diesen Küstenabschnitt besonders beliebt zum Schwimmen und Schnorcheln im Sommer. In den frühen Morgenstunden und bei Sonnenuntergang wird der Ort noch eindrucksvoller. Badeschuhe werden empfohlen, da der Meeresboden überwiegend felsig ist.</p><p>Von der Molenspitze aus sind die Felsnadeln der Due Sorelle am Fuße des Conero zu sehen.</p>',
              plLong:'<p>W przeciwieństwie do klasycznych piaszczystych plaż Adriatyku, krajobraz tutaj charakteryzuje się dużymi białymi skałami wygładzonymi przez morze, czystą wodą i spektakularną skalną ścianą chroniącą wybrzeże.</p><p>Przejrzystość wody sprawia, że ten odcinek wybrzeża jest szczególnie ceniony do pływania i snorkelingu latem. Wczesnym rankiem i o zachodzie słońca miejsce to nabiera jeszcze bardziej sugestywnej atmosfery. Zalecane są buty do wody, ponieważ dno jest w większości skaliste.</p><p>Z końca mola widać skały Due Sorelle u podnóża Conero.</p>',
              itTime:'30 minuti – mezza giornata.',enTime:'30 min – half a day.',deTime:'30 Min. – halber Tag.',plTime:'30 min – pół dnia.',
              dist:'🚶 2200 m – 30 min', mapQuery:'Spiaggia del Passetto Ancona', lat:43.6170514, lng:13.5338282 },
            { name:'Seggiola del Papa', emoji:'🪑', photo:'',
              it:'La Seggiola del Papa è uno degli scorci più suggestivi delle spiagge di Ancona.',
              en:'The Seggiola del Papa is one of the most evocative spots along Ancona\'s beaches.',
              de:'Die Seggiola del Papa ist eine der eindrucksvollsten Ecken der Strände von Ancona.',
              pl:'Seggiola del Papa to jedno z najbardziej sugestywnych miejsc na plażach Ankony.',
              itLong:'<p>Si tratta di una caratteristica formazione rocciosa affacciata sul mare che, per la sua forma, ricorda un grande trono naturale. Situata di fronte alla zona terminale delle grotte del Passetto, su una lunga formazione rocciosa conosciuta dagli anconetani come "il quadrato", è una meta caratteristica molto apprezzata. Da questo punto lo sguardo spazia su un lungo tratto cittadino di falesia.</p>',
              enLong:'<p>It is a distinctive rock formation facing the sea that, due to its shape, resembles a great natural throne. Located opposite the far end of the Passetto grottoes, on a long rock formation known to locals as "il quadrato", it is a much-loved, characteristic destination. From this point the view sweeps over a long stretch of the city\'s cliffs.</p>',
              deLong:'<p>Es handelt sich um eine charakteristische Felsformation am Meer, die durch ihre Form an einen großen natürlichen Thron erinnert. Gegenüber dem Ende der Grotten des Passetto gelegen, auf einer langen Felsformation, die die Anconitaner "il quadrato" nennen, ist sie ein sehr beliebtes Ziel.</p>',
              plLong:'<p>Jest to charakterystyczna formacja skalna nad morzem, która swoim kształtem przypomina wielki naturalny tron. Położona naprzeciwko końcowej części grot Passetto, na długiej formacji skalnej znanej mieszkańcom jako "il quadrato", jest bardzo cenionym celem.</p>',
              itTime:'10–15 minuti.',enTime:'10–15 minutes.',deTime:'10–15 Minuten.',plTime:'10–15 minut.',
              dist:'🚶 2500 m – 34 min', mapQuery:'Seggiola del Papa Ancona', lat:43.6195107, lng:13.5314283 },
            { name:'Ascensore del Passetto', emoji:'🚡', photo:'',
              it:'L\'ascensore del Passetto è il modo più comodo e veloce per scendere dalla pineta che fiancheggia il Monumento ai Caduti direttamente sulla spiaggia sottostante, evitando la lunga scalinata.',
              en:'The Passetto lift is the quickest and most comfortable way down from the pine wood beside the Monument to the Fallen to the beach below, avoiding the long staircase.',
              de:'Der Aufzug des Passetto ist der bequemste und schnellste Weg vom Pinienwald beim Kriegerdenkmal direkt zum darunterliegenden Strand, ohne die lange Treppe.',
              pl:'Winda Passetto to najwygodniejszy i najszybszy sposób, by zejść z sosnowego lasku obok Pomnika Poległych na plażę poniżej, omijając długie schody.',
              itLong:'<p>Dalla sua piattaforma si gode di una vista straordinaria. Costruito negli anni Cinquanta a picco sul mare, questo ascensore panoramico collega il promontorio del Passetto alla costa e alle prime grotte, offrendo durante la discesa una vista mozzafiato sulla spiaggia e sul mare.</p><p>È gestito da Conerobus ed è attivo da aprile a ottobre. Il biglietto andata e ritorno costa 1 euro, con abbonamenti stagionali e mensili disponibili per chi frequenta abitualmente la spiaggia.</p><p>Gli orari variano durante la stagione: in primavera e autunno è aperto dalle 8:00 alle 20:00, mentre in piena estate (luglio e agosto) l\'orario si prolunga fino a mezzanotte, con apertura straordinaria fino all\'1:00 la notte di Ferragosto. Per orari aggiornati, consulta il sito <a href="https://www.conerobus.it" target="_blank" rel="noopener noreferrer">www.conerobus.it</a>.</p>',
              enLong:'<p>From its platform there is an extraordinary view. Built in the 1950s directly above the sea, this panoramic lift connects the Passetto headland to the coast and the first grottoes, offering a breathtaking view of the beach and sea on the way down.</p><p>It is operated by Conerobus and runs from April to October. A return ticket costs €1, with seasonal and monthly passes available for regular beachgoers.</p><p>Hours vary through the season: in spring and autumn it runs 8:00–20:00, while in high summer (July and August) it stays open until midnight, with an extended opening until 1:00 on the night of Ferragosto (15 August). For up-to-date hours, check <a href="https://www.conerobus.it" target="_blank" rel="noopener noreferrer">www.conerobus.it</a>.</p>',
              deLong:'<p>Von seiner Plattform aus genießt man eine außergewöhnliche Aussicht. In den 1950er Jahren am Meer erbaut, verbindet dieser Panoramaaufzug das Passetto-Vorgebirge mit der Küste und den ersten Grotten.</p><p>Betrieben von Conerobus, von April bis Oktober in Betrieb. Rückfahrkarte 1 €, mit Saison- und Monatsabos.</p><p>Öffnungszeiten variieren: Frühling/Herbst 8–20 Uhr, im Hochsommer bis Mitternacht, in der Nacht von Ferragosto (15. August) bis 1 Uhr.</p>',
              plLong:'<p>Z jej platformy roztacza się niezwykły widok. Zbudowana w latach 50. XX wieku nad samym morzem, ta panoramiczna winda łączy przylądek Passetto z wybrzeżem i pierwszymi grotami.</p><p>Obsługiwana przez Conerobus, czynna od kwietnia do października. Bilet powrotny 1 €, dostępne abonamenty sezonowe i miesięczne.</p><p>Godziny zmienne: wiosna/jesień 8–20, w pełni lata do północy, w noc Ferragosto (15 sierpnia) do 1:00.</p>',
              itNote:'Da non perdere la vista dalla piattaforma durante la discesa verso le prime grotte.',
              enNote:'Don\'t miss the view from the platform during the descent towards the first grottoes.',
              deNote:'Der Blick von der Plattform während der Abfahrt zu den ersten Grotten ist ein Muss.',
              plNote:'Nie przegapcie widoku z platformy podczas zjazdu do pierwszych grot.',
              itTime:'2–5 minuti di discesa.',enTime:'2–5 min descent.',deTime:'2–5 Min. Abfahrt.',plTime:'2–5 min zjazdu.',
              dist:'🚶 2050 m – 27 min', mapQuery:'Ascensore del Passetto Ancona', lat:43.6162584, lng:13.5337421 },
            { name:'Grotta Azzurra', emoji:'🫧', photo:'',
              it:'La Grotta Azzurra è una delle calette più suggestive di Ancona, un piccolo gioiello incastonato nella falesia tra il Passetto e il porto, ai piedi del Colle del Cardeto.',
              en:'The Grotta Azzurra is one of Ancona\'s most evocative coves, a small gem set into the cliff between the Passetto and the port, at the foot of the Cardeto hill.',
              de:'Die Grotta Azzurra ist eine der eindrucksvollsten Buchten Anconas, ein kleines Juwel in der Klippe zwischen Passetto und Hafen, am Fuße des Cardeto-Hügels.',
              pl:'Grotta Azzurra to jedna z najbardziej sugestywnych zatoczek Ankony, mały klejnot wciśnięty w klif między Passetto a portem, u podnóża wzgórza Cardeto.',
              itLong:'<p>Prende il nome da una grotta marina scavata nella roccia, dove i riflessi dell\'acqua creano giochi di luce azzurri.</p><p>Questo tratto di costa, caratterizzato dalle tipiche grotte dei pescatori, delimita a sud il litorale del Passetto. La spiaggia è raggiungibile esclusivamente a piedi attraverso uno scenografico sentiero che parte da Via Panoramica, all\'incirca all\'altezza del civico n. 15.</p><p>Il percorso, recentemente oggetto di lavori di messa in sicurezza, si snoda attraverso un piccolo parco costiero e scende al mare tramite una suggestiva scalinata, regalando viste spettacolari sulla falesia.</p>',
              enLong:'<p>It takes its name from a sea cave carved into the rock, where the water\'s reflections create dazzling blue light effects.</p><p>This stretch of coast, dotted with typical fishermen\'s grottoes, marks the southern edge of the Passetto shoreline. The beach is reachable only on foot, via a scenic path starting from Via Panoramica, roughly at house number 15.</p><p>Recently made safer with new works, the path winds through a small coastal park and descends to the sea via an evocative staircase, offering spectacular views of the cliff.</p>',
              deLong:'<p>Sie ist nach einer in den Fels gehauenen Meeresgrotte benannt, in der Wasserreflexe blaue Lichtspiele erzeugen.</p><p>Dieser Küstenabschnitt mit den typischen Fischergrotten bildet die südliche Grenze des Passetto. Der Strand ist nur zu Fuß über einen malerischen Pfad ab der Via Panoramica (etwa Hausnummer 15) erreichbar.</p>',
              plLong:'<p>Nazwę zawdzięcza morskiej grocie wykutej w skale, gdzie odbicia wody tworzą błękitne gry świateł.</p><p>Ten odcinek wybrzeża z typowymi grotami rybackimi wyznacza południową granicę Passetto. Plaża dostępna jest wyłącznie pieszo, malowniczą ścieżką od Via Panoramica (ok. numeru 15).</p>',
              itNote:'Punto di accesso al sentiero: Via Panoramica, civico 15 circa (43.6202488, 13.5287733).',
              enNote:'Path access point: Via Panoramica, around house no. 15 (43.6202488, 13.5287733).',
              deNote:'Zugang zum Pfad: Via Panoramica, etwa Hausnummer 15 (43.6202488, 13.5287733).',
              plNote:'Wejście na ścieżkę: Via Panoramica, ok. numeru 15 (43.6202488, 13.5287733).',
              itTime:'30–45 minuti (sentiero incluso).',enTime:'30–45 minutes (path included).',deTime:'30–45 Minuten (mit Pfad).',plTime:'30–45 minut (ze ścieżką).',
              dist:'🚶 2450 m – 32 min', mapQuery:'Grotta Azzurra Ancona', lat:43.6217213, lng:13.5274462 }
        ],

            { order:4, name:'Cimitero Ebraico (Campo degli Ebrei)', emoji:'✡️', photo:'',
              it:'Un luogo di straordinario valore storico e culturale.',
              en:'A place of extraordinary historical and cultural value.',
              de:'Ein Ort von außergewöhnlichem historischem und kulturellem Wert.',
              pl:'Miejsce o niezwykłej wartości historycznej i kulturowej.',
              itLong:'<p>Vi si trovano 178 cippi funerari con iscrizioni ebraiche che datano dal XV al XIX secolo: tra i cimiteri ebraici più grandi e meglio conservati d\'Europa.</p><p>Passeggiando tra le antiche lapidi immerse nel verde si respira un\'atmosfera di grande tranquillità e rispetto: un\'occasione per conoscere un aspetto meno noto di Ancona, ma fondamentale per comprenderne la storia e l\'identità multiculturale.</p>',
              enLong:'<p>It contains 178 gravestones with Hebrew inscriptions dating from the 15th to the 19th century, among the largest and best preserved Jewish cemeteries in Europe.</p><p>Walking among the ancient gravestones set in greenery, you breathe an atmosphere of great tranquillity and respect — a chance to discover a lesser-known side of Ancona, fundamental to understanding its history and multicultural identity.</p>',
              deLong:'<p>178 Grabsteine mit hebräischen Inschriften aus dem 15. bis 19. Jahrhundert, einer der größten und besterhaltenen jüdischen Friedhöfe Europas.</p><p>Beim Spaziergang zwischen den alten Grabsteinen im Grünen spürt man eine Atmosphäre großer Ruhe und Respekt.</p>',
              plLong:'<p>178 nagrobków z hebrajskimi inskrypcjami z XV–XIX wieku, jeden z największych i najlepiej zachowanych cmentarzy żydowskich w Europie.</p><p>Spacerując wśród starych nagrobków w zieleni, wyczuwa się atmosferę wielkiego spokoju i szacunku.</p>',

            { order:6, name:'Faro Vecchio', emoji:'🔦', photo:'',
              it:'Storico faro costruito nel 1860 poco dopo l\'Unità d\'Italia.',
              en:'A historic lighthouse built in 1860 shortly after Italian Unification.',
              de:'Historischer Leuchtturm von 1860, kurz nach der Einigung Italiens erbaut.',
              pl:'Historyczna latarnia zbudowana w 1860 roku, wkrótce po zjednoczeniu Włoch.',
              itLong:'<p>Per oltre un secolo ha guidato le navi in ingresso nel porto di Ancona, diventando uno dei punti di riferimento più importanti della navigazione lungo la costa adriatica. Sebbene oggi non sia più operativo, continua a rappresentare uno dei simboli della vocazione marinara della città.</p><p>La posizione del faro è straordinaria: da qui lo sguardo abbraccia il porto commerciale, il centro storico, il Duomo, il Monte Conero e, nelle giornate più limpide, gran parte della costa marchigiana. Raggiungibile tramite una scalinata, regala una vista a 360° sulla città e su tutta la costa nord.</p>',
              enLong:'<p>For over a century it guided ships into the port of Ancona, becoming one of the most important navigation reference points along the Adriatic coast. Though no longer operational, it remains a symbol of the city\'s maritime vocation.</p><p>The lighthouse\'s position is extraordinary: from here the view takes in the commercial port, the historic centre, the Cathedral, Monte Conero and, on the clearest days, much of the Marche coast. Reachable via a staircase, it offers a 360° view over the city and the northern coast.</p>',
              deLong:'<p>Über ein Jahrhundert lang lenkte er Schiffe in den Hafen von Ancona. Heute nicht mehr in Betrieb, bleibt er ein Symbol der maritimen Berufung der Stadt.</p><p>Die Lage des Leuchtturms ist außergewöhnlich: Blick auf Hafen, Altstadt, Dom, Monte Conero und bei klarem Wetter einen Großteil der Küste der Marken.</p>',
              plLong:'<p>Przez ponad wiek prowadziła statki do portu w Ankonie. Choć dziś nieczynna, pozostaje symbolem morskiego charakteru miasta.</p><p>Położenie latarni jest niezwykłe: widok na port handlowy, centrum historyczne, katedrę, Monte Conero i przy dobrej pogodzie znaczną część wybrzeża Marchii.</p>',
              itTime:'15–20 minuti.',enTime:'15–20 minutes.',deTime:'15–20 Minuten.',plTime:'15–20 minut.',
              dist:'🚶 1100 m – 15 min', mapQuery:'Faro Vecchio Cardeto Ancona', lat:43.6233331, lng:13.5144794 },
            { order:7, name:'Ingresso Via Birarelli', emoji:'🚪', photo:'',

              en:'Entering here, right next to the Roman Amphitheatre, you find yourself immediately surrounded by the Mediterranean scrub that characterises the park.',
              de:'Wer hier eintritt, gleich neben dem römischen Amphitheater, befindet sich sofort inmitten der mediterranen Macchia des Parks.',

            { order:8, name:'Fortezza della Cittadella', emoji:'🏰', photo:'cittadella.jpg',
              it:'Punto di partenza del secondo percorso: la fortezza rinascimentale progettata nel 1532 da Antonio da Sangallo il Giovane per volontà di Papa Clemente VII, con lo scopo di rafforzare le difese della città dopo l\'annessione allo Stato Pontificio.',
              en:'The starting point of the second walk: the Renaissance fortress designed in 1532 by Antonio da Sangallo the Younger at the behest of Pope Clement VII, to strengthen the city\'s defences after its annexation to the Papal States.',
              de:'Ausgangspunkt der zweiten Route: die Renaissance-Festung von 1532, entworfen von Antonio da Sangallo dem Jüngeren im Auftrag von Papst Klemens VII.',
              pl:'Punkt startowy drugiej trasy: renesansowa twierdza zaprojektowana w 1532 roku przez Antonia da Sangallo Młodszego na polecenie papieża Klemensa VII.',
              itLong:'<p>La sua caratteristica pianta a cinque bastioni rappresenta uno dei migliori esempi dell\'evoluzione dell\'ingegneria militare del Cinquecento.</p><p>Oggi la Cittadella è un grande parco pubblico dove storia e natura convivono armoniosamente. Passeggiando tra i bastioni, i prati e gli alberi secolari si possono ancora riconoscere le antiche strutture difensive che per secoli hanno protetto Ancona.</p>',
              enLong:'<p>Its distinctive five-bastion layout is one of the finest examples of 16th-century military engineering.</p><p>Today the Cittadella is a large public park where history and nature coexist in harmony. Walking among the bastions, meadows and centuries-old trees, you can still make out the ancient defensive structures that protected Ancona for centuries.</p>',
              deLong:'<p>Der Fünf-Bastionen-Grundriss ist eines der besten Beispiele militärischer Ingenieurskunst des 16. Jahrhunderts.</p><p>Heute ist die Zitadelle ein großer öffentlicher Park, in dem Geschichte und Natur harmonisch zusammenleben.</p>',
              plLong:'<p>Plan pięciu bastionów to jeden z najlepszych przykładów XVI-wiecznej inżynierii wojskowej.</p><p>Dziś Cittadella to duży park publiczny, gdzie historia i natura współistnieją harmonijnie.</p>',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',

              it:'L\'ultima tappa regala la ricompensa migliore: una vista spettacolare sulla città e sul porto, da un punto panoramico ancora poco conosciuto.',

              itLong:'<p>Il panorama spazia dal porto al centro storico fino alle colline marchigiane, offrendo una prospettiva completamente diversa rispetto a quella del Colle Guasco o del Passetto.</p>',

        porto: [
            { name:'Porto Antico', emoji:'⚓', photo:'',
              it:'Il Porto Antico è il luogo dove Ancona continua a vivere il suo rapporto millenario con il mare.',
              en:'The Old Port is where Ancona keeps living its millennia-old relationship with the sea.',
              de:'Der Alte Hafen ist der Ort, an dem Ancona seine jahrtausendealte Beziehung zum Meer weiterlebt.',
              pl:'Stary Port to miejsce, w którym Ankona wciąż pielęgnuje swój tysiącletni związek z morzem.',
              itLong:'<p>A differenza di molti porti storici trasformati esclusivamente in aree turistiche, quello di Ancona conserva ancora oggi una straordinaria vitalità: navi commerciali, traghetti diretti verso Grecia, Croazia e Albania, pescherecci e imbarcazioni da diporto convivono ogni giorno nello stesso scenario.</p><p>Passeggiando lungo le banchine si percepisce come il porto non sia soltanto un monumento del passato, ma un\'infrastruttura viva che continua a rappresentare il cuore economico della città e la più grande azienda della regione.</p><p>È proprio questa continuità tra storia e presente a rendere Ancona diversa da molte altre città marinare italiane: qui il mare non è soltanto un panorama, ma continua a essere parte integrante della vita quotidiana. Dal porto si possono inoltre ammirare alcuni dei monumenti più importanti della città, con il Duomo che domina il Colle Guasco e gli archi monumentali che raccontano quasi duemila anni di storia.</p>',
              enLong:'<p>Unlike many historic ports turned exclusively into tourist areas, Ancona\'s still preserves extraordinary vitality today: cargo ships, ferries to Greece, Croatia and Albania, fishing boats and pleasure craft coexist daily within the same scene.</p><p>Walking along the quays you sense that the port is not just a monument of the past, but a living infrastructure that remains the economic heart of the city and the region\'s largest employer.</p><p>It is exactly this continuity between past and present that sets Ancona apart from many other Italian maritime cities: here the sea is not just scenery, but remains an integral part of daily life. From the port you can also admire some of the city\'s most important monuments, with the Cathedral crowning the Guasco Hill and the monumental arches recounting almost two thousand years of history.</p>',
              deLong:'<p>Handelsschiffe, Fähren nach Griechenland, Kroatien und Albanien, Fischerboote und Freizeitboote existieren hier täglich nebeneinander.</p><p>Beim Spaziergang entlang der Kais spürt man, dass der Hafen nicht nur ein Denkmal der Vergangenheit ist, sondern eine lebendige Infrastruktur, die weiterhin das wirtschaftliche Herz der Stadt darstellt.</p>',
              plLong:'<p>Statki handlowe, promy do Grecji, Chorwacji i Albanii, kutry rybackie i łodzie rekreacyjne współistnieją tu na co dzień.</p><p>Spacerując wzdłuż nabrzeży, wyczuwa się, że port to nie tylko pomnik przeszłości, lecz żywa infrastruktura, wciąż stanowiąca gospodarcze serce miasta.</p>',
              itNote:'Osservate le navi traghetto: alcune superano i 200 metri di lunghezza.',
              enNote:'Notice the ferries: some exceed 200 metres in length.',
              deNote:'Fähren beobachten: Einige überschreiten 200 Meter.',
              plNote:'Promy: niektóre przekraczają 200 metrów.',
              itPhoto:'Dal lungomare Vanvitelli con le navi in primo piano e il Duomo sul Colle Guasco.',
              enPhoto:'From Lungomare Vanvitelli with ships in front and the Cathedral on Guasco hill.',
              dePhoto:'Lungomare Vanvitelli mit Schiffen und Dom.',
              plPhoto:'Lungomare Vanvitelli ze statkami i Katedrą.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',
              dist:'🚶 700 m – 10 min', mapQuery:'Porto di Ancona', lat:43.623538, lng:13.509578 },
            { name:'Mole Vanvitelliana (Lazzaretto)', emoji:'🏛️', photo:'mole-vanvitelliana.jpg',
              it:'Uno degli edifici più affascinanti e originali di Ancona.',
              en:'One of Ancona\'s most fascinating and original buildings.',
              de:'Eines der faszinierendsten und originellsten Gebäude Anconas.',
              pl:'Jeden z najbardziej fascynujących i oryginalnych budynków Ankony.',
              itLong:'<p>Progettata nel Settecento da Luigi Vanvitelli, sorge su un\'isola artificiale pentagonale collegata alla terraferma da un ponte. La sua particolare forma rispondeva a esigenze sia sanitarie sia difensive: qui venivano poste in quarantena persone e merci provenienti dai porti del Mediterraneo, contribuendo a proteggere la città dalla diffusione delle epidemie.</p><p>Nel corso dei secoli la Mole ha avuto numerose funzioni, da deposito militare a ospedale, fino a trasformarsi nell\'attuale polo culturale che ospita mostre, concerti, festival ed eventi.</p><p>Passeggiando nel grande cortile interno si percepisce tutta l\'armonia del progetto vanvitelliano, considerato uno dei più significativi esempi di architettura illuminista in Italia. La sera, quando l\'edificio si riflette nelle acque del porto, la Mole offre uno degli scorci più suggestivi di Ancona. Nelle sere d\'estate si svolge una apprezzata rassegna di cinema all\'aperto.</p><p><b>Da non perdere:</b> Il Museo Tattile Statale Omero, unico in Italia, permette di toccare le opere d\'arte.</p>',
              enLong:'<p>Designed in the 18th century by Luigi Vanvitelli, it stands on a pentagonal artificial island connected to the mainland by a bridge. Its distinctive shape met both sanitary and defensive needs: here people and goods arriving from Mediterranean ports were placed in quarantine, helping protect the city from the spread of epidemics.</p><p>Over the centuries the Mole served many functions, from military depot to hospital, before becoming today\'s cultural hub hosting exhibitions, concerts, festivals and events.</p><p>Walking through the large inner courtyard you can feel the full harmony of Vanvitelli\'s design, considered one of the most significant examples of Enlightenment architecture in Italy. In the evening, reflected in the port waters, the Mole offers one of Ancona\'s most evocative views. On summer evenings it hosts a well-loved open-air cinema season.</p><p><b>Not to miss:</b> The Museo Tattile Statale Omero, unique in Italy, allows you to touch artworks.</p>',
              deLong:'<p>Im 18. Jahrhundert von Luigi Vanvitelli auf einer fünfeckigen künstlichen Insel entworfen. Die besondere Form diente sowohl sanitären als auch verteidigungstechnischen Zwecken.</p><p>Im Laufe der Jahrhunderte diente die Mole vielen Zwecken, vom Militärdepot bis zum Krankenhaus, bevor sie zum heutigen Kulturzentrum wurde. Abends spiegelt sie sich im Hafenwasser; im Sommer Freiluftkino.</p><p><b>Nicht verpassen:</b> Museo Tattile Statale Omero.</p>',
              plLong:'<p>Zaprojektowana w XVIII wieku przez Luigiego Vanvitelliego na sztucznej pięciokątnej wyspie. Jej szczególny kształt odpowiadał potrzebom sanitarnym i obronnym.</p><p>Na przestrzeni wieków Mole pełniła wiele funkcji, od magazynu wojskowego po szpital, zanim stała się dzisiejszym centrum kulturalnym. Wieczorem odbija się w wodach portu; latem odbywa się tu kino plenerowe.</p><p><b>Nie przegap:</b> Museo Tattile Statale Omero.</p>',
              deLong:'<p>Im Laufe der Jahrhunderte diente die Mole vielen Zwecken, vom Militärdepot bis zum Krankenhaus, bevor sie zum heutigen Kulturzentrum wurde. Abends spiegelt sie sich im Hafenwasser und bietet einen der eindrucksvollsten Ausblicke Anconas; im Sommer Freiluftkino.</p><p><b>Nicht verpassen:</b> Museo Tattile Statale Omero.</p>',
              plLong:'<p>Na przestrzeni wieków Mole pełniła wiele funkcji, od magazynu wojskowego po szpital, zanim stała się dzisiejszym centrum kulturalnym. Wieczorem odbija się w wodach portu, oferując jeden z najbardziej sugestywnych widoków Ankony; latem odbywa się tu kino plenerowe.</p><p><b>Nie przegap:</b> Museo Tattile Statale Omero.</p>',
              itNote:'La planimetria pentagonale è visibile dall\'alto: cercate una foto aerea.',
              enNote:'The pentagonal plan is visible from above: look for an aerial photo.',
              deNote:'Der fünfeckige Grundriss von oben sichtbar.',
              plNote:'Pięciokątny rzut widoczny z góry.',
              itPhoto:'Dal lungomare al tramonto con la Mole illuminata riflessa nell\'acqua.',
              enPhoto:'From the seafront at sunset with the illuminated Mole reflected in the water.',
              dePhoto:'Von der Promenade bei Sonnenuntergang.',
              plPhoto:'Z promenady o zachodzie słońca.',
              itTime:'20–30 min (esterno). 1 ora con Museo Tattile.',
              enTime:'20–30 min (exterior). 1h with Museo Tattile.',
              deTime:'20–30 Min. (außen). 1 Std. mit Museum.',
              plTime:'20–30 min (zewnątrz). 1 godz. z muzeum.',
              dist:'🚶 1100 m – 14 min', mapQuery:'Mole Vanvitelliana Ancona', lat:43.6143735, lng:13.504058,
              extraMap:{ label:'🖐️ Museo Tattile Omero', query:'Museo Tattile Statale Omero Ancona' } },
            { name:'Marina Dorica', emoji:'⛵', photo:'',
              it:'Uno dei più grandi porti turistici dell\'Adriatico e il lato più moderno della vocazione marinara di Ancona.',
              en:'One of the largest tourist marinas on the Adriatic and the most modern side of Ancona\'s maritime vocation.',
              de:'Einer der größten Yachthäfen der Adria und die moderne Seite von Anconas maritimer Tradition.',
              pl:'Jedna z największych przystani turystycznych na Adriatyku i najbardziej nowoczesna strona morskiej tradycji Ankony.',
              itLong:'<p>Qui si alternano barche a vela, yacht, ristoranti e una piacevole passeggiata sul mare, ideale per rilassarsi lontano dal traffico del centro.</p><p>Inaugurata negli anni Novanta, Marina Dorica è diventata rapidamente uno dei principali approdi turistici del Medio Adriatico. Ospita centinaia di imbarcazioni da diporto provenienti da tutta Europa ed è spesso punto di partenza per regate e manifestazioni veliche internazionali.</p><p>L\'area è stata progettata non solo come porto, ma anche come spazio aperto alla città. Passeggiando lungo le banchine si possono osservare eleganti barche a vela, yacht e numerose attività legate al mare.</p>',
              enLong:'<p>Sailing boats, yachts, restaurants and a pleasant seafront walk alternate here, ideal for relaxing away from the centre\'s traffic.</p><p>Inaugurated in the 1990s, Marina Dorica quickly became one of the main tourist harbours of the central Adriatic. It hosts hundreds of pleasure boats from across Europe and is often the starting point for international regattas and sailing events.</p><p>The area was designed not only as a harbour but as a space open to the city. Walking along the quays you can admire elegant sailing boats, yachts and numerous sea-related activities.</p>',
              deLong:'<p>Segelboote, Yachten, Restaurants und eine angenehme Uferpromenade abseits des Verkehrs im Zentrum.</p><p>In den 1990er Jahren eröffnet, wurde Marina Dorica schnell zu einem der wichtigsten Touristenhäfen der mittleren Adria. Hunderte Freizeitboote aus ganz Europa, oft Ausgangspunkt für internationale Regatten.</p>',
              plLong:'<p>Żaglówki, jachty, restauracje i przyjemna promenada nadmorska, z dala od ruchu w centrum.</p><p>Otwarta w latach 90. XX wieku, Marina Dorica szybko stała się jedną z głównych przystani turystycznych środkowego Adriatyku. Setki jachtów z całej Europy, często punkt startowy regat międzynarodowych.</p>',
              deLong:'<p>In den 1990er Jahren eröffnet, wurde Marina Dorica schnell zu einem der wichtigsten Touristenhäfen der mittleren Adria. Hunderte Freizeitboote aus ganz Europa, oft Ausgangspunkt für internationale Regatten.</p>',
              plLong:'<p>Otwarta w latach 90. XX wieku, Marina Dorica szybko stała się jedną z głównych przystani turystycznych środkowego Adriatyku. Setki jachtów z całej Europy, często punkt startowy regat międzynarodowych.</p>',
              itNote:'Nelle giornate di sole fermatevi in uno dei locali affacciati sull\'acqua, oppure passeggiate ammirando il via vai delle imbarcazioni.',

              deNote:'An sonnigen Tagen in einem der Lokale am Wasser verweilen oder einfach die Boote beobachten.',
              plNote:'W słoneczne dni warto zatrzymać się w jednym z lokali nad wodą lub po prostu obserwować łodzie.',
              itTime:'20–30 minuti.',enTime:'20–30 minutes.',deTime:'20–30 Minuten.',plTime:'20–30 minut.',

              it:'Lunga spiaggia di sabbia finissima, fondali bassi, ideale per famiglie. Con bus A, B e C da piazza Roma. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Orari Conerobus ↗</a>',

            { name:'Mezzavalle', emoji:'🏝️', photo:'',
              it:'Mezzavalle è una delle spiagge più spettacolari delle Marche.',
              en:'Mezzavalle is one of the most spectacular beaches in the Marche.',
              de:'Mezzavalle ist einer der spektakulärsten Strände der Marken.',
              pl:'Mezzavalle to jedna z najbardziej spektakularnych plaż w Marchii.',
              itLong:'<p>Selvaggia e priva di stabilimenti balneari, conserva un ambiente naturale quasi incontaminato, con acque limpide, falesie bianche e macchia mediterranea che arriva a lambire una lunga spiaggia di ciottoli. Raggiungibile esclusivamente a piedi attraverso un ripido sentiero panoramico oppure via mare.</p><p>La spiaggia si estende per oltre un chilometro ai piedi della falesia e regala panorami di rara bellezza. Le acque, generalmente limpide e trasparenti, invitano a fare snorkeling e lunghe nuotate. Proprio l\'assenza di strutture turistiche ha permesso a questo luogo di mantenere il suo fascino originario.</p><p>Raggiungibile a piedi dal belvedere di Portonovo (30 min) o con bus 94 da piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Orari Conerobus ↗</a></p>',
              enLong:'<p>Wild and free of beach establishments, it preserves an almost untouched natural environment, with clear waters, white cliffs and Mediterranean scrub reaching down to a long pebble beach. Reachable only on foot via a steep scenic path, or by sea.</p><p>The beach stretches for over a kilometre at the foot of the cliff, offering views of rare beauty. Its generally clear, transparent waters invite snorkelling and long swims. It is precisely the absence of tourist facilities that has allowed this place to keep its original charm.</p><p>Reachable on foot from the Portonovo belvedere (30 min) or by bus 94 from Piazza Cavour. <a href="https://www.conerobus.it/orari/" target="_blank" rel="noopener noreferrer">Conerobus timetables ↗</a></p>',
              deLong:'<p>Wild und ohne Strandeinrichtungen, mit klarem Wasser, weißen Klippen und mediterraner Macchia bis zum langen Kiesstrand. Nur zu Fuß über einen steilen Panoramapfad oder vom Meer aus erreichbar.</p><p>Der Strand erstreckt sich über einen Kilometer am Fuße der Klippe. Kein Tourismus hat den ursprünglichen Charme bewahrt.</p>',
              plLong:'<p>Dzika i pozbawiona infrastruktury plażowej, z krystaliczną wodą, białymi klifami i śródziemnomorskimi zaroślami sięgającymi długiej plaży kamyków. Dostępna tylko pieszo stromą, malowniczą ścieżką lub od strony morza.</p><p>Plaża rozciąga się na ponad kilometr u podnóża klifu. Brak infrastruktury turystycznej pozwolił zachować oryginalny urok.</p>',
              itNote:'Portate tutto il necessario: acqua, cibo, protezione solare. Non ci sono servizi.',
              enNote:'Bring everything: water, food, sun protection. No services on the beach.',
              deNote:'Alles mitnehmen: Wasser, Essen, Sonnenschutz.',
              plNote:'Zabierzcie wszystko: wodę, jedzenie, krem.',
              itPhoto:'Dal sentiero in discesa con spiaggia e falesie in vista.',
              enPhoto:'From the path descending with beach and cliffs in view.',
              dePhoto:'Vom Abstiegspfad mit Strand und Klippen.',
              plPhoto:'Ze szlaku z widokiem plaży i klifów.',
              dist:'🚌 Bus 94 + 🚶 30 min', mapQuery:'Spiaggia di Mezzavalle Ancona', lat:43.5703347, lng:13.5734488 },
            { name:'Spiaggia delle Due Sorelle', emoji:'🏝️', photo:'',
              it:'La Spiaggia delle Due Sorelle è considerata una delle più belle d\'Italia.',
              en:'The Due Sorelle beach is considered one of the most beautiful in Italy.',
              de:'Der Strand der Due Sorelle gilt als einer der schönsten Italiens.',
              pl:'Plaża Due Sorelle uważana jest za jedną z najpiękniejszych we Włoszech.',
              itLong:'<p>Selvaggia, incontaminata e raggiungibile esclusivamente via mare, prende il nome dai due caratteristici faraglioni bianchi che emergono dall\'acqua. Ai piedi delle imponenti falesie del Monte Conero si apre questa spettacolare spiaggia di ciottoli bianchi, lambita da un mare trasparente dai colori che variano dal turchese al blu intenso.</p><p>L\'assenza di edifici e strade ha permesso di conservare un ambiente naturale praticamente intatto. Durante l\'estate è raggiungibile con i battelli in partenza da Numana o Portonovo, oppure con escursioni organizzate.</p><p>Le Due Sorelle rappresentano il simbolo naturalistico della Riviera del Conero e sono uno dei luoghi più fotografati delle Marche.</p>',
              enLong:'<p>Wild, unspoilt and reachable only by sea, it takes its name from the two distinctive white sea stacks emerging from the water. At the foot of Monte Conero\'s towering cliffs lies this spectacular white pebble beach, lapped by transparent waters ranging from turquoise to deep blue.</p><p>The absence of buildings and roads has kept this environment practically untouched. In summer it can be reached by boats departing from Numana or Portonovo, or with organised excursions.</p><p>The Due Sorelle are the natural symbol of the Riviera del Conero and one of the most photographed spots in the Marche.</p>',
              deLong:'<p>Wild, unberührt und nur vom Meer aus erreichbar, benannt nach den zwei markanten weißen Felsnadeln, die aus dem Wasser ragen. Am Fuße der imposanten Klippen des Monte Conero, mit türkis- bis tiefblauem Wasser.</p><p>Das Fehlen von Gebäuden und Straßen hat diese Umgebung praktisch unberührt erhalten.</p>',
              plLong:'<p>Dzika, dziewicza i dostępna wyłącznie od strony morza, zawdzięcza nazwę dwóm charakterystycznym białym skałom wyłaniającym się z wody. U podnóża potężnych klifów Monte Conero, z przejrzystą wodą w odcieniach turkusu i głębokiego błękitu.</p><p>Brak budynków i dróg pozwolił zachować to środowisko praktycznie nietknięte.</p>',
              itNote:'I due faraglioni: l\'immagine simbolo del Parco del Conero.',
              enNote:'The two sea stacks: the iconic image of the Parco del Conero.',
              deNote:'Die zwei Felsnadeln: das Wahrzeichen des Parco del Conero.',
              plNote:'Dwa faragliony: symbol Parco del Conero.',
              itPhoto:'Dalla barca durante l\'avvicinamento con i faraglioni in primo piano.',
              enPhoto:'From the boat approaching with the sea stacks in front.',
              dePhoto:'Vom Boot mit Felsnadeln.',

            { name:'Spiaggia del Molo (Portonovo)', emoji:'🌊', photo:'',
              it:'La Spiaggia del Molo è il cuore di Portonovo: un\'ampia spiaggia di ciottoli bianchi bagnata da un mare limpido, dominata dal Monte Conero e caratterizzata dalla presenza dello storico molo.',
              en:'The Spiaggia del Molo is the heart of Portonovo: a wide beach of white pebbles washed by clear water, dominated by Monte Conero and marked by the presence of the historic pier.',
              de:'Die Spiaggia del Molo ist das Herz von Portonovo: ein breiter Strand aus weißen Kieseln mit klarem Wasser, überragt vom Monte Conero und geprägt vom historischen Pier.',
              pl:'Spiaggia del Molo to serce Portonovo: szeroka plaża z białych kamyków obmywana przejrzystą wodą, zdominowana przez Monte Conero i charakterystyczne historyczne molo.',
              itLong:'<p>È la spiaggia più frequentata della baia e rappresenta il punto di riferimento per chi visita Portonovo. Qui si alternano stabilimenti balneari e tratti di spiaggia libera, con numerosi ristoranti affacciati sul mare e tutti i principali servizi facilmente raggiungibili.</p><p>Il caratteristico molo, utilizzato dalle piccole imbarcazioni dei pescatori, dona alla baia uno degli scorci più fotografati della Riviera del Conero. Grazie alle acque trasparenti e ai fondali ricchi di vita marina, la zona è apprezzata anche dagli amanti dello snorkeling.</p>',
              enLong:'<p>It is the most popular beach in the bay and the main reference point for visitors to Portonovo. Beach clubs alternate with free stretches, with numerous seafront restaurants and all main services close at hand.</p><p>The distinctive pier, used by small fishing boats, gives the bay one of the most photographed views on the Riviera del Conero. Thanks to clear waters and seabeds rich in marine life, the area is also popular with snorkellers.</p>',
              itNote:'Il panorama sul Monte Conero, il caratteristico molo, le acque limpide ideali per bagno e snorkeling, l\'atmosfera nelle prime ore del mattino e al tramonto.',
              enNote:'The view of Monte Conero, the distinctive pier, clear waters ideal for swimming and snorkelling, the atmosphere in the early morning and at sunset.',
              deNote:'Der Blick auf den Monte Conero, der charakteristische Pier, klares Wasser zum Baden und Schnorcheln.',
              plNote:'Widok na Monte Conero, charakterystyczne molo, czysta woda idealna do pływania i snorkelingu.',
              dist:'🚌 12 km – 25 min', mapQuery:'Spiaggia del Molo Portonovo', lat:43.5647320, lng:13.5910247 },
            { name:'Spiaggia della Torre (Portonovo)', emoji:'🗼', photo:'',
              it:'Dominata dalla Torre De Bosis e affacciata sullo Scoglio della Vela, è una delle spiagge più suggestive della Riviera del Conero, dove il paesaggio unisce mare cristallino, falesie e macchia mediterranea.',
              en:'Dominated by the Torre De Bosis and facing the Scoglio della Vela, this is one of the most evocative beaches on the Riviera del Conero, where the landscape blends crystal-clear sea, cliffs and Mediterranean scrub.',
              de:'Überragt vom Torre De Bosis und mit Blick auf den Scoglio della Vela, ist dies einer der eindrucksvollsten Strände der Riviera del Conero.',
              pl:'Zdominowana przez wieżę Torre De Bosis i z widokiem na Scoglio della Vela, to jedna z najbardziej sugestywnych plaż Riviera del Conero.',
              itLong:'<p>Situata all\'estremità meridionale della baia di Portonovo, la Spiaggia della Torre prende il nome dalla storica Torre De Bosis, costruita a fine Ottocento sul promontorio che domina la costa. Da qui lo sguardo spazia fino allo scenografico Scoglio della Vela, uno dei punti più caratteristici del litorale del Conero.</p><p>La spiaggia, composta da ciottoli bianchi levigati dal mare, offre acque limpide e fondali ideali per il nuoto e lo snorkeling. È un luogo particolarmente apprezzato da chi cerca un ambiente più tranquillo, immerso nella natura del Parco del Conero.</p>',
              enLong:'<p>Located at the southern end of the Portonovo bay, the Spiaggia della Torre takes its name from the historic Torre De Bosis, built in the late 19th century on the headland overlooking the coast. From here the view stretches to the scenic Scoglio della Vela, one of the most distinctive features of the Conero coastline.</p><p>The beach, made of white sea-smoothed pebbles, offers clear waters and seabeds ideal for swimming and snorkelling, especially loved by those seeking a quieter setting within the Parco del Conero.</p>',
              itNote:'La Torre De Bosis, lo Scoglio della Vela, il panorama sulla baia di Portonovo, le acque cristalline.',
              enNote:'The Torre De Bosis, the Scoglio della Vela, the view over the Portonovo bay, the crystal-clear waters.',
              deNote:'Der Torre De Bosis, der Scoglio della Vela, der Blick auf die Bucht von Portonovo.',
              plNote:'Torre De Bosis, Scoglio della Vela, widok na zatokę Portonovo, krystaliczna woda.',
              dist:'🚌 12 km – 25 min', mapQuery:'Spiaggia della Torre Portonovo', lat:43.5635807, lng:13.5977443,
              extraMap:{ label:'🎥 Webcam Spiaggia Bonetti', url:'https://vedetta.org/webcam/italia/marche/ancona/portonovo-spiaggia/' } },
            { name:'Spiaggia della Vela', emoji:'⛵', photo:'',
              it:'La Spiaggia della Vela è una delle spiagge più selvagge e affascinanti della Riviera del Conero.',
              en:'The Spiaggia della Vela is one of the wildest and most fascinating beaches on the Riviera del Conero.',
              de:'Die Spiaggia della Vela ist einer der wildesten und faszinierendsten Strände der Riviera del Conero.',
              pl:'Spiaggia della Vela to jedna z najbardziej dzikich i fascynujących plaż Riviera del Conero.',
              itLong:'<p>Prende il nome dall\'inconfondibile Scoglio della Vela, un faraglione che emerge dal mare con una caratteristica forma triangolare, diventato uno dei simboli della costa anconetana.</p><p>Raggiungibile esclusivamente via mare, offre acque cristalline, fondali ricchi di vita marina e un ambiente incontaminato, ideale per chi ama lo snorkeling e la natura più autentica. La vista dello Scoglio della Vela, incorniciato dalle alte falesie del Monte Conero, regala uno degli scorci più spettacolari di tutta la Riviera.</p>',
              enLong:'<p>It takes its name from the unmistakable Scoglio della Vela, a sea stack rising from the water with a distinctive triangular shape, which has become one of the symbols of the Ancona coast.</p><p>Reachable only by sea, it offers crystal-clear waters, seabeds rich in marine life and an unspoilt environment, ideal for snorkelling and authentic nature. The view of the Scoglio della Vela, framed by the high cliffs of Monte Conero, is one of the most spectacular sights on the whole Riviera.</p>',
              deLong:'<p>Benannt nach dem unverwechselbaren Scoglio della Vela, einer dreieckigen Felsnadel, die zu einem Symbol der Küste Anconas geworden ist.</p><p>Nur vom Meer aus erreichbar, mit kristallklarem Wasser und einer unberührten Umgebung.</p>',
              plLong:'<p>Nazwana od charakterystycznego Scoglio della Vela — skały o trójkątnym kształcie, która stała się symbolem wybrzeża Ankony.</p><p>Dostępna wyłącznie od strony morza, z krystaliczną wodą i dziewiczym otoczeniem.</p>',
              itTime:'Mezza giornata (escursione in barca).',enTime:'Half a day (boat excursion).',deTime:'Halber Tag (Bootsausflug).',plTime:'Pół dnia (wycieczka łodzią).',
              dist:'⛵ Solo via mare', mapQuery:'Spiaggia della Vela Conero', lat:43.5594192, lng:13.6059019 }
